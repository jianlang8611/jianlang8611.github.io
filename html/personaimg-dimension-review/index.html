<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaIMG Round 2 · Final Dimension Question Review</title>
  <style>
    :root {
      --ink: #18201d;
      --muted: #64706a;
      --line: #d8dfdb;
      --paper: #ffffff;
      --canvas: #f5f7f5;
      --header: #202925;
      --green: #087a5b;
      --green-dark: #086047;
      --green-pale: #e8f4ef;
      --amber: #a05a09;
      --amber-pale: #fff6e8;
      --rose: #aa3547;
      --rose-pale: #fff0f2;
      --shadow: 0 7px 22px rgba(27, 45, 37, .07);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(8, 122, 91, .22); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .site-header { background: var(--header); color: #fff; border-bottom: 4px solid var(--green); }
    .header-inner { max-width: 1480px; margin: 0 auto; padding: 25px 32px 23px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 28px; }
    .product-mark { margin: 0 0 5px; color: #8dd6bc; font-size: 12px; font-weight: 800; letter-spacing: 0; text-transform: uppercase; }
    h1 { margin: 0; font-size: 27px; letter-spacing: 0; }
    .instruction { max-width: 900px; margin: 7px 0 0; color: #dbe5e0; font-size: 14px; }
    .summary { min-width: 250px; text-align: right; }
    .summary .label { display: block; color: #afbeb7; font-size: 12px; }
    .summary strong { display: block; font-size: 22px; }
    .summary-detail { display: block; margin-top: 2px; color: #dbe5e0; font-size: 12px; }

    main { max-width: 1480px; margin: 0 auto; padding: 22px 32px 52px; }
    .reviewer-panel { display: grid; grid-template-columns: minmax(230px, 380px) minmax(0, 1fr); align-items: end; gap: 22px; margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .field input, .search, .comment { width: 100%; border: 1px solid #b9c7c0; border-radius: 5px; background: #fff; color: var(--ink); padding: 9px 10px; }
    .reviewer-copy { margin: 0; color: var(--muted); font-size: 13px; }
    .reviewer-copy strong { color: var(--ink); }

    .toolbar { display: grid; grid-template-columns: minmax(230px, 420px) minmax(0, 1fr); gap: 16px; align-items: center; margin-bottom: 17px; }
    .toolbar-actions { display: flex; justify-content: end; gap: 9px; flex-wrap: wrap; }
    .button { min-height: 38px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); padding: 8px 13px; font-size: 13px; font-weight: 750; }
    .button:hover { border-color: var(--green); color: var(--green); }
    .button.active { border-color: var(--green); background: var(--green-pale); color: var(--green-dark); }
    .button.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button.primary:hover { background: var(--green-dark); color: #fff; }
    .archive-link { display: inline-flex; align-items: center; min-height: 38px; color: var(--green-dark); font-size: 13px; font-weight: 750; text-decoration: none; }
    .archive-link:hover { text-decoration: underline; }
    .save-status { min-height: 22px; margin: -6px 0 15px; color: var(--muted); font-size: 12px; }

    .category-tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 20px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
    .category-tab { min-height: 70px; border: 0; border-right: 1px solid var(--line); background: var(--paper); color: var(--muted); padding: 9px 12px; text-align: left; }
    .category-tab:last-child { border-right: 0; }
    .category-tab:hover { background: #fafcfb; }
    .category-tab[aria-selected="true"] { color: var(--ink); background: var(--green-pale); box-shadow: inset 0 -3px 0 var(--green); }
    .tab-zh { display: block; font-size: 15px; font-weight: 800; }
    .tab-en { display: block; font-size: 12px; }
    .tab-count { display: block; margin-top: 2px; color: var(--green-dark); font-size: 11px; font-weight: 750; }
    .tab-count.has-question { color: var(--rose); }

    .category-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; margin: 7px 0 13px; }
    .category-heading h2 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .category-heading h2 span { color: var(--muted); font-size: 15px; font-weight: 500; }
    .category-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .group-list { display: grid; gap: 12px; }
    .group { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); box-shadow: 0 3px 11px rgba(27, 45, 37, .04); overflow: hidden; }
    .group-header { width: 100%; min-height: 61px; border: 0; background: var(--paper); color: var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 15px; padding: 12px 17px; text-align: left; }
    .group-header:hover { background: #fafcfb; }
    .group-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
    .group-title strong { font-size: 15px; }
    .group-title span, .group-kind { color: var(--muted); font-size: 12px; }
    .group-status { color: var(--green-dark); font-size: 12px; font-weight: 800; text-align: right; }
    .group-status.has-question { color: var(--rose); }
    .chevron { width: 24px; height: 24px; color: var(--green); display: grid; place-items: center; font-size: 16px; }
    .group-body { border-top: 1px solid var(--line); padding: 16px; }
    .dimension-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }

    .dimension-card { min-width: 0; min-height: 286px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 16px; display: flex; flex-direction: column; gap: 9px; }
    .dimension-card.questioned { border-color: #dc909c; box-shadow: inset 4px 0 0 var(--rose), 0 5px 14px rgba(170, 53, 71, .08); background: #fffdfd; }
    .card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .dimension-label { margin: 0 0 5px; color: var(--green-dark); font-size: 10px; font-weight: 850; letter-spacing: 0; text-transform: uppercase; }
    .dimension-title { margin: 0; font-size: 16px; line-height: 1.28; letter-spacing: 0; overflow-wrap: anywhere; }
    .dimension-title .en { display: block; }
    .dimension-title .zh { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .question-button { min-width: 88px; min-height: 34px; border: 1px solid #d0a1a8; border-radius: 5px; background: var(--rose-pale); color: #922d3d; padding: 6px 9px; font-size: 12px; font-weight: 850; }
    .question-button:hover, .question-button[aria-pressed="true"] { border-color: var(--rose); background: var(--rose); color: #fff; }
    .intro { margin: 0; color: #34433c; font-size: 13px; line-height: 1.57; }
    .values { margin-top: auto; }
    .values-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .value-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .value { min-width: 0; border: 1px solid #cdd8d3; border-radius: 4px; background: #f8faf9; color: #34473e; padding: 5px 6px; }
    .value-en { display: block; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; line-height: 1.32; }
    .value-zh { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.34; overflow-wrap: anywhere; }
    .comment-wrap { display: grid; gap: 5px; border-top: 1px solid #efd3d7; padding-top: 9px; }
    .comment-wrap label { color: #8e3040; font-size: 11px; font-weight: 800; }
    .comment { min-height: 84px; resize: vertical; line-height: 1.45; font-size: 13px; }
    .comment.invalid { border-color: var(--rose); background: var(--rose-pale); }
    .empty { border: 1px dashed #b7c7bf; background: var(--paper); color: var(--muted); padding: 30px; text-align: center; }

    dialog { width: min(480px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 6px; padding: 0; color: var(--ink); box-shadow: 0 20px 64px rgba(23, 33, 28, .25); }
    dialog::backdrop { background: rgba(20, 29, 25, .48); }
    .dialog-body { padding: 21px; }
    .dialog-body h2 { margin: 0; font-size: 19px; }
    .dialog-body p { margin: 7px 0 16px; color: var(--muted); font-size: 13px; }
    .dialog-actions { display: flex; justify-content: end; gap: 9px; margin-top: 15px; }
    .form-error { min-height: 18px; margin: 6px 0 0; color: var(--rose); font-size: 12px; }

    @media (max-width: 1100px) {
      .category-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .category-tab:nth-child(3) { border-right: 0; }
      .category-tab:nth-child(-n + 3) { border-bottom: 1px solid var(--line); }
      .dimension-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .header-inner, main { padding-left: 16px; padding-right: 16px; }
      .header-inner, .reviewer-panel, .toolbar { grid-template-columns: 1fr; }
      .summary { text-align: left; }
      .toolbar-actions { justify-content: start; }
      .category-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .category-tab { border-bottom: 1px solid var(--line); }
      .category-tab:nth-child(2n) { border-right: 0; }
      .category-tab:nth-child(5), .category-tab:nth-child(6) { border-bottom: 0; }
      .category-heading { align-items: flex-start; flex-direction: column; }
      .dimension-grid { grid-template-columns: 1fr; }
      .group-header { grid-template-columns: minmax(0, 1fr) auto; gap: 7px; padding: 11px 13px; }
      .group-kind { display: none; }
      .group-status { grid-column: 1; text-align: left; }
      .chevron { grid-column: 2; grid-row: 1 / span 2; }
      .group-body { padding: 11px; }
      .value-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="product-mark">PersonaIMG · Human Audit Round 2</p>
        <h1>Final Dimension Question Review</h1>
        <p class="instruction">本轮只检查已经 final 的 dimension。没有疑问无需操作；如发现定义、命名、值域、重复、冲突或层级问题，请点击卡片上的“是否有疑问”并写明原因。</p>
      </div>
      <div class="summary" aria-live="polite">
        <span class="label">已标记疑问</span>
        <strong id="overall-progress">0 / 0</strong>
        <span class="summary-detail" id="summary-detail"></span>
      </div>
    </div>
  </header>

  <main>
    <section class="reviewer-panel" aria-label="审核者信息">
      <div class="field">
        <label for="reviewer-name">审核者英文姓名</label>
        <input id="reviewer-name" autocomplete="name" placeholder="例如 Jane Doe">
      </div>
      <p class="reviewer-copy"><strong>提交方式：</strong>评论会自动保存在当前浏览器。完成后导出 JSON；文件名会包含你的英文姓名和 <code>round2_final_dimension_questions</code>，用于区分第一轮选择结果。</p>
    </section>

    <section class="toolbar" aria-label="审核控制">
      <input class="search" id="search" type="search" placeholder="搜索 dimension、中英文值或评论">
      <div class="toolbar-actions">
        <button class="button active" id="show-all" type="button">显示全部</button>
        <button class="button" id="show-questions" type="button">仅看有疑问</button>
        <button class="button" id="expand-all" type="button">展开当前大类</button>
        <button class="button" id="collapse-all" type="button">收起当前大类</button>
        <a class="archive-link" href="./round1_dimension_selection.html">第一轮页面</a>
        <button class="button primary" id="export" type="button">导出疑问 JSON</button>
      </div>
    </section>
    <p class="save-status" id="save-status" aria-live="polite"></p>
    <nav class="category-tabs" id="category-tabs" aria-label="大类"></nav>
    <section id="review-area" aria-live="polite"></section>
  </main>

  <dialog id="reviewer-dialog" aria-labelledby="reviewer-dialog-title">
    <form class="dialog-body" id="reviewer-form" method="dialog" novalidate>
      <h2 id="reviewer-dialog-title">开始第二轮审核</h2>
      <p>请输入英文姓名。该姓名会写入导出结果并加入文件名。</p>
      <div class="field"><label for="reviewer-dialog-name">英文姓名</label><input id="reviewer-dialog-name" autocomplete="name" placeholder="例如 Jane Doe"></div>
      <p class="form-error" id="reviewer-error" role="alert"></p>
      <div class="dialog-actions"><button class="button primary" type="submit">开始审核</button></div>
    </form>
  </dialog>

 or tofu"],"value_domain_zh":["无","肉类或禽类","海鲜或豆腐"]},{"id":"food/noodles/e9080a0c3a8c4491","dimension":"Vegetable accompaniment","dimension_zh":"面条蔬菜配菜","explanation_zh":"该维度决定对象的「面条蔬菜配菜」在图像中的可见呈现。","interaction_rationale_zh":"用户可在日常对话、偏好表达、使用经历或情境互动中直接说明或间接体现这一信息。","value_domain":["none or minimal","leafy greens","mushrooms or mixed vegetables"],"value_domain_zh":["无或很少","叶菜","蘑菇或混合蔬菜"]}]}],"suspected_duplicate_pairs":[],"suspected_duplicate_pair_count":0,"imported_from":"personaimg_dimension_final (1).json","imported_at":"2026-08-17T08:27:47.027Z"}</script>
  <script>
    (() => {
      const finalReport = JSON.parse(document.querySelector("#final-data").textContent);
      const STORAGE_KEY = "personaimg-round2-final-question-review-v1";
      const categories = buildCategories(finalReport);
      const dimensionById = new Map(categories.flatMap(category => category.groups.flatMap(group => group.dimensions.map(dimension => [dimension.id, { ...dimension, category, group }]))));
      const stored = loadState();
      let reviewerName = stored.reviewerName;
      let questionIds = new Set(stored.questionIds);
      let comments = { ...stored.comments };
      let activeCategoryId = stored.activeCategoryId && categories.some(category => category.id === stored.activeCategoryId) ? stored.activeCategoryId : categories[0].id;
      let openGroups = new Set(stored.openGroups.filter(id => categories.some(category => category.groups.some(group => group.id === id))));
      let questionsOnly = false;
      let searchTerm = "";

      const tabRoot = document.querySelector("#category-tabs");
      const reviewArea = document.querySelector("#review-area");
      const progress = document.querySelector("#overall-progress");
      const summaryDetail = document.querySelector("#summary-detail");
      const saveStatus = document.querySelector("#save-status");
      const search = document.querySelector("#search");
      const reviewerNameInput = document.querySelector("#reviewer-name");
      const reviewerDialog = document.querySelector("#reviewer-dialog");
      const reviewerForm = document.querySelector("#reviewer-form");
      const reviewerDialogName = document.querySelector("#reviewer-dialog-name");
      const reviewerError = document.querySelector("#reviewer-error");
      const showAllButton = document.querySelector("#show-all");
      const showQuestionsButton = document.querySelector("#show-questions");

      function buildCategories(report) {
        const result = [];
        (report.groups || []).forEach(group => {
          let category = result.find(item => item.id === group.category_id);
          if (!category) {
            category = { id: group.category_id, name: group.category, name_zh: group.category_zh, groups: [] };
            result.push(category);
          }
          category.groups.push({
            id: group.group_id,
            level: group.level,
            name: group.group,
            name_zh: group.group_zh,
            dimensions: Array.isArray(group.final_dimensions) ? group.final_dimensions : [],
          });
        });
        return result;
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
      }

      function reviewerIsValid(value) {
        return /^[A-Za-z][A-Za-z .'-]{1,59}$/.test(String(value || "").trim());
      }

      function filenamePart(value) {
        return String(value).trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "reviewer";
      }

      function loadState() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          return {
            reviewerName: typeof value?.reviewerName === "string" ? value.reviewerName : "",
            questionIds: Array.isArray(value?.questionIds) ? value.questionIds.filter(id => dimensionByFinal(id)) : [],
            comments: value?.comments && typeof value.comments === "object" ? value.comments : {},
            activeCategoryId: typeof value?.activeCategoryId === "string" ? value.activeCategoryId : "",
            openGroups: Array.isArray(value?.openGroups) ? value.openGroups : [],
          };
        } catch (_) {
          return { reviewerName: "", questionIds: [], comments: {}, activeCategoryId: "", openGroups: [] };
        }
      }

      function dimensionByFinal(id) {
        return (finalReport.groups || []).some(group => (group.final_dimensions || []).some(dimension => dimension.id === id));
      }

      function saveState(message = "已自动保存到当前浏览器") {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          reviewerName,
          questionIds: [...questionIds],
          comments,
          activeCategoryId,
          openGroups: [...openGroups],
          savedAt: new Date().toISOString(),
          sourceFinalCount: dimensionById.size,
        }));
        saveStatus.textContent = `${message} · ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      }

      function activeCategory() {
        return categories.find(category => category.id === activeCategoryId) || categories[0];
      }

      function categoryQuestionCount(category) {
        return category.groups.reduce((count, group) => count + group.dimensions.filter(dimension => questionIds.has(dimension.id)).length, 0);
      }

      function searchableText(dimension) {
        return [dimension.dimension, dimension.dimension_zh, dimension.explanation_zh, ...(dimension.value_domain || []), ...(dimension.value_domain_zh || []), comments[dimension.id] || ""].join(" ").toLowerCase();
      }

      function visibleDimensions(group) {
        const needle = searchTerm.trim().toLowerCase();
        return group.dimensions.filter(dimension => (!questionsOnly || questionIds.has(dimension.id)) && (!needle || searchableText(dimension).includes(needle)));
      }

      function renderTabs() {
        tabRoot.innerHTML = categories.map(category => {
          const total = category.groups.reduce((count, group) => count + group.dimensions.length, 0);
          const questions = categoryQuestionCount(category);
          return `<button class="category-tab" type="button" role="tab" aria-selected="${category.id === activeCategoryId}" data-category-id="${escapeHtml(category.id)}"><span class="tab-zh">${escapeHtml(category.name_zh)}</span><span class="tab-en">${escapeHtml(category.name)}</span><span class="tab-count ${questions ? "has-question" : ""}">${questions ? `${questions} 条疑问 · ` : ""}${total} 条 final</span></button>`;
        }).join("");
        tabRoot.querySelectorAll("[data-category-id]").forEach(button => button.addEventListener("click", () => {
          activeCategoryId = button.dataset.categoryId;
          saveState("浏览位置已保存");
          renderAll();
        }));
      }

      function renderValues(dimension) {
        return (dimension.value_domain || []).map((value, index) => `<span class="value"><span class="value-en">${escapeHtml(value)}</span><span class="value-zh">${escapeHtml((dimension.value_domain_zh || [])[index] || "")}</span></span>`).join("");
      }

      function renderCard(dimension, group) {
        const questioned = questionIds.has(dimension.id);
        return `<article class="dimension-card ${questioned ? "questioned" : ""}" id="card-${escapeHtml(dimension.id.replace(/[^a-zA-Z0-9_-]/g, "-"))}"><div class="card-top"><div><p class="dimension-label">${group.level === "category" ? "Category dimension" : "Subcategory dimension"}</p><h3 class="dimension-title"><span class="en">${escapeHtml(dimension.dimension)}</span><span class="zh">${escapeHtml(dimension.dimension_zh)}</span></h3></div><button class="question-button" type="button" aria-pressed="${questioned}" data-question-id="${escapeHtml(dimension.id)}">${questioned ? "已有疑问" : "是否有疑问"}</button></div><p class="intro">${escapeHtml(dimension.explanation_zh || "")}</p><div class="values"><span class="values-label">三个候选值 · EN / 中文</span><div class="value-list">${renderValues(dimension)}</div></div><div class="comment-wrap" ${questioned ? "" : "hidden"}><label for="comment-${escapeHtml(dimension.id.replace(/[^a-zA-Z0-9_-]/g, "-"))}">疑问或修改建议</label><textarea class="comment" id="comment-${escapeHtml(dimension.id.replace(/[^a-zA-Z0-9_-]/g, "-"))}" data-comment-id="${escapeHtml(dimension.id)}" placeholder="请具体说明问题所在，例如属性轴混合、与另一属性重复、值域不平行或层级不合适。">${escapeHtml(comments[dimension.id] || "")}</textarea></div></article>`;
      }

      function renderCategory() {
        const category = activeCategory();
        const groups = category.groups.map(group => ({ group, dimensions: visibleDimensions(group) })).filter(item => item.dimensions.length || (!questionsOnly && !searchTerm));
        if (!groups.length) {
          reviewArea.innerHTML = `<div class="category-heading"><h2>${escapeHtml(category.name_zh)} <span>${escapeHtml(category.name)}</span></h2></div><div class="empty">当前筛选条件下没有属性。</div>`;
          return;
        }
        const total = category.groups.reduce((count, group) => count + group.dimensions.length, 0);
        reviewArea.innerHTML = `<div class="category-heading"><h2>${escapeHtml(category.name_zh)} <span>${escapeHtml(category.name)}</span></h2><p>${total} 条 final · ${categoryQuestionCount(category)} 条疑问</p></div><div class="group-list">${groups.map(({ group, dimensions }) => {
          const isOpen = openGroups.has(group.id) || Boolean(searchTerm) || questionsOnly;
          const questioned = group.dimensions.filter(dimension => questionIds.has(dimension.id)).length;
          return `<section class="group"><button class="group-header" type="button" data-group-id="${escapeHtml(group.id)}" aria-expanded="${isOpen}"><span class="group-title"><strong>${escapeHtml(group.name_zh)}</strong><span>${escapeHtml(group.name)}</span></span><span class="group-kind">${group.level === "category" ? "大类" : "子类"}</span><span class="group-status ${questioned ? "has-question" : ""}">${questioned ? `${questioned} 条疑问 · ` : ""}${group.dimensions.length} 条 final</span><span class="chevron" aria-hidden="true">${isOpen ? "−" : "+"}</span></button><div class="group-body" ${isOpen ? "" : "hidden"}><div class="dimension-grid">${dimensions.map(dimension => renderCard(dimension, group)).join("")}</div></div></section>`;
        }).join("")}</div>`;

        reviewArea.querySelectorAll("[data-group-id]").forEach(button => button.addEventListener("click", () => {
          const id = button.dataset.groupId;
          if (openGroups.has(id)) openGroups.delete(id); else openGroups.add(id);
          saveState("展开状态已保存");
          renderCategory();
        }));
        reviewArea.querySelectorAll("[data-question-id]").forEach(button => button.addEventListener("click", () => toggleQuestion(button.dataset.questionId)));
        reviewArea.querySelectorAll("[data-comment-id]").forEach(textarea => textarea.addEventListener("input", () => {
          comments[textarea.dataset.commentId] = textarea.value;
          textarea.classList.remove("invalid");
          saveState();
          updateSummary();
        }));
      }

      function toggleQuestion(id) {
        if (questionIds.has(id)) {
          if ((comments[id] || "").trim() && !window.confirm("取消疑问标记会同时删除这条评论，是否继续？")) return;
          questionIds.delete(id);
          delete comments[id];
        } else {
          questionIds.add(id);
        }
        saveState("疑问状态已保存");
        renderAll();
        if (questionIds.has(id)) requestAnimationFrame(() => document.querySelector(`[data-comment-id="${CSS.escape(id)}"]`)?.focus());
      }

      function updateSummary() {
        const completedComments = [...questionIds].filter(id => (comments[id] || "").trim()).length;
        progress.textContent = `${questionIds.size} / ${dimensionById.size}`;
        summaryDetail.textContent = questionIds.size ? `${completedComments} 条已填写评论` : "尚未标记疑问";
      }

      function renderAll() {
        renderTabs();
        renderCategory();
        updateSummary();
      }

      function setQuestionsOnly(value) {
        questionsOnly = value;
        showAllButton.classList.toggle("active", !value);
        showQuestionsButton.classList.toggle("active", value);
        renderCategory();
      }

      function exportResult() {
        reviewerName = reviewerNameInput.value.trim();
        if (!reviewerIsValid(reviewerName)) {
          reviewerDialogName.value = reviewerName;
          reviewerError.textContent = "请输入有效英文姓名（至少两个字符）。";
          reviewerDialog.showModal();
          return;
        }
        const missing = [...questionIds].filter(id => !(comments[id] || "").trim());
        if (missing.length) {
          setQuestionsOnly(true);
          const first = document.querySelector(`[data-comment-id="${CSS.escape(missing[0])}"]`);
          first?.classList.add("invalid");
          first?.focus();
          window.alert(`还有 ${missing.length} 条疑问没有填写评论。请填写后再导出。`);
          return;
        }
        const questions = [...questionIds].map(id => {
          const item = dimensionById.get(id);
          return {
            dimension_id: id,
            category_id: item.category.id,
            category: item.category.name,
            category_zh: item.category.name_zh,
            group_id: item.group.id,
            level: item.group.level,
            group: item.group.name,
            group_zh: item.group.name_zh,
            dimension: item.dimension,
            dimension_zh: item.dimension_zh,
            comment: comments[id].trim(),
          };
        });
        const payload = {
          schema_version: "personaimg_dimension_round2_question_review_v1",
          audit_round: 2,
          audit_scope: "final_dimension_question_review",
          exported_at: new Date().toISOString(),
          reviewer: { english_name: reviewerName },
          source_final_schema_version: finalReport.schema_version,
          source_final_selection_count: dimensionById.size,
          question_count: questions.length,
          review_guideline: "Only final-selected dimensions are reviewed. Unmarked dimensions indicate no reported question; every marked dimension must include a reviewer comment.",
          questions,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `personaimg_round2_final_dimension_questions_${filenamePart(reviewerName)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        saveState("结果已导出");
      }

      reviewerNameInput.value = reviewerName;
      reviewerNameInput.addEventListener("input", () => {
        reviewerName = reviewerNameInput.value.trim();
        saveState("审核者姓名已保存");
      });
      reviewerForm.addEventListener("submit", event => {
        event.preventDefault();
        const value = reviewerDialogName.value.trim();
        if (!reviewerIsValid(value)) {
          reviewerError.textContent = "请输入有效英文姓名（至少两个字符）。";
          return;
        }
        reviewerName = value;
        reviewerNameInput.value = value;
        reviewerError.textContent = "";
        saveState("审核者姓名已保存");
        reviewerDialog.close();
      });
      reviewerDialog.addEventListener("cancel", event => {
        if (!reviewerIsValid(reviewerName)) event.preventDefault();
      });
      search.addEventListener("input", () => {
        searchTerm = search.value;
        renderCategory();
      });
      showAllButton.addEventListener("click", () => setQuestionsOnly(false));
      showQuestionsButton.addEventListener("click", () => setQuestionsOnly(true));
      document.querySelector("#expand-all").addEventListener("click", () => {
        openGroups = new Set(activeCategory().groups.map(group => group.id));
        saveState("展开状态已保存");
        renderCategory();
      });
      document.querySelector("#collapse-all").addEventListener("click", () => {
        openGroups = new Set();
        saveState("展开状态已保存");
        renderCategory();
      });
      document.querySelector("#export").addEventListener("click", exportResult);

      if (!openGroups.size) openGroups = new Set(activeCategory().groups.slice(0, 2).map(group => group.id));
      renderAll();
      saveStatus.textContent = "评论会自动保存在当前浏览器。";
      if (!reviewerIsValid(reviewerName)) {
        reviewerDialogName.value = reviewerName;
        reviewerDialog.showModal();
        reviewerDialogName.focus();
      }
    })();
  </script>
</body>
</html>
