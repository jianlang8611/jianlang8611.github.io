      let html=esc(text); [...new Set(terms.filter(Boolean))].sort((a,b)=>b.length-a.length).forEach(term=>{html=html.replaceAll(esc(term),`<mark>${esc(term)}</mark>`);}); return html;
    }
    function navMarkup(position){return `<nav class="navigator ${position}"><button class="nav-button" data-nav="prev" type="button" ${page===0?'disabled':''}>← 上一页</button><div class="page-jump"><span>第</span><input data-page type="number" min="1" max="${payload.assignments.length}" value="${page+1}" aria-label="跳转页码"><span>页 / 共 ${payload.assignments.length} 页</span></div><button class="nav-button" data-nav="next" type="button" ${page===payload.assignments.length-1?'disabled':''}>下一页 →</button></nav>`;}
    function renderPersona(persona){return persona.sections.map(section=>`<section class="persona-block"><h3>${esc(section.title_zh)}</h3><div class="facts">${section.items.map(field=>{const length=field.value_zh.length,width=length>180?'full':length>70?'wide':'';return `<div class="fact ${width}"><div class="fact-label">${esc(field.label_zh)}</div><div class="fact-value">${esc(field.value_zh)}</div></div>`;}).join('')}</div></section>`).join('');}
    function render(){
      const x=payload.assignments[page],r=record(x.task_id);
      const rows=x.selected_chain.assignments.map((a,i)=>{const direct=x.assignment_support[i].support==='direct_semantic';return `<tr class="${direct?'direct':''}"><td>${a.level==='global'?'全局':a.level==='category'?'大类':'子类'}</td><td>${esc(a.dimension_zh)}</td><td><strong>${esc(a.value_zh)}</strong></td><td class="${direct?'direct-text':'neutral-text'}">${direct?'Persona 直接支持':'中性补全'}</td></tr>`;}).join('');
      const evidence=mapped?`<section class="used-evidence"><h2 class="section-title">本条匹配实际使用的 Persona 信息</h2><div class="evidence-grid">${x.used_persona_fields.map(field=>`<div class="evidence-item"><div class="evidence-label">${esc(field.label_zh)}</div><div class="evidence-value">${highlighted(field.value_zh,field.matched_terms_zh)}</div>${field.matched_terms_zh.map(term=>`<span class="trigger">触发：${esc(term)}</span>`).join('')}</div>`).join('')}</div></section>`:'';
      const failEditor=failOpen||r.decision==='fail'?`<div class="fail-editor"><label for="comment">不通过原因</label><textarea id="comment" placeholder="请指出漏配、Persona 冲突，或链条内互相冲突的具体值。">${esc(r.comment)}</textarea><button class="save-fail" id="save-fail" type="button">保存不通过并到下一页</button></div>`:'';
      const completion=showCompletion?'<div class="completion">已经到最后一页。请确认进度后导出审核结果。</div>':'';
      document.querySelector('#item').innerHTML=`<article><div class="item-head"><div class="uid">#${x.user_id}</div><div class="persona-summary">${esc(x.persona_zh.short_persona_zh)}</div><div class="subject">${esc(x.selected_subject_zh)}</div><div class="badge">${mapped?`直接命中 ${x.exact_preference_support_count}/6`:'直接命中 0/6'}</div></div>${evidence}<section class="chain-section"><h2 class="section-title">链条的六个属性值</h2><table><thead><tr><th class="level">层级</th><th>属性</th><th>值</th><th class="basis">Persona 依据</th></tr></thead><tbody>${rows}</tbody></table></section><section class="persona-section"><h2 class="section-title">Persona 信息（中文整理）</h2>${renderPersona(x.persona_zh)}</section><section class="decision"><h2>这条是否通过？</h2><div class="decision-actions"><button class="pass ${r.decision==='pass'?'selected-pass':''}" id="pass" type="button">通过并到下一页</button><button class="fail ${r.decision==='fail'?'selected-fail':''}" id="fail" type="button">不通过</button></div>${failEditor}${completion}</section></article>`;
      document.querySelector('#top-nav').innerHTML=navMarkup('top'); document.querySelector('#bottom-nav').innerHTML=navMarkup('bottom');
      const records=payload.assignments.map(item=>record(item.task_id)),done=records.filter(v=>v.decision!=='pending').length,failed=records.filter(v=>v.decision==='fail').length;
      document.querySelector('#status').textContent=`已审核 ${done} / ${payload.assignments.length} · 通过 ${records.filter(v=>v.decision==='pass').length} · 不通过 ${failed}`;
      document.querySelector('#reviewer').textContent=`审核者：${reviewerName}`;
    }
    function go(target){page=Math.max(0,Math.min(payload.assignments.length-1,target));failOpen=false;showCompletion=false;render();scrollTo({top:0,behavior:'instant'});}
    function advance(){if(page<payload.assignments.length-1)go(page+1);else{showCompletion=true;render();}}
    function start(){reviewerName=nameInput.value.trim();if(!reviewerName)return;localStorage.setItem(`${baseKey}::last-reviewer`,reviewerName);state=JSON.parse(localStorage.getItem(storageKey())||'{}');intro.classList.add('hidden');header.classList.remove('hidden');app.classList.remove('hidden');document.querySelector('#title').textContent=payload.title;render();scrollTo(0,0);}
    document.querySelector('#intro-title').textContent=guide.title;document.querySelector('#intro-lead').textContent=guide.lead;document.querySelector('#rules').innerHTML=guide.rules.map(rule=>`<li>${esc(rule)}</li>`).join('');document.querySelector('#pass-rule').textContent=guide.pass;
    nameInput.value=reviewerName;document.querySelector('#start').disabled=!reviewerName.trim();nameInput.addEventListener('input',()=>document.querySelector('#start').disabled=!nameInput.value.trim());nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&nameInput.value.trim())start();});document.querySelector('#start').addEventListener('click',start);
    document.querySelector('#show-guide').addEventListener('click',()=>{app.classList.add('hidden');header.classList.add('hidden');intro.classList.remove('hidden');scrollTo(0,0);});
    document.body.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav&&!nav.disabled)go(page+(nav.dataset.nav==='next'?1:-1));if(e.target.id==='pass'){const x=payload.assignments[page];state[x.task_id]={decision:'pass',comment:''};saveState();advance();}if(e.target.id==='fail'){failOpen=true;showCompletion=false;render();document.querySelector('#comment')?.focus();}if(e.target.id==='save-fail'){const comment=document.querySelector('#comment').value.trim();if(!comment){alert('请填写不通过原因');document.querySelector('#comment').focus();return;}const x=payload.assignments[page];state[x.task_id]={decision:'fail',comment};saveState();advance();}});
    document.body.addEventListener('change',e=>{if(e.target.matches('[data-page]'))go(Number(e.target.value)-1);});document.body.addEventListener('keydown',e=>{if(e.target.matches('[data-page]')&&e.key==='Enter')go(Number(e.target.value)-1);});
    document.querySelector('#export').addEventListener('click',()=>{const decisions=payload.assignments.map(x=>({task_id:x.task_id,user_id:x.user_id,group_id:x.selected_group_id,selected_chain_id:x.selected_chain_id,...record(x.task_id)}));const out={schema_version:'personaimg_chain_simple_volunteer_review_v1',audit_group:payload.audit_group,reviewer_name:reviewerName,exported_at:new Date().toISOString(),sampling:payload.sampling,source:payload.source,decisions};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`personaimg_${payload.audit_group}_review_${safeReviewer(reviewerName)}.json`;a.click();URL.revokeObjectURL(a.href);});
  </script>
</body>
</html>
