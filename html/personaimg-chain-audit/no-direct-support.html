  <style>
    :root { --ink:#182126; --muted:#627077; --line:#d9dfe1; --paper:#fff; --wash:#f3f5f5; --green:#176b5b; --green-soft:#edf7f3; --yellow:#ffef9f; --red:#a33a33; --red-soft:#fff2f1; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1f1; font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }
    .intro { min-height:100vh; display:grid; place-items:center; padding:28px 18px; background:#f4f6f5; }
    .intro-shell { width:min(720px,100%); padding:30px 34px 34px; border:1px solid var(--line); border-radius:7px; background:var(--paper); }
    .eyebrow { margin-bottom:5px; color:var(--green); font-size:12px; font-weight:800; }
    .intro h1 { margin:0; font-size:27px; }
    .intro-lead { margin:8px 0 22px; color:var(--muted); font-size:16px; }
    .lesson { padding:17px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .lesson h2 { margin:0 0 10px; font-size:17px; }
    .lesson ol { margin:0; padding-left:23px; }
    .lesson li { margin:7px 0; padding-left:3px; }
    .pass-rule { margin:13px 0 0; padding:9px 11px; border-left:4px solid var(--green); background:var(--green-soft); font-weight:700; }
    .name-form { display:grid; grid-template-columns:1fr auto; gap:9px; margin-top:20px; }
    .name-form label { grid-column:1/-1; font-weight:750; }
    .name-form input { min-width:0; height:42px; padding:8px 11px; border:1px solid #b9c4c7; border-radius:5px; }
    .primary { min-height:42px; padding:8px 17px; border:1px solid var(--green); border-radius:5px; background:var(--green); color:#fff; font-weight:750; }
    .primary:disabled { cursor:not-allowed; opacity:.4; }
    header { position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line); background:rgba(255,255,255,.97); }
    .bar { width:min(1260px,100%); margin:auto; padding:10px 18px; display:grid; grid-template-columns:1fr auto; gap:15px; align-items:center; }
    .bar h1 { margin:0; font-size:18px; }
    .status { margin-top:1px; color:var(--muted); font-size:12px; }
    .header-actions { display:flex; align-items:center; gap:7px; }
    .reviewer { color:#34434a; font-weight:700; }
    .quiet,.export { min-height:34px; padding:6px 10px; border-radius:5px; font-weight:700; }
    .quiet { border:1px solid #bac5c8; background:#fff; color:#34434a; }
    .export { border:1px solid var(--green); background:var(--green); color:#fff; }
    main { width:min(1260px,100%); margin:auto; padding:14px 18px 44px; }
    .navigator { display:grid; grid-template-columns:130px 1fr 130px; gap:10px; align-items:center; margin:0 0 12px; }
    .navigator.bottom { margin:12px 0 0; }
    .nav-button { min-height:38px; border:1px solid #bac5c8; border-radius:5px; background:#fff; color:#34434a; font-weight:750; }

    .page-jump { display:flex; justify-content:center; align-items:center; gap:7px; color:var(--muted); }
    .page-jump input { width:62px; height:36px; padding:5px 7px; border:1px solid #bac5c8; border-radius:5px; text-align:center; font-weight:750; }
    article { border:1px solid var(--line); border-radius:7px; background:var(--paper); overflow:hidden; }
    .item-head { display:grid; grid-template-columns:70px minmax(0,1fr) 240px auto; gap:14px; align-items:start; padding:14px 16px; border-bottom:1px solid var(--line); }
    .uid { font-weight:800; }
    .persona-summary { font-size:16px; font-weight:750; overflow-wrap:anywhere; }
    .subject { color:var(--green); font-weight:800; }
    .badge { padding:3px 9px; border-radius:999px; background:var(--green-soft); color:var(--green); font-size:12px; font-weight:800; white-space:nowrap; }
    .used-evidence { padding:13px 16px 14px; border-bottom:1px solid #bad9ce; background:var(--green-soft); }
    .section-title { margin:0 0 8px; font-size:15px; }
    .evidence-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; }
    .evidence-item { padding:7px 0 7px 10px; border-left:4px solid var(--green); }
    .evidence-label { color:var(--green); font-size:12px; font-weight:800; }
    .evidence-value { margin:2px 0 4px; font-size:15px; font-weight:650; }
    mark { padding:0 2px; border-radius:2px; background:var(--yellow); color:inherit; }
    .trigger { margin-right:8px; color:#6d5912; font-size:12px; }
    .chain-section { padding:13px 16px 2px; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th,td { padding:8px 10px; border-bottom:1px solid #e7ebec; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    th { color:var(--muted); background:#fafbfb; font-size:12px; }
    .level { width:90px; } .basis { width:155px; }
    tr.direct { background:#f1f9f6; }
    .direct-text { color:var(--green); font-weight:800; }
    .neutral-text { color:var(--muted); }
    .persona-section { padding:14px 16px 4px; }
    .persona-block { padding:12px 0 8px; border-top:2px solid #dfe5e5; }
    .persona-block:first-of-type { border-top:0; }
    .persona-block h3 { margin:0 0 8px; font-size:14px; }
    .facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 20px; }
    .fact { min-width:0; padding:6px 0 7px; border-bottom:1px solid #edf0f0; }
    .fact.wide { grid-column:span 2; }
    .fact.full { grid-column:1/-1; }
    .fact-label { margin-bottom:2px; color:var(--muted); font-size:11px; font-weight:750; }
    .fact-value { overflow-wrap:anywhere; }
    .fact-value + .fact-value { margin-top:3px; }
    .decision { padding:15px 16px 16px; border-top:1px solid var(--line); background:var(--wash); }
    .decision h2 { margin:0 0 9px; font-size:16px; }
    .decision-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pass,.fail,.save-fail { min-height:44px; border-radius:5px; font-weight:800; }
    .pass { border:1px solid var(--green); background:var(--green); color:#fff; }
    .fail { border:1px solid var(--red); background:#fff; color:var(--red); }
    .selected-pass { box-shadow:0 0 0 3px rgba(23,107,91,.2); }
    .selected-fail { background:var(--red-soft); box-shadow:0 0 0 3px rgba(163,58,51,.14); }
    .fail-editor { margin-top:10px; padding:11px; border-left:4px solid var(--red); background:var(--red-soft); }
    .fail-editor label { display:block; margin-bottom:5px; font-weight:750; }
    textarea { width:100%; min-height:82px; padding:8px 10px; border:1px solid #c9b3b1; border-radius:5px; resize:vertical; }
    .save-fail { width:100%; margin-top:8px; border:1px solid var(--red); background:var(--red); color:#fff; }
    .completion { margin-top:10px; padding:10px 12px; border-left:4px solid var(--green); background:var(--green-soft); font-weight:750; }
    @media (max-width:850px) { .bar,.item-head { grid-template-columns:1fr; } .header-actions { flex-wrap:wrap; } .navigator { grid-template-columns:92px 1fr 92px; } .facts,.evidence-grid { grid-template-columns:1fr; } .fact.wide,.fact.full { grid-column:auto; } .name-form,.decision-actions { grid-template-columns:1fr; } .subject { margin-top:2px; } }
  </style>

  <script>
    const payload=JSON.parse(document.querySelector('#data').textContent);
    const mapped=payload.audit_group==='direct_supported';
    const baseKey=`personaimg-chain-simple-audit-v3::${payload.audit_group}::${payload.sampling.seed}`;
    const intro=document.querySelector('#intro'),app=document.querySelector('#app'),header=document.querySelector('#app-header');
    const nameInput=document.querySelector('#intro-name');
    let reviewerName=localStorage.getItem(`${baseKey}::last-reviewer`)||'';
    let state={}; let page=0; let failOpen=false; let showCompletion=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeReviewer=s=>(s.trim().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_+|_+$/g,'')||'reviewer');
    const storageKey=()=>`${baseKey}::${safeReviewer(reviewerName)}`;
    const record=id=>({decision:'pending',comment:'',...(state[id]||{})});
    const saveState=()=>localStorage.setItem(storageKey(),JSON.stringify(state));
    const guide=mapped?{
      title:'有 Persona 直接对应组',lead:'确认算法标出的对应确实成立，并检查整条链条是否可用。',
      rules:['高亮的 Persona 信息是否确实支持绿色标出的链条值？','其余链条值是否不与 Persona 的明确信息冲突？','六个属性值能否在同一张图中同时成立、互不冲突？'],
      pass:'三项都没有问题才选“通过”；任一项有问题就选“不通过”，并写清具体原因。'
    }:{
      title:'无 Persona 直接对应组',lead:'确认算法没有漏掉直接对应，同时检查整条链条是否可用。',
      rules:['Persona 中是否确实没有能直接对应到这六个链条值的信息？','六个链条值是否不与 Persona 的明确信息冲突？','六个属性值能否在同一张图中同时成立、互不冲突？'],
      pass:'三项都没有问题才选“通过”；发现漏配或任何冲突就选“不通过”，并写清具体原因。'
    };
    function highlighted(text,terms){
      let html=esc(text); [...new Set(terms.filter(Boolean))].sort((a,b)=>b.length-a.length).forEach(term=>{html=html.replaceAll(esc(term),`<mark>${esc(term)}</mark>`);}); return html;
    }
    function navMarkup(position){return `<nav class="navigator ${position}"><button class="nav-button" data-nav="prev" type="button" ${page===0?'disabled':''}>← 上一页</button><div class="page-jump"><span>第</span><input data-page type="number" min="1" max="${payload.assignments.length}" value="${page+1}" aria-label="跳转页码"><span>页 / 共 ${payload.assignments.length} 页</span></div><button class="nav-button" data-nav="next" type="button" ${page===payload.assignments.length-1?'disabled':''}>下一页 →</button></nav>`;}
    function renderPersona(persona){return persona.sections.map(section=>`<section class="persona-block"><h3>${esc(section.title_zh)}</h3><div class="facts">${section.items.map(field=>{const length=field.value_zh.length,width=length>180?'full':length>70?'wide':'';return `<div class="fact ${width}"><div class="fact-label">${esc(field.label_zh)}</div><div class="fact-value">${esc(field.value_zh)}</div></div>`;}).join('')}</div></section>`).join('');}
    function render(){
      const x=payload.assignments[page],r=record(x.task_id);
      const rows=x.selected_chain.assignments.map((a,i)=>{const direct=x.assignment_support[i].support==='direct_semantic';return `<tr class="${direct?'direct':''}"><td>${a.level==='global'?'全局':a.level==='category'?'大类':'子类'}</td><td>${esc(a.dimension_zh)}</td><td><strong>${esc(a.value_zh)}</strong></td><td class="${direct?'direct-text':'neutral-text'}">${direct?'Persona 直接支持':'中性补全'}</td></tr>`;}).join('');
      const evidence=mapped?`<section class="used-evidence"><h2 class="section-title">本条匹配实际使用的 Persona 信息</h2><div class="evidence-grid">${x.used_persona_fields.map(field=>`<div class="evidence-item"><div class="evidence-label">${esc(field.label_zh)}</div><div class="evidence-value">${highlighted(field.value_zh,field.matched_terms_zh)}</div>${field.matched_terms_zh.map(term=>`<span class="trigger">触发：${esc(term)}</span>`).join('')}</div>`).join('')}</div></section>`:'';
      const failEditor=failOpen||r.decision==='fail'?`<div class="fail-editor"><label for="comment">不通过原因</label><textarea id="comment" placeholder="请指出漏配、Persona 冲突，或链条内互相冲突的具体值。">${esc(r.comment)}</textarea><button class="save-fail" id="save-fail" type="button">保存不通过并到下一页</button></div>`:'';
      const completion=showCompletion?'<div class="completion">已经到最后一页。请确认进度后导出审核结果。</div>':'';
      document.querySelector('#item').innerHTML=`<article><div class="item-head"><div class="uid">#${x.user_id}</div><div class="persona-summary">${esc(x.persona_zh.short_persona_zh)}</div><div class="subject">${esc(x.selected_subject_zh)}</div><div class="badge">${mapped?`直接命中 ${x.exact_preference_support_count}/6`:'直接命中 0/6'}</div></div>${evidence}<section class="chain-section"><h2 class="section-title">链条的六个属性值</h2><table><thead><tr><th class="level">层级</th><th>属性</th><th>值</th><th class="basis">Persona 依据</th></tr></thead><tbody>${rows}</tbody></table></section><section class="persona-section"><h2 class="section-title">Persona 信息（中文整理）</h2>${renderPersona(x.persona_zh)}</section><section class="decision"><h2>这条是否通过？</h2><div class="decision-actions"><button class="pass ${r.decision==='pass'?'selected-pass':''}" id="pass" type="button">通过并到下一页</button><button class="fail ${r.decision==='fail'?'selected-fail':''}" id="fail" type="button">不通过</button></div>${failEditor}${completion}</section></article>`;
      document.querySelector('#top-nav').innerHTML=navMarkup('top'); document.querySelector('#bottom-nav').innerHTML=navMarkup('bottom');
      const records=payload.assignments.map(item=>record(item.task_id)),done=records.filter(v=>v.decision!=='pending').length,failed=records.filter(v=>v.decision==='fail').length;
      document.querySelector('#status').textContent=`已审核 ${done} / ${payload.assignments.length} · 通过 ${records.filter(v=>v.decision==='pass').length} · 不通过 ${failed}`;
      document.querySelector('#reviewer').textContent=`审核者：${reviewerName}`;
    }
    function go(target){page=Math.max(0,Math.min(payload.assignments.length-1,target));failOpen=false;showCompletion=false;render();scrollTo({top:0,behavior:'instant'});}
    function advance(){if(page<payload.assignments.length-1)go(page+1);else{showCompletion=true;render();}}
    function start(){reviewerName=nameInput.value.trim();if(!reviewerName)return;localStorage.setItem(`${baseKey}::last-reviewer`,reviewerName);state=JSON.parse(localStorage.getItem(storageKey())||'{}');intro.classList.add('hidden');header.classList.remove('hidden');app.classList.remove('hidden');document.querySelector('#title').textContent=payload.title;render();scrollTo(0,0);}
    document.querySelector('#intro-title').textContent=guide.title;document.querySelector('#intro-lead').textContent=guide.lead;document.querySelector('#rules').innerHTML=guide.rules.map(rule=>`<li>${esc(rule)}</li>`).join('');document.querySelector('#pass-rule').textContent=guide.pass;
    nameInput.value=reviewerName;document.querySelector('#start').disabled=!reviewerName.trim();nameInput.addEventListener('input',()=>document.querySelector('#start').disabled=!nameInput.value.trim());nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&nameInput.value.trim())start();});document.querySelector('#start').addEventListener('click',start);
    document.querySelector('#show-guide').addEventListener('click',()=>{app.classList.add('hidden');header.classList.add('hidden');intro.classList.remove('hidden');scrollTo(0,0);});
    document.body.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav&&!nav.disabled)go(page+(nav.dataset.nav==='next'?1:-1));if(e.target.id==='pass'){const x=payload.assignments[page];state[x.task_id]={decision:'pass',comment:''};saveState();advance();}if(e.target.id==='fail'){failOpen=true;showCompletion=false;render();document.querySelector('#comment')?.focus();}if(e.target.id==='save-fail'){const comment=document.querySelector('#comment').value.trim();if(!comment){alert('请填写不通过原因');document.querySelector('#comment').focus();return;}const x=payload.assignments[page];state[x.task_id]={decision:'fail',comment};saveState();advance();}});
    document.body.addEventListener('change',e=>{if(e.target.matches('[data-page]'))go(Number(e.target.value)-1);});document.body.addEventListener('keydown',e=>{if(e.target.matches('[data-page]')&&e.key==='Enter')go(Number(e.target.value)-1);});
    document.querySelector('#export').addEventListener('click',()=>{const decisions=payload.assignments.map(x=>({task_id:x.task_id,user_id:x.user_id,group_id:x.selected_group_id,selected_chain_id:x.selected_chain_id,...record(x.task_id)}));const out={schema_version:'personaimg_chain_simple_volunteer_review_v1',audit_group:payload.audit_group,reviewer_name:reviewerName,exported_at:new Date().toISOString(),sampling:payload.sampling,source:payload.source,decisions};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`personaimg_${payload.audit_group}_review_${safeReviewer(reviewerName)}.json`;a.click();URL.revokeObjectURL(a.href);});
  </script>
