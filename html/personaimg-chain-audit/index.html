<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaIMG 偏好链志愿者审核</title>
  <style>
    :root { color-scheme: light; --ink:#182126; --muted:#627077; --line:#d9dfe1; --paper:#fff; --wash:#f4f6f5; --green:#176b5b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--wash); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
    main { width:min(760px,100%); padding:30px 34px 34px; border:1px solid var(--line); border-radius:7px; background:var(--paper); }
    .eyebrow { margin:0 0 5px; color:var(--green); font-size:12px; font-weight:800; }
    h1 { margin:0; font-size:28px; }
    .lead { margin:8px 0 24px; color:var(--muted); font-size:16px; }
    .options { display:grid; gap:10px; }
    a { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; min-height:82px; padding:15px 17px; border:1px solid var(--line); border-radius:6px; color:inherit; text-decoration:none; }
    a:hover, a:focus-visible { border-color:var(--green); outline:none; background:#f2f8f6; }
    strong { display:block; margin-bottom:2px; font-size:17px; }
    span { color:var(--muted); }
    b { min-width:70px; color:var(--green); text-align:right; }
    @media (max-width:560px) { main { padding:24px 20px; } a { grid-template-columns:1fr; gap:5px; } b { text-align:left; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PERSONAIMG · VOLUNTEER REVIEW</p>
    <h1>偏好链志愿者审核</h1>
    <p class="lead">请选择分配给你的审核组。两组任务的检查规则不同，请先阅读进入后的第一页说明。</p>
    <nav class="options" aria-label="审核组">
      <a href="direct-supported.html">
        <div><strong>有 Persona 直接对应组</strong><span>核验高亮证据、Persona 冲突与链条内部一致性</span></div>
        <b>50 条</b>
      </a>
      <a href="no-direct-support.html">
        <div><strong>无 Persona 直接对应组</strong><span>核验是否漏配、Persona 冲突与链条内部一致性</span></div>
        <b>100 条</b>
      </a>
    </nav>
  </main>
</body>
</html>
