      function applicabilityRule(attribute) {

        });
        document.querySelectorAll(".category-section").forEach(function (section) {
          section.classList.toggle("active", !state.showAll && section.dataset.category === state.activeCategory);
        });

        var query = state.query.trim().toLowerCase();
        var visibleCards = 0;
        document.querySelectorAll(".attribute-card").forEach(function (card) {
          var match = !query || card.dataset.search.indexOf(query) >= 0;
          card.classList.toggle("filtered-out", !match);
          if (match && (state.showAll || card.closest(".category-section").dataset.category === state.activeCategory)) visibleCards += 1;
        });
        noResults.classList.toggle("visible", visibleCards === 0);
      }

      nav.addEventListener("click", function (event) {
        var button = event.target.closest(".category-button");
        if (!button) return;
        state.activeCategory = button.dataset.category;
        state.showAll = false;
        history.replaceState(null, "", "#" + state.activeCategory);
        applyState();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      searchInput.addEventListener("input", function () {
        state.query = searchInput.value;
        applyState();
      });

      activeOnly.addEventListener("change", function () {
        state.activeOnly = activeOnly.checked;
        applyState();
      });

      showAllButton.addEventListener("click", function () {
        state.showAll = !state.showAll;
        applyState();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      renderStats();
      renderNav();
      renderScale();
      renderSections();
      applyState();
    }());
  </script>
</body>
</html>
