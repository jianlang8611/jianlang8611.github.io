<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Know Me Benchmark Study Board</title>
  <style>
    :root {
      --bg: #101317;
      --shell: #161b21;
      --shell-soft: #1d232b;
      --shell-line: #2c3540;
      --shell-text: #eef3f8;
      --shell-muted: #aeb8c4;
      --panel: #ffffff;
      --text: #20262e;
      --muted: #687280;
      --line: #dce1e7;
      --line-strong: #c6ced8;
      --accent: #1f6f68;
      --accent-soft: #edf6f4;
      --warn: #8a5a16;
      --warn-soft: #fff7e8;
      --code: #f2f4f7;
      --card-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    header {
      background: var(--shell);
      border-bottom: 1px solid var(--shell-line);
    }

    .topbar {
      max-width: 1260px;
      margin: 0 auto;
      padding: 22px 24px 18px;
    }

    h1 {
      margin: 0;
      color: var(--shell-text);
      font-size: 26px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 920px;
      color: var(--shell-muted);
      font-size: 14px;
    }

    main {
      max-width: 1260px;
      margin: 0 auto;
      padding: 22px 24px 36px;
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 16px;
      padding: 14px;
      background: var(--shell);
      border: 1px solid var(--shell-line);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18);
    }

    .side-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 720;
      color: var(--shell-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .paper-list,
    .section-list {
      display: grid;
      gap: 6px;
      margin: 0 0 18px;
      padding: 0;
      list-style: none;
    }

    button.paper-button,
    .section-link {
      width: 100%;
      min-height: 36px;
      padding: 8px 9px;
      border: 1px solid var(--shell-line);
      border-radius: 6px;
      background: var(--shell-soft);
      color: #d7dee8;
      text-align: left;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    button.paper-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #174d49;
      font-weight: 680;
    }

    .section-link {
      display: block;
      border-color: transparent;
      color: var(--shell-muted);
      background: transparent;
    }

    .section-link:hover {
      color: var(--shell-text);
      background: var(--shell-soft);
    }

    .content {
      min-width: 0;
    }

    .paper-head,
    .record-section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--card-shadow);
    }

    .paper-head {
      padding: 18px;
      margin-bottom: 12px;
    }

    .paper-title {
      margin: 0;
      font-size: 22px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .paper-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .meta-row,
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip,
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #fbfcfd;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag {
      color: #255853;
      background: var(--accent-soft);
      border-color: #c7dfdb;
    }

    .record-section {
      margin-bottom: 12px;
      overflow: hidden;
    }

    .section-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .section-body {
      padding: 14px 16px 16px;
    }

    .section-body h3 {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 720;
    }

    .section-body h3:first-child {
      margin-top: 0;
    }

    .section-body p {
      margin: 8px 0;
      color: var(--text);
      font-size: 14px;
    }

    .section-body ul,
    .section-body ol {
      margin: 8px 0 12px 20px;
      padding: 0;
      font-size: 14px;
    }

    .section-body li {
      margin: 5px 0;
    }

    table {
      width: 100%;
      margin: 8px 0 12px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 7px 8px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f4f7;
      font-weight: 720;
    }

    code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .evidence {
      margin: 9px 0;
      padding: 8px 10px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
    }

    .loc {
      color: var(--muted);
      font-size: 12px;
    }

    .note {
      margin: 10px 0;
      padding: 9px 10px;
      border: 1px solid #ead7aa;
      border-radius: 6px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 13px;
    }

    details.disclosure {
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
    }

    details.disclosure summary {
      padding: 8px 10px;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      font-weight: 720;
    }

    details.disclosure .detail-body {
      padding: 0 10px 10px;
      border-top: 1px solid var(--line);
    }

    .step-list {
      display: grid;
      gap: 12px;
      margin: 10px 0 14px;
    }

    .step-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .step-card h4 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 720;
    }

    .step-card p {
      margin: 7px 0;
    }

    .step-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #f7f8fa;
      font-size: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .detail-box {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      font-size: 13px;
    }

    .detail-box strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 12px;
    }

    details.prompt-block {
      margin-top: 10px;
      border: 1px solid #c7d9ef;
      border-radius: 6px;
      background: #f7fbff;
    }

    details.prompt-block summary {
      padding: 8px 10px;
      cursor: pointer;
      color: #214f79;
      font-size: 13px;
      font-weight: 720;
    }

    details.prompt-block .detail-body {
      padding: 0 10px 10px;
      border-top: 1px solid #c7d9ef;
    }

    .sample-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 10px 0 12px;
    }

    .sample-card {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
    }

    .sample-card h4 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 720;
    }

    pre {
      max-height: 290px;
      overflow: auto;
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f7f8fa;
      color: #1f252c;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .paper-figure {
      margin: 10px 0 14px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
    }

    .paper-figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .paper-figure figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .source-links a {
      color: #1b625c;
      font-size: 13px;
      font-weight: 680;
      text-decoration: none;
    }

    .source-links a:hover {
      text-decoration: underline;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar,
      .content {
        width: 100%;
        min-width: 0;
      }

      .sidebar {
        position: static;
        overflow: hidden;
      }

      .paper-list,
      .section-list {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(180px, 32vw);
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding-bottom: 5px;
        scroll-snap-type: inline proximity;
      }

      .section-list {
        grid-auto-columns: minmax(240px, 38vw);
      }

      button.paper-button,
      .section-link {
        height: 100%;
        scroll-snap-align: start;
      }

      .section-body {
        overflow-x: auto;
      }

      .chip,
      .meta-pill {
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .sample-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .topbar,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 22px;
        overflow-wrap: anywhere;
      }

      .paper-head {
        padding: 14px;
      }

      .sidebar {
        padding: 11px;
      }

      .paper-list {
        grid-auto-columns: minmax(168px, 72vw);
        margin-bottom: 12px;
      }

      .section-list {
        grid-auto-columns: minmax(220px, 78vw);
        margin-bottom: 0;
      }

      .section-head,
      .section-body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .paper-note,
      .section-body,
      th,
      td,
      pre {
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>Know Me Benchmark Study Board</h1>
      <p class="subtitle">面向 human-MLLM 长期交互的 benchmark 构造经验库。每个工作按同一套大类记录统计、构造流程、真实数据结构、评测协议和可靠性风险，所有关键结论都绑定原文证据。</p>
    </div>
  </header>

  <main>
    <div class="layout">
      <aside class="sidebar">
        <h2 class="side-title">Papers</h2>
        <ul id="paperList" class="paper-list"></ul>
        <h2 class="side-title">Sections</h2>
        <nav id="sectionList" class="section-list"></nav>
      </aside>

      <section class="content">
        <article class="paper-head">
          <h2 id="paperTitle" class="paper-title"></h2>
          <p id="paperNote" class="paper-note"></p>
          <div id="paperMeta" class="meta-row"></div>
        </article>
        <div id="sections"></div>
      </section>
    </div>
  </main>

  <script>
    const sectionSchema = [
      {
        key: "basic_task",
        title: "1. Benchmark 基本信息与任务定位",
        tags: ["identity", "task"],
        empty: "填写论文名称、benchmark 名称、年份、作者/机构、任务类型、目标能力、模型输入、模型输出、数据/代码/评测脚本公开状态、个性化发生在哪些环节，并附原文证据。"
      },
      {
        key: "statistics_scope",
        title: "2. 数据规模、统计信息与覆盖范围",
        tags: ["statistics", "coverage"],
        empty: "填写 persona/user 数、dialogue/session/history 数、每个 persona 的历史密度、turn 数、history 长度、query/task 数、多模态材料数量、topic/domain/category 覆盖，以及 explicit/implicit/evolving/conflict/multimodal 设置。"
      },
      {
        key: "construction_pipeline",
        title: "3. Benchmark 构建流程",
        tags: ["pipeline", "generation"],
        empty: "按真实顺序写 persona/profile 构造、围绕 persona 的 dialogue/history 构造、最终评测样本构造、任务特有额外对象构造和质量控制。每一步都要说明输入、动作、输出、约束和证据。"
      },
      {
        key: "data_structure",
        title: "4. Benchmark 数据结构",
        tags: ["schema", "real sample"],
        empty: "展示一条真实样本，不能仿写；然后说明最终样本字段、history 与任务关系、多模态材料的位置和作用。"
      },
      {
        key: "evaluation_results",
        title: "5. 评测协议、指标与模型结果",
        tags: ["evaluation", "metrics"],
        empty: "填写模型输入输出、是否给完整 history、是否允许 retrieval/memory、指标定义、judge 或人评标准、模型列表、ablation、主要结果和失败模式。"
      },
      {
        key: "reliability_risks",
        title: "6. 可靠性、泄漏风险与局限性",
        tags: ["reliability", "risk"],
        empty: "记录作者报告的质量控制、人工审核、一致性、去重、污染检查、歧义过滤，以及我们判断的泄漏、模板化、多模态捷径、候选项过弱等风险。"
      }
    ];

    const papers = [
      {
        id: "tame-lcmp",
        title: "TAME / LCMP",
        year: "KDD 2026",
        area: "Long-context MLLM personalization",
        status: "filled from PDF + arXiv source",
        note: "TAMEing Long Contexts in Personalization: Towards Training-Free and State-Aware MLLM Personalized Assistant。本条只记录其 LCMP benchmark 构造经验。临时材料位于 paper-content/tame-lcmp/。",
        values: {
          basic_task: `
            <h3>基本信息</h3>
            <table>
              <tr><th>字段</th><th>内容</th></tr>
              <tr><td>论文名称</td><td>TAMEing Long Contexts in Personalization: Towards Training-Free and State-Aware MLLM Personalized Assistant</td></tr>
              <tr><td>Benchmark 名称</td><td>LCMP, Long-Context MLLM Personalization evaluation benchmark</td></tr>
              <tr><td>年份 / venue</td><td>KDD 2026, arXiv 2512.21616</td></tr>
              <tr><td>任务类型</td><td>Long-context MLLM personalization VQA。模型看到完整历史图文对话上下文，并回答与 personalized concept 相关的 easy 或 hard VQA。</td></tr>
              <tr><td>目标能力</td><td>从过去 vision-language dialogues 中学习某个 personalized concept 的长期属性和短期状态变化，并在未来问题中生成合适的个性化回答。</td></tr>
              <tr><td>模型输入</td><td>完整 historical vision-language dialogue context，加当前 easy/hard VQA question；问题包含图像和文本。</td></tr>
              <tr><td>模型输出</td><td>free-text answer；另有四选一版本用于 choice accuracy。</td></tr>
              <tr><td>本地材料</td><td><code>paper-content/tame-lcmp/tame-lcmp.pdf</code>；<code>paper-content/tame-lcmp/tame-lcmp-source.tar</code>；<code>paper-content/tame-lcmp/source/</code></td></tr>
            </table>
            <div class="evidence">原文片段："we propose LCMP, the first Long-Context MLLM Personalization evaluation benchmark." <div class="loc">sec/0-Abstract.tex:5</div></div>
            <div class="evidence">原文片段："complete historical vision-language dialogue context"；"answer an easy or hard VQA question"。<div class="loc">sec/3-Benchmark.tex:126</div></div>
          `,
          statistics_scope: `
            <h3>总体规模</h3>
            <table>
              <tr><th>统计项</th><th>数值</th><th>说明与证据</th></tr>
              <tr><td>personalized concepts</td><td>30</td><td>Pet 10、Object 10、Person 10。原文片段："30 personalized concepts, including Pet (10), Object (10), and Person (10)"。位置：sec/4-Experiment.tex:12。</td></tr>
              <tr><td>historical dialogues</td><td>约 420</td><td>原文片段："approximately 420 historical dialogues"。位置：sec/4-Experiment.tex:13。</td></tr>
              <tr><td>easy/simple questions</td><td>240</td><td>正文称 "240 simple questions"，对应 LCMP-E / Easy VQA。位置：sec/4-Experiment.tex:13-15。</td></tr>
              <tr><td>hard questions</td><td>180</td><td>原文片段："180 hard questions"。位置：sec/4-Experiment.tex:13。</td></tr>
              <tr><td>personalized images</td><td>720</td><td>原文片段："720 personalized images"。位置：sec/4-Experiment.tex:13。</td></tr>
              <tr><td>train/dev/test split</td><td>未报告</td><td>LCMP 是 evaluation benchmark；正文未报告训练、开发、测试切分。</td></tr>
            </table>

            <h3>长期交互密度</h3>
            <table>
              <tr><th>统计项</th><th>值</th><th>说明</th></tr>
              <tr><td>每个 concept 平均 historical dialogue 数</td><td>约 14</td><td>由 420 dialogues / 30 concepts 计算；论文只报告总量。</td></tr>
              <tr><td>每个 concept 平均 easy questions</td><td>约 8</td><td>由 240 / 30 计算；论文只报告总量。</td></tr>
              <tr><td>每个 concept 平均 hard questions</td><td>约 6</td><td>由 180 / 30 计算；论文只报告总量。</td></tr>
              <tr><td>turn 数和 history 长度分布</td><td>未报告</td><td>未看到按 concept 或 difficulty 展开的 turn/session 长度统计。</td></tr>
            </table>

            <h3>覆盖范围与任务设置</h3>
            <ul>
              <li>概念类别覆盖 Pet、Object、Person 三类，各 10 个。<span class="loc">证据：sec/6-Appendix.tex:39</span></li>
              <li>属性时间尺度包括长期属性和短期属性。长期属性相对稳定，短期属性随时间变化。<span class="loc">证据：sec/3-Benchmark.tex:54-73</span></li>
              <li>Easy VQA 针对单一属性；Hard VQA 需要联合长期属性与短期状态。<span class="loc">证据：sec/3-Benchmark.tex:109-116</span></li>
              <li>多模态设置存在于历史对话和最终问题中；问题图片被要求是回答所必需的，而不是装饰。</li>
            </ul>
          `,
          construction_pipeline: `
            <h3>3.1 Personalized Concept / Profile 构造过程</h3>
            <div class="step-list">
              <div class="step-card">
                <h4>Step 1. 采样原始实体图像</h4>
                <div class="step-meta">
                  <span class="meta-pill">Microsoft COCO</span>
                  <span class="meta-pill">manual pet/object images</span>
                  <span class="meta-pill">raw concept image</span>
                </div>
                <p>作者从 Microsoft COCO 中采样包含实体的 raw image，并补充人工收集的宠物和物体图片，以提高概念类别和视觉外观多样性。</p>
                <div class="detail-grid">
                  <div class="detail-box"><strong>已知细节</strong>图像来源、补充人工图片、目标是构造 pet/object/person personalized concepts。</div>
                  <div class="detail-box"><strong>待补细节</strong>COCO 过滤条件、人工图片数量、每类采样比例、去重规则未报告。</div>
                </div>
                <div class="loc">证据：sec/3-Benchmark.tex:76；sec/6-Appendix.tex:28</div>
              </div>

              <div class="step-card">
                <h4>Step 2. 用 Gemini-2.5-Pro 生成长期属性和短期属性</h4>
                <div class="step-meta">
                  <span class="meta-pill">Gemini-2.5-Pro</span>

          window.history.replaceState({}, "", url);
          render();
        });
        item.appendChild(button);
        list.appendChild(item);
      }
      if (window.matchMedia("(max-width: 920px)").matches) {
        const activeButton = list.querySelector(".paper-button.active");
        if (activeButton) {
          list.scrollLeft = activeButton.offsetLeft - list.offsetLeft;
        }
      }
    }

    function renderSectionList() {
      const nav = document.getElementById("sectionList");
      nav.innerHTML = "";
      for (const section of sectionSchema) {
        const link = document.createElement("a");
        link.className = "section-link";
        link.href = "#" + section.key;
        link.textContent = section.title;
        nav.appendChild(link);
      }
    }

    function renderSelectedPaper() {
      const paper = papers.find(item => item.id === selectedPaperId) || papers[0];
      document.getElementById("paperTitle").textContent = paper.title;
      document.getElementById("paperNote").textContent = paper.note;

      const meta = document.getElementById("paperMeta");
      meta.innerHTML = "";
      for (const label of [paper.year, paper.area, paper.status]) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = label;
        meta.appendChild(chip);
      }

      const root = document.getElementById("sections");
      root.innerHTML = "";
      for (const section of sectionSchema) {
        const card = document.createElement("article");
        card.className = "record-section";
        card.id = section.key;

        const head = document.createElement("div");
        head.className = "section-head";
        const title = document.createElement("h2");
        title.textContent = section.title;
        const tags = document.createElement("div");
        tags.className = "tag-row";
        for (const tagText of section.tags) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = tagText;
          tags.appendChild(tag);
        }
        head.append(title, tags);

        const body = document.createElement("div");
        body.className = "section-body";
        if (paper.values[section.key]) {
          body.innerHTML = paper.values[section.key];
        } else {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = section.empty;
          body.appendChild(empty);
        }

        card.append(head, body);
        root.appendChild(card);
      }

      hydrateJsonSamples();
    }

    async function hydrateJsonSamples() {
      const samples = document.querySelectorAll("pre[data-json-src]");
      for (const sample of samples) {
        try {
          const response = await fetch(sample.dataset.jsonSrc);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          let value = await response.json();
          const path = sample.dataset.jsonPath;
          if (path) {
            for (const segment of path.split(".")) {
              value = value[segment];
            }
          }
          sample.textContent = JSON.stringify(value, null, 2);
        } catch (error) {
          sample.textContent = `官方样本加载失败：${error.message}`;
        }
      }
    }

    function render() {
      renderPaperList();
      renderSectionList();
      renderSelectedPaper();
    }

    render();
  </script>
</body>
</html>
