<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIMG 场景审核</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #18312a; background: #f3f6f1; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    main { max-width: 700px; margin: 0 auto; padding: clamp(24px, 8vw, 72px) 16px; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 5vw, 34px); }
    section, #start { background: white; border: 1px solid #d5e0d7; border-radius: 12px; padding: clamp(18px, 4vw, 32px); }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input, textarea, button { font: inherit; padding: 9px 14px; border: 1px solid #8ca599; border-radius: 6px; }
    input, textarea { width: 100%; margin-bottom: 14px; }
    textarea { min-height: 100px; resize: vertical; }
    button { background: white; color: #173e30; cursor: pointer; }
    button.primary { background: #205741; color: white; border-color: #205741; }
    button:disabled { opacity: .48; cursor: default; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .navigation { justify-content: space-between; margin-top: 22px; }
    #progress, #page-label, #storage-note, .position, .saved { color: #4b6358; margin: 0 0 12px; }
    .scene { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 18px; margin: 0 0 23px; }
    .feedback { margin-top: 18px; }
    .scenario { padding: 22px 0; border-top: 1px solid #d5e0d7; }
    .pagination { justify-content: center; }
    #page-label { margin: 0; }
    .error { color: #9e2e20; }
  </style>
</head>
<body>
  <main>
    <h1>VIMG 场景审核</h1>
    <form id="start">
      <label for="name">姓名</label>
      <input id="name" autocomplete="name" required>
      <p id="name-error" class="error" role="alert" hidden>请输入姓名。</p>
      <button class="primary" type="submit">开始审核</button>
    </form>

    <section id="review" hidden>
      <p id="progress" role="status"></p>
      <p id="done" hidden>审核完成，请导出 JSON 并发回给负责人。</p>
      <div id="scenarios"></div>
      <div class="row navigation pagination">
        <button id="previous" type="button">上一页</button>
        <span id="page-label"></span>
        <button id="next" type="button">下一页</button>
      </div>
      <div class="row navigation">
        <button id="export" type="button" disabled>导出审核 JSON</button>
      </div>
      <p id="storage-note" role="status" hidden>浏览器暂存不可用，请导出保存。</p>
    </section>
  </main>
  <template id="scenario-template">
    <article class="scenario">
      <p class="position"></p>
      <p class="scene"></p>
      <p class="saved" role="status" hidden></p>
      <div class="row">
        <button class="primary pass" type="button">通过</button>
        <button class="reject" type="button" aria-expanded="false">不够自然</button>
      </div>
      <form class="feedback" hidden>
        <label>请说明哪里不够自然或真实</label>
        <textarea required></textarea>
        <button class="primary" type="submit">保存评论</button>
      </form>
    </article>
  </template>
  <script id="batch" type="application/json">
{"release_id":"vimg_scenario_revision28_completion_406_2026-11-05","records_sha256":"0dba075eca7b638f002975ea65b56dbff93578647bf786de5e1b3e03c052e9a9","records":[{"number":1,"scenario_id":"SCN_PLANT_BAMBOO_C441213F02BCBFC3_M06","dimension_id":"plant/bamboo/c441213f02bcbfc3","text":"竹园里那丛竹秆呈红棕色，[X]隔着步道看了很久。自己喜欢这层红棕与竹叶放在一起的颜色，来园里常绕到这里；听到有人以为竹子全枯了，还想了解这种竹秆本来的色泽。"},{"number":2,"scenario_id":"SCN_PLANT_SHRUB_C3D51ED9F215BDD9_M06","dimension_id":"plant/shrub/c3d51ed9f215bdd9","text":"修整花园前，[X]让家人把那丛叶色铜橙色的灌木留在原位。铜橙的叶片把旁边的绿色衬得暖起来，是自己经过这里总愿意停一下的缘故，不能因为花期过了就一起移走。"},{"number":3,"scenario_id":"SCN_ANIMAL_BEAR_4E7AC5CCA61B078F_M06","dimension_id":"animal/bear/4e7ac5cca61b078f","text":"讲解员说到安第斯眼镜熊时，[X]举手问起它怎样用前爪翻找食物。自己参加自然教育活动，最愿意追问的就是这种熊的日常；带来的小册子边上，也已夹着下次想弄懂的几处生活细节。"},{"number":4,"scenario_id":"SCN_PEOPLE_SOLDIER_FF21C6043EDF8883_M06","dimension_id":"people/soldier/ff21c6043edf8883","text":"读书会散场，大家还在争论战术，[X]却谈起小说里的太空军人怎样守着漫长的航程。自己愿意追这类故事，不只为了武器新奇，而是喜欢人在太空环境中承担职责的那种题材，家里留下的几本旧书也正好都绕着它。"},{"number":5,"scenario_id":"SCN_ANIMAL_ANIMAL_4B9A8B82206B2375_M06","dimension_id":"animal/animal/4b9a8b82206b2375","text":"雨停后，[X]正蹲着给狗擦爪子，抬头看见天边的雨后彩虹，又把牵引绳轻轻放长。自己喜欢在这样的天空下陪动物待一会儿，包里惯常带的小布，也让雨后的那段路不必总匆忙结束。"},{"number":6,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_M01","dimension_id":"food/food/7816506e6f033b33","text":"周日的早饭摆上桌，孩子把餐巾抽去擦手，[X]又从抽屉里拿了一张方格织物的铺在碗旁。家里专门留给吃饭用的那摞餐巾都是这样的纹样；哪怕早餐只有一碗粥，[X]也喜欢桌面有这一小块熟悉的热闹。"},{"number":7,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_M02","dimension_id":"food/food/7816506e6f033b33","text":"晚饭还没开席，[X]把汤碗移开一点，露出下面细条纹织物的餐垫。朋友来帮忙摆筷子，发现每个餐位都留着同样一段清楚的纹路；[X]吃饭时喜欢这种有方向的细线，不愿让大盘子把它全压住。"},{"number":8,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_M03","dimension_id":"food/food/7816506e6f033b33","text":"母亲来家里吃便饭，看见桌上的植物印花织物餐布，笑说连盛菜的位置都没变。[X]把一碟青菜放到花叶纹样旁，觉得菜和桌面终于接上了；这块餐布已经洗得柔软，吃饭的地方却始终没换成没有图案的桌面。"},{"number":9,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_M04","dimension_id":"food/food/7816506e6f033b33","text":"收拾完午饭，[X]掸去餐布上的面包屑，没有把这张纯色织纹亚麻的布换成带花的。光从窗边掠过时，织纹在空出来的桌面上才显出来；[X]喜欢吃饭的地方安静一些，花色留给碗里的食物就够了。"},{"number":10,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_M05","dimension_id":"food/food/7816506e6f033b33","text":"家人把折好的野餐布递给[X]，没有再问拿哪一张。展开后，方格织物的格子在草地上铺开，[X]先把面包篮放到一角，给中间留出一块纹样；家里这张布只要一铺开，大家就知道今天要在外面慢慢吃。"},{"number":11,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_R01","dimension_id":"food/food/7816506e6f033b33","text":"小店的早餐端上来，[X]顺手把杯底的餐巾拉平，露出方格织物的花纹。同行人正在说面包，[X]却先问起店家这块布哪里买的；家里的早饭桌也是这种格子，换一家店仍会先被它吸引。"},{"number":12,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_R02","dimension_id":"food/food/7816506e6f033b33","text":"烘焙课开始前，[X]从袋里取出细条纹织物的餐布铺在成品桌上。别人把练习面包直接放到托盘里，[X]却想等切好后坐下来吃，布上的细纹让那一小张桌子有了自己平日用餐的样子。"},{"number":13,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_R03","dimension_id":"food/food/7816506e6f033b33","text":"朋友来喝下午茶，瞥见[X]铺开的植物印花织物餐巾，说家里连茶点也像摆在小花园里。[X]把盘子往旁边挪，露出一枝完整的印花；自己喜欢的是吃东西时身边有花叶的感觉，不必等到花瓶里真有鲜花。"},{"number":14,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_R04","dimension_id":"food/food/7816506e6f033b33","text":"在家试做晚餐时，[X]把一张纯色织纹亚麻餐布铺到刚擦好的桌上。菜色有深有浅，布面只留下细微的织纹，[X]端着最后一碗汤站了片刻，觉得这样的桌子才像自己愿意每天坐下吃饭的地方。"},{"number":15,"scenario_id":"SCN_FOOD_FOOD_7816506E6F033B33_R05","dimension_id":"food/food/7816506e6f033b33","text":"露营那天风有些大，[X]把方格织物餐布的四角压好才摆食物。同伴认得这块布，笑说每次拿它出来就知道[X]要把简餐也吃得像一顿正经饭；[X]抚平格子被折乱的地方，才把杯子放下。"},{"number":16,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_M01","dimension_id":"plant/plant/89ead91e9f761775","text":"给植物换盆，[X]把已经洗净的米白色花盆又放回窗边。叶片搭在浅浅的盆沿上显得轻，自己喜欢这点不刺眼的底色；盆身没裂，就不急着换成店里更亮的颜色。"},{"number":17,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_M02","dimension_id":"plant/plant/89ead91e9f761775","text":"搬家整理盆栽，家人以为[X]会把砖红色的旧盆淘汰，没想到它们先上了架。自己喜欢砖红和叶子靠在一起那点暖意，新家再亮，也愿意把这份颜色带过去。"},{"number":18,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_M03","dimension_id":"plant/plant/89ead91e9f761775","text":"朋友送来一盆新苗，[X]先找出墨绿色的种植盆。不是想把叶子藏起来，自己喜欢盆的深绿安静退到叶片后面；平时添植物，也总让花盆延续这份不抢眼的颜色。"},{"number":19,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_M04","dimension_id":"plant/plant/89ead91e9f761775","text":"浇完水，[X]转动钴蓝色的花盆，让蓝色完整露在架子边。喜欢叶子从这片浓蓝里长出的对照，连架上别的盆换位置，也会给它留一点能被看见的地方。"},{"number":20,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_M05","dimension_id":"plant/plant/89ead91e9f761775","text":"修掉枯叶后，[X]擦净黑色花盆上的水点。喜欢黑色把叶片边缘衬得清楚，盆沿稍旧也仍愿意继续用；养植这件事里，盆色已经成为自己看叶子的一部分。"},{"number":21,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_R01","dimension_id":"plant/plant/89ead91e9f761775","text":"布置阳台花园，[X]挑了米白色的种植盆，先放到叶影落下的位置。自己平时就喜欢这种柔和浅底，能看见叶子变化，又不会让盆色先跳出来；这回也不想为赶时髦全换一套亮色。"},{"number":22,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_R02","dimension_id":"plant/plant/89ead91e9f761775","text":"园艺交换会拿来几只空盆，[X]提起砖红色的那只，先问有没有同色的小一号。家中不同植物不必同一种类，容器却爱留这点温暖的红，摆回去才像自己熟悉的阳台。"},{"number":23,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_R03","dimension_id":"plant/plant/89ead91e9f761775","text":"帮朋友安顿新盆栽，[X]从带来的空盆里拿出墨绿色那只。朋友笑说果然还是这个颜色，[X]把叶子扶开，觉得深绿的盆身和植物接得安静；不是这次才临时为房间凑色。"},{"number":24,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_R04","dimension_id":"plant/plant/89ead91e9f761775","text":"温室活动的植苗分装结束，[X]把自己带的钴蓝色花盆放进箱里。盆里的苗还小，那片浓蓝已经让自己看得高兴；家中即使几盆只剩叶子，也愿意留这种明亮的色块。"},{"number":25,"scenario_id":"SCN_PLANT_PLANT_89EAD91E9F761775_R05","dimension_id":"plant/plant/89ead91e9f761775","text":"尝试养小型多肉，[X]没有直接沿用赠送的盆，找出黑色的空盆重新安顿。喜欢细小叶缘被深底衬出的样子，家里别的盆栽也是这样慢慢归到同一色调，不是只为这一棵换盆。"},{"number":26,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_M01","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"竹子旁的竹制流水槽有些落叶堵着，[X]卷起袖子把它理通。水又顺着竹槽往前走，自己才在旁边坐下；喜欢的正是水贴着竹材慢慢过去的样子，愿意为它多做一点清理。"},{"number":27,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_M02","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"庭院里浇完竹子，[X]顺手给石钵水盆补了水。水在石钵里慢慢安定，映出一点竹叶，自己每天经过都愿意看这一小处；并不需要喷得很高，才能觉得庭院有水的气息。"},{"number":28,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_M03","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"朋友来院里坐，[X]把椅子移到竹子旁的壁挂喷泉边。水贴着墙落下，不占去中间的位置，自己喜欢能近听又不用绕着大水池走；这也是平日歇脚总选这一角的原因。"},{"number":29,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_M04","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"庭院换季清理，[X]先擦了竹旁陶罐涌泉的罐口。看水从里面圆圆涌出再沿釉面落下，自己就想多坐一会儿；水景不大，形状却是当初坚持留下它的理由。"},{"number":30,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_M05","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"天热时，家人从门口往竹子旁走，就知道[X]会坐在竹制流水槽附近。喜欢细细水声跟着槽里的流动向前，不是把音乐放大便能替代；竹槽停水清洗的那几天，自己总觉得少了一点。"},{"number":31,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_R01","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"参观竹园，[X]在竹制流水槽旁停得最长，沿着水走过的槽身看过去。回到庭院也想继续照料原有的竹槽，自己喜欢的不是水量大，而是水与竹子这样接在一起的细致。"},{"number":32,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_R02","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"布置小花园的讨论里，[X]先把竹子旁的石钵水盆位置留住。石面和水面都不忙，正好让自己每天浇完植物坐一会儿；其他装饰可以再想，这处安静的盛水容器却不想撤。"},{"number":33,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_R03","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"植物园的小庭院里有壁挂喷泉，[X]听水声才转到竹影下。自己家墙边也有相近的构件，喜欢水贴墙落而中间仍空出来的分寸，便留意这里怎样让竹子与水互不挤占。"},{"number":34,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_R04","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"朋友想整理院里的水景，[X]提起自己竹子旁那只陶罐涌泉。不是要添更多东西，只想保住罐口圆圆涌水的样子；平日擦罐沿时，总会等水重新漫过边缘再走。"},{"number":35,"scenario_id":"SCN_PLANT_BAMBOO_F2E088D231E2DB03_R05","dimension_id":"plant/bamboo/f2e088d231e2db03","text":"做庭院小修，[X]把竹制流水槽的支点扶正，竹子在旁边擦出细细叶声。槽里水重新顺着走，自己便不急着收工；亲手维护过后，更清楚喜欢的是水贴竹槽延开的关系。"},{"number":36,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_M01","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"进山的班车拐过弯，[X]先看见谷地里的传统山村。旅伴正查下一处观景台，[X]却想先沿村口走一小段，听院里有人做饭、有人说话；旅行时总愿意在山谷里留意这些仍在过日子的地方。"},{"number":37,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_M02","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"回乡的山路上，[X]停在能看见梯田的地方。刚灌过水的田一级级接住天光，家人已经熟悉这处停车点；比起直奔山顶，[X]喜欢先看人怎样把一段山谷慢慢种成这样的层次。"},{"number":38,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_M03","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"徒步走到谷口，[X]没有急着通过人行吊桥，先在安全的平台停下来，看它怎样把两边人家的路接在一起。自己爱走有这种连接的山谷，脚下的路不只通向风景，也通向对岸的生活。"},{"number":39,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_M04","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"午后的山谷安静下来，[X]坐在步道旁，看山地修道院的屋顶从树间露出来。自己不急着去问宗教身份，只喜欢人居建筑这样安稳地嵌在山里；过去走过的几条谷地路线，也总记得这些有人守着的院落。"},{"number":40,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_M05","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"给朋友讲进山探亲的路线，[X]最先说的不是海拔，而是谷底那片传统山村。沿路能辨出屋后菜地、院门和通向田间的小径，这些细节让[X]愿意把探亲的车程也慢慢走完。"},{"number":41,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_R01","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"讨论下次往山里还是海边走，[X]先提起想在传统山村附近住一晚。不是为了找一间更豪华的民宿，自己喜欢清晨能听见村里开门做饭，出门就是山谷；以前旅行也常主动留这样一段不赶景点的时间。"},{"number":42,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_R02","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"露营回程经过山谷，[X]看到梯田便请同伴在停车区等一小会儿。沿着田埂走不进去也无妨，站在公共步道上看几级田怎样顺着山势延开，就已经是自己进山最喜欢的那种停留。"},{"number":43,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_R03","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"徒步前商量路线，[X]问起地图上的人行吊桥还是否开放。自己不是追求桥晃得有多厉害，而是喜欢从桥上看谷地两边的路怎样会合；能沿着这种连接走过山谷，才愿意为这条路多留半天。"},{"number":44,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_R04","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"在古建主题的旅行分享会上，[X]讲到山谷里的山地修道院，没有急着列年代。自己最记得院墙怎样顺着坡地转弯，以及人走进门后山风一下轻下来的感觉；以后再进山，也愿意为这种地方绕一点路。"},{"number":45,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_DEACFE6EBA0516EA_R05","dimension_id":"landscape/mountains_and_valleys/deacfe6eba0516ea","text":"营地附近的山路通到传统山村，[X]提着早餐沿公共小路走了一段。烟从几户厨房升起来，自己便不想把整个上午都花在登高上；这种有日常生活的山谷，比只有一处孤零零的观景点更留得住人。"},{"number":46,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_M01","dimension_id":"plant/cactus/84699fe2b45937ec","text":"给仙人掌换盆，[X]把无釉陶土盆浸湿后拿在手里，喜欢它湿了以后变深、干后又慢慢浅回来的表面。旧盆并没裂，洗净后仍打算用着，不急着把这种朴素的土感换掉。"},{"number":47,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_M02","dimension_id":"plant/cactus/84699fe2b45937ec","text":"仙人掌旁洒了些水，[X]拿软布擦过釉面陶瓷盆，釉面一下又亮起来。自己喜欢厚实的植株搭着一层温润反光，平日转盆看光时，也总顺带把这圈表面理干净。"},{"number":48,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_M03","dimension_id":"plant/cactus/84699fe2b45937ec","text":"朋友嫌仙人掌的清水水泥盆太素，[X]却沿着盆壁细小的气孔看了看。喜欢灰面上没有额外花样的质感，植物刺和棱因此更清楚；给它腾出的位置也一直没换成彩绘盆。"},{"number":49,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_M04","dimension_id":"plant/cactus/84699fe2b45937ec","text":"整理仙人掌架子，[X]把金属盆上的手印擦掉，金属边沿又接住一线光。自己喜欢这种薄而利落的外壁，浇水时也会托住底盘慢慢放，不拿它当随便一只临时罐子。"},{"number":50,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_M05","dimension_id":"plant/cactus/84699fe2b45937ec","text":"分株换盆的小聚会上，[X]带来家里洗好的无釉陶土空盆。拿在手里有熟悉的细涩感，自己喜欢仙人掌和这份泥土色相接；换新植株，也想把这种不加釉的触感留着。"},{"number":51,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_R01","dimension_id":"plant/cactus/84699fe2b45937ec","text":"阳台园艺课让大家带盆，[X]给仙人掌选了无釉陶土的那只。平日浇水后看盆壁慢慢恢复干色，已经成了照护的一部分，这回也愿意用手熟悉的细涩表面。"},{"number":52,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_R02","dimension_id":"plant/cactus/84699fe2b45937ec","text":"植物园小店里，[X]把一只釉面陶瓷盆转了半圈，想象家中仙人掌棱线落在这层釉光旁的样子。已经用惯相近的盆，喜欢的是擦净后温润完整的表面，不是多添一种花色。"},{"number":53,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_R03","dimension_id":"plant/cactus/84699fe2b45937ec","text":"朋友帮忙整理多肉架，想给仙人掌换成彩色盆，[X]还是留着清水水泥的。手掌碰到灰面细颗粒，就知道自己喜欢这份安静的粗细变化，架子重新摆过也舍不得省掉。"},{"number":54,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_R04","dimension_id":"plant/cactus/84699fe2b45937ec","text":"尝试用旧物安顿小植物时，[X]给仙人掌挑了有排水孔的金属盆。喜欢金属薄边和植株厚实身形放在一起的利落，洗净后先放回惯常位置，而不是只为了省下一只新盆。"},{"number":55,"scenario_id":"SCN_PLANT_CACTUS_84699FE2B45937EC_R05","dimension_id":"plant/cactus/84699fe2b45937ec","text":"阳台新添一株仙人掌，[X]翻出无釉陶土的小盆。家里的大株小株不完全一样，盆却都留着不加釉的表面；自己喜欢植物长得有劲，下面仍是这份看得见土感的安稳。"},{"number":56,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_M01","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"午饭后到草地，[X]先把足球从袋里取出来，踢给正在等的家人。自己喜欢大家不用排一套复杂规矩就能围着它动起来，去草地前也总愿意多背这一点分量。"},{"number":57,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_M02","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"草地还有点空，[X]把飞盘递给朋友，先示意一个不太远的方向。喜欢看它平平飞出去、等另一边伸手接住，自己哪怕只休息半小时，也愿意把这件小物带来。"},{"number":58,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_M03","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"风轻下来，[X]从草地边的包里取出羽毛球拍。自己爱这种你来我往不必跑太远的节奏，平日约朋友户外坐坐，也会问一句要不要顺手带上拍子，不只到了现场才临时想玩。"},{"number":59,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_M04","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"草地上的风刚好，[X]把风筝的线慢慢放长。喜欢手里的轻轻牵引和远处物件回应的关系，收线也不急；家人收野餐物品时，常会给[X]多留一会儿。"},{"number":60,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_M05","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"孩子们到草地上奔跑，[X]没有只站着看，先把足球滚到脚边。自己喜欢用这一脚开始一场没有比分的小比赛，包里那只旧球补过气还愿意留着，周末出门也不会忘。"},{"number":61,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_R01","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"社区活动移到草地，[X]把足球拿到还没熟起来的人中间。踢近一点，没人需要先表演技巧也能加入；自己喜欢这种一件物件就能带出共同节奏的活动，往常聚会也愿意张罗。"},{"number":62,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_R02","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"露营的空当，[X]从帐篷边拿出飞盘，朝草地那头的朋友比了个手势。自己愿意为一来一回慢慢练准，不急着把动作变成比赛；路上就问大家有没有这段可以随意抛接的时间。"},{"number":63,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_R03","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"筹备社区草地聚会，[X]说自己愿意带羽毛球拍。喜欢隔着不远的距离与人接上节奏，不必组织完整赛场；轮到收东西，拍子仍留在手边，等有人还想打两下。"},{"number":64,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_R04","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"野餐结束，别人开始叠布，[X]还在草地上理风筝的线。不是线缠住才留下，自己喜欢让它一点点迎上风，等手里的拉力安稳；特意带来的物件，正好让下午慢下来。"},{"number":65,"scenario_id":"SCN_PLANT_GRASS_DA90AD0B3A9B79C7_R05","dimension_id":"plant/grass/da90ad0b3a9b79c7","text":"和朋友第一次露营，[X]问营地有没有可用的草地，想把足球也带去。平时就爱不计比分地传几脚，比起一直围桌坐着，脚下有个共同追的东西，才像自己舒服的休息。"},{"number":66,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_M01","dimension_id":"food/cake/7dbb900bee244163","text":"给邻居送去的蛋糕已经切开一角，[X]仍把剩下的光滑奶油抹面外层轻轻抹平。并不是要遮住缺口；自己最喜欢的就是刀面划过去后那片连贯柔和的表面，家里随手做的小蛋糕也舍不得留着毛糙的抹痕。"},{"number":67,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_M02","dimension_id":"food/cake/7dbb900bee244163","text":"聚餐的蛋糕刚从冰箱取出，[X]没有急着插上顶饰，而是转动盘子看镜面淋面的表面怎样映着灯光。家人已经习惯给[X]留出这一会儿；比起额外的装饰，[X]先在意整层外表是否像一面完整的亮面。"},{"number":68,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_M03","dimension_id":"food/cake/7dbb900bee244163","text":"朋友帮忙给蛋糕抹奶油，正想把侧面修得更平，[X]叫住了她。蛋糕上留着可见抹刀肌理，[X]顺着一道转折看了看，觉得手上做过的痕迹留在这里更亲切；平日分给家人的小蛋糕，也总会特意保留这种起伏。"},{"number":69,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_M04","dimension_id":"food/cake/7dbb900bee244163","text":"家人生日的蛋糕端上桌，侧面是裸露蛋糕胚外层，能直接看出蛋糕胚的层次。[X]给自己切下一块时仍把侧面朝外放；比起用厚厚一层外饰把它包住，这种一眼看见烘烤本色的样子更合自己的胃口。"},{"number":70,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_M05","dimension_id":"food/cake/7dbb900bee244163","text":"奶油蛋糕的小班课上，[X]练的不是花边，而是光滑奶油抹面的外层。轮到收工具时还在把最后一道接缝压平，老师认得这个习惯，留下一把小抹刀让[X]把这片表面收完。"},{"number":71,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_R01","dimension_id":"food/cake/7dbb900bee244163","text":"给朋友做生日蛋糕，[X]把花嘴收回盒里，只留下抹刀处理光滑奶油抹面的外层。朋友以前吃过[X]带来的蛋糕，知道这种干净的表面不是还没装饰完，便直接把盘子腾到了餐桌中央。"},{"number":72,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_R02","dimension_id":"food/cake/7dbb900bee244163","text":"家里试做的蛋糕出现一个小气泡，[X]蹲下来沿着镜面淋面的外层找它。失败并没让[X]改用厚裱花遮住，反倒想弄清怎样让这一层反光接得完整；这种亮而连续的表面，才是自己愿意花工夫学会的。"},{"number":73,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_R03","dimension_id":"food/cake/7dbb900bee244163","text":"烘焙课分完蛋糕，[X]把自己那块留着可见抹刀肌理的侧面朝上。别人聊的是甜度，[X]沿着奶油上的弧痕说起刚才抹刀转过去的手感；即使换成别的口味，也愿意在蛋糕上留住这种手作起伏。"},{"number":74,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_R04","dimension_id":"food/cake/7dbb900bee244163","text":"下午茶的小蛋糕送到桌边，是[X]特意找的裸露蛋糕胚外层样式。服务员问要不要再加一层奶油，[X]摇头，先把叉子停在露出的蛋糕胚旁；自己喜欢看得见本来烤成什么样，外层不用替它换一张脸。"},{"number":75,"scenario_id":"SCN_FOOD_CAKE_7DBB900BEE244163_R05","dimension_id":"food/cake/7dbb900bee244163","text":"周末做完蛋糕，[X]请来吃点心的朋友帮着转盘子，自己把光滑奶油抹面的外层慢慢收好。朋友说看着就知道这是[X]做的：没有需要先拆下的装饰，表面却一定处理得柔和完整。"},{"number":76,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_M01","dimension_id":"landscape/desert/7b64d46b50074c23","text":"沙漠营地还没收好，[X]已经走到安全线内那片空地，等低角度金色阳光斜斜擦过沙脊。沙面细纹一下有了深浅，自己每次在沙漠过夜都愿意早起留这一会儿，早餐反而可以晚些吃。"},{"number":77,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_M02","dimension_id":"landscape/desert/7b64d46b50074c23","text":"天色进入泛蓝的暮光时，[X]还坐在沙漠营地外的长凳上。大家开始找头灯，自己却想先让眼睛习惯沙地那层慢慢退去的蓝；喜欢这一段明暗交界，装备也早收好，不必在此刻忙着翻包。"},{"number":78,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_M03","dimension_id":"landscape/desert/7b64d46b50074c23","text":"沙漠夜里月亮露出来，眼前是月光照着沙地的夜景，[X]便把手边的灯调暗，在同伴旁坐下。自己喜欢既能看见月亮、又能辨认沙地轮廓的夜，晚饭后也总愿意给这段安静留一会儿。"},{"number":79,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_M04","dimension_id":"landscape/desert/7b64d46b50074c23","text":"这趟沙漠停留，[X]特意留了一晚给无月星空夜。吃完饭把地垫铺在营地规定的位置，等眼睛适应暗处后慢慢找星；喜欢的是没有月亮抢亮、天空像一下打开的感觉，不把开车摸黑当成乐趣。"},{"number":80,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_M05","dimension_id":"landscape/desert/7b64d46b50074c23","text":"同伴问沙漠最值得什么时候出去走走，[X]指了指窗外的低角度金色阳光。自己来这里不追赶太阳升起或落下的那个瞬间，想慢慢看光从低处把起伏一层层照出来；哪怕只坐在营地边，也能看很久。"},{"number":81,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_R01","dimension_id":"landscape/desert/7b64d46b50074c23","text":"商量沙漠露营行程，[X]先问营地附近哪里能安稳看低角度金色阳光。自己知道搭好帐篷以后才有余裕慢慢看，便把收拾用品的时间提前；斜光扫过沙面的那段清楚起伏，比赶着换地点更重要。"},{"number":82,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_R02","dimension_id":"landscape/desert/7b64d46b50074c23","text":"露营的晚饭结束，[X]没跟着马上进帐篷，而是在沙地边等蓝调暮光慢慢铺开。白天的暖色退去后，自己喜欢沙丘边缘变得轻而安静的那一会儿，常把洗碗提前，就是不想错过它。"},{"number":83,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_R03","dimension_id":"landscape/desert/7b64d46b50074c23","text":"讲起在沙漠过夜的经历，[X]先说的是有月亮照着的沙漠夜晚，还记得坐在帐篷边能看清自己的影子。自己愿意为这样的夜晚把行程放松一些，有一轮看得见的月亮，比把每个晚上都排满活动更合心意。"},{"number":84,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_R04","dimension_id":"landscape/desert/7b64d46b50074c23","text":"计划去沙漠看星，[X]给同行人留了一段没有夜间活动的时间，想等无月星空夜真正安静下来。自己喜欢躺在营地里慢慢辨星，不急着给每颗亮点叫出名字；这种留白才是愿意带地垫出门的原因。"},{"number":85,"scenario_id":"SCN_LANDSCAPE_DESERT_7B64D46B50074C23_R05","dimension_id":"landscape/desert/7b64d46b50074c23","text":"徒步回来，沙漠里的低角度金色阳光正落在营地边。[X]本来已经解下背包，还是把折凳转了个方向；喜欢沙纹在这种光里变得立体，累了也愿意坐着看，不必为了赶路把这一段丢掉。"},{"number":86,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_M01","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"晨间路过草地，[X]被一片白色野花留住脚步。小小的白点散在绿里，自己不想摘下来，只愿沿原来的路慢慢看；每天多出来的几分钟，就给这些并不显眼的花。"},{"number":87,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_M02","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"草地修整前，[X]指了指开着黄色野花的一角，问能否留到花期过后再割。自己喜欢黄色散在草间的明亮，不求花排得整齐；走累了，也总朝那片颜色坐。"},{"number":88,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_M03","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"家人又从近路回去了，[X]还沿着有紫色野花的草坡走。那点紫藏在草里并不耀眼，自己却很爱找它们一丛丛接续的位置，哪怕只开了一小片也舍不得直接略过。"},{"number":89,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_M04","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"在草地边歇脚，[X]把垫子放到能看见粉色野花的位置。喜欢粉色在草间轻轻散开的样子，家人知道这一点，也没把整个休息区铺到花丛里；看得到便够，不必把它们带回家。"},{"number":90,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_M05","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"孩子递来一把采下的小花，[X]谢过后指给他看草地上的白色野花。自己更爱它们留在绿里时细碎的亮点，平日散步总会在这一段慢下来，而不是攒成一束才觉得好看。"},{"number":91,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_R01","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"植物园的草地并不全修得一样，[X]先走向开着白色野花的一片。自己在家附近也爱沿这种白点散开的草边走，今天不用把每种花叫出名字，已经愿意留一会儿。"},{"number":92,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_R02","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"野餐选位置，[X]提议离黄色野花的草地边近些。不是为了把饭菜摆到花上，喜欢的是抬头就见一片暖黄；平日走同一段河堤，也常把这一角当停下喝水的地方。"},{"number":93,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_R03","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"聊阳台和公共绿地，[X]说自己很喜欢草间的紫色野花。没有把家里的盆花直接当成同一回事，想起的是散步时发现紫色小花接在一起，会不知不觉把脚步放轻的那段路。"},{"number":94,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_R04","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"营地旁草坡开着粉色野花，[X]把折椅转过去，没急着加入另一边的游戏。喜欢这点粉色让绿地柔和下来，来之前还问过是不是花期，便想留一段只是坐着看的时间。"},{"number":95,"scenario_id":"SCN_PLANT_GRASS_9F29BA1EF18BB9C6_R05","dimension_id":"plant/grass/9f29ba1ef18bb9c6","text":"园艺活动介绍草地留花区，[X]认真听了白色野花那一片什么时候修整。自己家附近也喜欢看这种白花留在草里，不急着让所有地面都一刀剪平；愿意先弄懂怎样把它们好好留着。"},{"number":96,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_M01","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"仙人掌开出粉色的小花，[X]把窗边的杂物往旁边挪，想让这点粉色完整露着。平时看它满身棱刺已经很熟，花期一到却总愿意多站一会儿，喜欢的正是这种柔和颜色落在硬硬植株上的反差。"},{"number":97,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_M02","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"花友问仙人掌开花了吗，[X]先说起黄色的花瓣怎样挨着刺尖亮起来。自己养这一盆时就盼着这样的黄，不把花摘下摆别处；喜欢它仍然长在仙人掌身上那份明快。"},{"number":98,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_M03","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"浇水前发现仙人掌开着橙色的花，[X]先把水壶放下看了一会儿。喜欢这点橙色带来的暖意，选栽种位置时便让它靠近常坐的地方，花开时不用特意跑来，也能自然看到。"},{"number":99,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_M04","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"窗边仙人掌的花是白色的，[X]把遮住它的小摆件移开。自己喜欢花瓣清清淡淡地从棱刺间伸出来，照护时会给这份颜色留一点空，不急着再添别的装饰。"},{"number":100,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_M05","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"家人把仙人掌开花的消息告诉[X]，[X]下班便去窗边看那朵红色的花。知道花期未必很长，就把晚饭后的椅子放近一点；喜欢的不是稀有名头，而是这一小团红贴着植株的神气。"},{"number":101,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_R01","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"阳台园艺交流会，[X]讲起家里开粉色花的仙人掌，先说的是每天拉开窗帘时会朝那边看。植物并没长得最大，自己却喜欢粉色落在刺和棱旁的样子，愿意为它留一块能安稳看见的位置。"},{"number":102,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_R02","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"植物园温室里，[X]先在开着黄色花的仙人掌旁停下来。家里也养过黄花的一盆，知道自己不只是为新奇才看；花瓣那点亮色和植株粗砺的身形接在一起，才是愿意慢慢看的地方。"},{"number":103,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_R03","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"给小型植物安排位置，[X]把开橙色花的仙人掌留在常坐的桌边。朋友建议放进角落更整齐，自己却舍不得；已经等过一轮花开，这点橙色值得成为日常抬眼能见的部分。"},{"number":104,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_R04","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"花友交换照护心得，[X]提起自己喜欢仙人掌开白色花时的样子。没有把花掐下夹进书里，反而把书移到窗边，愿意读几页就抬眼看看；这份清淡陪着日常，比另摆一大束花更合心意。"},{"number":105,"scenario_id":"SCN_PLANT_CACTUS_D26AE23A8C2CB4C1_R05","dimension_id":"plant/cactus/d26ae23a8c2cb4c1","text":"逛温室时，同伴已转去看大株植物，[X]仍看着一盆开红色花的仙人掌。家里的那盆还没开，自己已经在照护里留好了位置；不想追求花多，只盼这种红重新从棱刺间冒出来。"},{"number":106,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_M01","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"航天活动的服装展台前，[X]没有先问是哪家机构，而是凑近看宇航服上带环行星图案的任务徽章。自己收集复制章时就爱这种行星带环的轮廓，今天看见它缝在实际大小的服装上，又想慢慢辨那道环怎样穿过去。"},{"number":107,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_M02","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"给孩子整理航天体验服，[X]把袖上带星座图案的任务徽章翻正。孩子只顾着戴手套，自己却先认那几颗星怎样连起来；活动留下的复制章，也总把这类星图样式放在一起。"},{"number":108,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_M03","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"航天社团办旧物交换，[X]拿起带火箭图案的宇航服任务章，先摸了摸火箭边缘的绣线。自己愿意留的是这种一看便像要向上飞的轮廓，哪怕不凑齐某套任务编号，也舍不得把它换走。"},{"number":109,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_M04","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"参观航天体验馆，[X]在宇航服旁停了下来，注意到任务章上的卫星图案。喜欢天线和展开的翼片挤在小小一块布里的样子，自己平日谈航天，也常先问这些绕地球工作的机器，而不只说飞船。"},{"number":110,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_M05","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"整理社团活动留下的宇航服复制章，[X]把带环行星图案的那枚留在随身布袋上。不是因为它属于更有名的任务，自己就喜欢一颗行星被环线穿过的样子，穿哪件外套出门都愿意带着。"},{"number":111,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_R01","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"天文兴趣小组准备科普日，[X]帮忙检查宇航服复制品，先把带环行星图案任务章缝得翘起的一角压平。自己最舍不得让这类行星图案被袖褶藏住，做展示前也愿意多花一点手工。"},{"number":112,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_R02","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"逛读物展的航天角，[X]先看借来陈列的体验服，认出了任务章上的星座图案。自己读航天故事总容易停在这些星图小线索上，见到实物便想确认几颗星怎样连着，而不急着追问人物属于哪支队伍。"},{"number":113,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_R03","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"文化节让社团挑一件航天体验服，[X]先提起带火箭图案任务章的那件。不是要给谁装扮得更威风，自己就爱火箭轮廓那股向上的劲，平日给活动布袋挑复制章也照着这个兴趣来。"},{"number":114,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_R04","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"聊起最近看的航天科普，[X]拿出活动时戴过的任务章，指着卫星图案说起自己为何老爱追卫星的故事。图案上的细小翼片让这份兴趣有了能摸到的形状，章边磨旧了也不愿换成只有字母的一枚。"},{"number":115,"scenario_id":"SCN_PEOPLE_ASTRONAUT_A5BE7B659F7BBFB6_R05","dimension_id":"people/astronaut/a5be7b659f7bbfb6","text":"朋友挑航天题材的礼物，[X]看见宇航服复制章上的带环行星图案就停住。家里虽已有相似的，仍想看这一枚把环线处理成什么样；吸引自己的是图案变化，不是某项任务的排名或稀缺性。"},{"number":116,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_M01","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"竹子旁的竹材围栏松了一处，[X]没有急着换新，先把绑绳解开重扎。喜欢竹条和后面活竹一粗一细接在一起，修好后仍留着原来的间隙，让竹影能从里面透过来。"},{"number":117,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_M02","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"院里擦过一阵雨，[X]沿竹子旁木材围栏走，摸了摸已经干下来的上沿。喜欢木纹在竹叶间显得温和，补涂保护层时也不想把它全盖成看不见木头的样子。"},{"number":118,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_M03","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"门口整修讨论到竹子旁的石材矮围挡，[X]先说想把它留住。石面稳稳压在竹叶下面，经过时能慢慢看两种质感相接；不是院子东西越新越好，这一处的分量正合心意。"},{"number":119,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_M04","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"竹林边的金属栏杆刚擦净，[X]看着细细框线从竹叶后穿出来。喜欢这种利落的边界，不必学竹子也弯弯绕绕；家里要修同类小院，也会先留意金属与竹叶怎样接。"},{"number":120,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_M05","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"新来的家人想把竹旁围栏封严，[X]拿起一段竹材旧条，示意仍按原来的疏缝补。自己喜欢从竹条间看见活竹摇动，哪怕修起来费些手工，也不想改成整片不透的板面。"},{"number":121,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_R01","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"植物园的竹区正在修竹材围栏，[X]隔着开放步道看工人怎样把竹条接上。家里也照管过类似的一小段，喜欢新旧竹色慢慢融在一起，来这里便自然多问两句养护。"},{"number":122,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_R02","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"整理小院的讨论里，[X]把竹旁木材围栏单独提出来。喜欢木纹在叶影里不太整齐的变化，换布局可以商量，表面这份温和却想保留，刷漆前也会先看木纹还在不在。"},{"number":123,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_R03","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"游园走到竹影下，[X]在石材矮墙边歇脚。石头的厚实和竹叶的轻恰好挨着，是自己庭院里也爱留的关系；坐下来后，反而不急着去下一个展区。"},{"number":124,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_R04","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"朋友想整理竹边小院，[X]提议先看现有金属围栏能否修整。喜欢框线干净地把竹子围住，不愿为了追古朴把金属全藏起来；平日自己的小院也留着这一段。"},{"number":125,"scenario_id":"SCN_PLANT_BAMBOO_1DF79CDCD13E8099_R05","dimension_id":"plant/bamboo/1df79cdcd13e8099","text":"周末修庭院，[X]把竹材围栏上裂开的条子拆下，挑相近的一根补回。自己喜欢竹材留下的节与细小差异，不要求每根一模一样；修好就能坐在活竹旁继续看风穿过去。"},{"number":126,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_M01","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"竹影移到石凳上，[X]便把书挟过去坐下。石面摸起来凉，稳稳托住身体，自己喜欢这种不随动作晃动的休息；在这里待惯了，经过院子也会先看石凳有没有空。"},{"number":127,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_M02","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"朋友来竹旁坐，[X]把木长椅上的落叶扫到一边，让大家挨着落座。喜欢能在同一条凳面上松松坐开、说话不用隔着小桌，平时一个人也愿意坐这一头看竹子。"},{"number":128,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_M03","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"午后的活儿做完，[X]把竹躺椅从门内挪到竹子旁。身体往后一靠，竹编细条贴着背，自己就不想急着起身；喜欢这种能把休息慢慢接下来的座具，不只是临时找把椅子。"},{"number":129,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_M04","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"竹子边的悬挂秋千轻轻动，[X]坐稳后只让它来回一点。喜欢脚尖偶尔碰地、身体还被托着的节奏，家人知道这一刻不必急着叫自己进屋，晚饭前总会留个短短空当。"},{"number":130,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_M05","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"院里的椅子换了位置，[X]仍先朝竹子旁那张石凳走。它不柔软，却有自己熟悉的凉和稳，喝水时坐一小会儿已很舒服；并不想给每次休息都垫成同样一层软。"},{"number":131,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_R01","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"竹园小憩，朋友想搬来一把软椅，[X]却拍了拍身边的石凳，请他也坐一会儿。自己喜欢竹影下石面那点凉和稳，在家浇完植物也常这样歇脚，不想把每次休息都垫得一样柔软。"},{"number":132,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_R02","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"安排小院坐人的地方，[X]先给竹旁木长椅留出长度。朋友可以并肩坐，自己也能把书放在另一头；爱的是长长一段木面让人自然放松，未必非要围桌才算待客。"},{"number":133,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_R03","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"听朋友谈阳台养植，[X]想起竹子旁那把竹躺椅。每天忙完照护往后一靠，背上就能感觉到竹编的细条，自己舍不得撤掉它去多摆两盆，休息也是喜欢这个角落的缘故。"},{"number":134,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_R04","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"在竹园散步，[X]经过悬挂秋千又走回来，坐下只轻轻晃着。自己家小院也有相似的座位，喜欢动得很小却能感觉时间慢下来的节奏，便不急着把整条步道走完。"},{"number":135,"scenario_id":"SCN_PLANT_BAMBOO_4BDB3EFBFC8541EE_R05","dimension_id":"plant/bamboo/4bdb3efbfc8541ee","text":"庭院翻新时，[X]把竹边石凳上的泥点洗净，先留出了它的位置。自己每天浇完竹子都愿坐一会儿，喜欢石面没有软垫也稳当的感觉，不想让休憩变成随手搬来一把塑料椅。"},{"number":136,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_M01","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"走到竹林里的石板铺面上，[X]不由得放慢脚步。脚底落在一块块石面上，缝里接着竹影，自己喜欢这种有分段又不零碎的路，晨间散步总绕这一段。"},{"number":137,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_M02","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"雨后竹林开了路，[X]先走向木栈道那一段。木板顺着前方一块块接下去，轻轻落脚会听见熟悉的声音；喜欢这份人在林里走的触感，不急着抄旁边更短的硬路。"},{"number":138,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_M03","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"竹旁散步的小路是卵石铺面，[X]穿着平日的鞋慢慢走过去。喜欢脚下细小起伏，走几步就自然把心思从别处收回；这段路不适合匆忙赶，也正是自己绕来这里的原因。"},{"number":139,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_M04","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"扫竹叶时，[X]沿着红砖铺面一点点往前清。叶子移开，砖缝重新接成细细的线，自己喜欢红砖在绿竹下这份暖；院里修过别的地方，这条路却没想改成统一灰面。"},{"number":140,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_M05","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"朋友提议把竹边小路铺成整片，[X]蹲下指了指石板铺面之间的缝。自己喜欢走路时有一块接一块的节奏，竹叶落在石面上也看得清；不是路越无缝才越愿意走。"},{"number":141,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_R01","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"植物园竹区有几条岔路，[X]先问哪条是石板铺面。在家附近就爱走这种石块接着前方的路，脚步能慢下来，竹影也一段段落得清楚；今天不必赶着走最短的一条。"},{"number":142,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_R02","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"小院整修，[X]沿着竹子旁原来的木栈道走了一遍。喜欢木板在脚下略有回应，不想为图统一把它全换成硬地；知道旧板要认真养护，也愿意留这份工夫。"},{"number":143,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_R03","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"参加园艺开放日，[X]没有从草边抄过去，而走完竹林里的卵石铺面。脚底细细的起伏让人自然放慢，自己家里那段小路也是因这份感觉才一直保留，愿意边走边辨哪处石子松了。"},{"number":144,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_R04","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"朋友问竹旁路径怎么收拾，[X]先说想留住红砖铺面。自己扫叶时总爱看砖缝一点点露出，红与绿接得很安稳；添几盆植物都可以，脚下这份暖色却不想一并抹掉。"},{"number":145,"scenario_id":"SCN_PLANT_BAMBOO_60E596F1396D11B9_R05","dimension_id":"plant/bamboo/60e596f1396d11b9","text":"游园到竹区，[X]在石板铺面的路口停下来等同伴。喜欢石板把脚步一块块接向里面，自己不赶时间时总愿选这类路；转进去后先看脚下，也给竹影留着注意。"},{"number":146,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_M01","dimension_id":"plant/grass/10973d0325a8d7fa","text":"草地上选好位置，[X]把野餐篮放稳，打开盖子一件件取出午饭。喜欢所有人围过来看里面还有什么的开场，家里准备户外简餐时，自己总愿意先把这个篮子收拾妥当。"},{"number":147,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_M02","dimension_id":"plant/grass/10973d0325a8d7fa","text":"朋友准备在长凳上吃点心，[X]从包里展开野餐垫，在草地上找了块平整处。喜欢大家放下鞋边的拘谨，挨着坐开；哪怕只带两只杯子，也愿意把这片可坐下的地方铺出来。"},{"number":148,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_M03","dimension_id":"plant/grass/10973d0325a8d7fa","text":"草地聚会刚到，[X]先把折叠椅撑开，坐下试一试是否稳。自己喜欢身体有靠、眼睛仍能跟着草地上的人走，平时一个人来读书也会带着；不是非得躺到地上才算休息。"},{"number":149,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_M04","dimension_id":"plant/grass/10973d0325a8d7fa","text":"营地草地边有合适的固定点，[X]把吊床收紧后才靠进去。喜欢身体被轻轻托住、能感觉一点摇动的休息，东西不多也会为它留一格，忙完准备便想空出这段时间。"},{"number":150,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_M05","dimension_id":"plant/grass/10973d0325a8d7fa","text":"收野餐时，[X]没有把空了的野餐篮交给别人，自己慢慢把杯布收回原位。喜欢一篮物件从家里带到草地、再完整带回的感觉，连只出去一小会儿，也不愿一律改成塑料袋。"},{"number":151,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_R01","dimension_id":"plant/grass/10973d0325a8d7fa","text":"商量露营分工，[X]先接下收拾野餐篮这件事。自己喜欢午饭从同一个篮子里慢慢摆到草地上，朋友知道不必急着把每样东西分给不同的人拿；这份一起打开的期待本就属于休息。"},{"number":152,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_R02","dimension_id":"plant/grass/10973d0325a8d7fa","text":"周末只够去附近草地待一会儿，[X]仍把野餐垫折进包里。坐下来便能把书和杯子放在身边，喜欢这种临时有了一小块自己的地方，时间短也不想一直站着赶完。"},{"number":153,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_R03","dimension_id":"plant/grass/10973d0325a8d7fa","text":"第一次与新朋友露营，[X]带的折叠椅被笑说有点占地方。等草地边坐稳，自己倒很自在，爱的是可以靠着慢慢说话，不急着用站立和来回走动填满空当。"},{"number":154,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_R04","dimension_id":"plant/grass/10973d0325a8d7fa","text":"露营结束前还有一点空，[X]没有马上收吊床，先进去躺了一会儿。喜欢人在草地边被托住、视线随轻晃慢慢动，去别的营地也会先问有没有合适位置，而不临时随意挂。"},{"number":155,"scenario_id":"SCN_PLANT_GRASS_10973D0325A8D7FA_R05","dimension_id":"plant/grass/10973d0325a8d7fa","text":"准备周末野餐，[X]在野餐篮里垫好干净布，手边那只普通购物袋仍空着。自己喜欢篮口一开大家就能慢慢取食的亲近，比只图拿东西快更重要；家人见了也知道这是要好好坐在草地上吃。"},{"number":156,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_M01","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"湖边的步道还没走完，[X]就靠在栏杆上，看深钴蓝的水一直延到远处。自己喜欢这种浓而沉的蓝，连带来的书也暂时没翻开；在湖边留时间，往往就是为了让眼睛在这片颜色上慢慢停下来。"},{"number":157,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_M02","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"回家的路绕过一段河岸，[X]走到能看见翡翠绿水面的那边，脚步就慢下来。树影不是重点，自己想看的是水色从流动里一块块聚拢；这条稍远的路，正因为有这段河面才值得走。"},{"number":158,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_M03","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"朋友建议直接坐车到下一站，[X]却想沿青碧色的湖水再走一段。自己喜欢这层蓝绿靠近岸边时的明亮，出发前就给湖边留了不赶车的空当，想让这份颜色慢慢接住一下午。"},{"number":159,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_M04","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"雨后的河水呈琥珀棕，[X]在桥上停住，觉得这才是自己熟悉又喜欢的河流神情。并不打算下水，也没有急着把它称为脏水；水带着泥沙往前走的颜色，让[X]愿意继续看两岸的生活。"},{"number":160,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_M05","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"收拾行李时，同行人发现[X]又给湖边留了一个空下午。到达后望见深钴蓝的水，[X]才把椅子放下；自己并不需要把所有岸线都走遍，只想有时间坐在这片深蓝旁边。"},{"number":161,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_R01","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"商量山里旅行去哪一段湖岸，[X]先提起深钴蓝的水。自己想带一壶茶在岸边待着，浓蓝的湖面越看越安定；这份停留的打算，比打卡名单上再多一个景点更重要。"},{"number":162,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_R02","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"营地旁的河水是翡翠绿，[X]提着空杯走到岸边，先找了个位置坐下。喜欢看这层绿色随水流分开又合拢，回来添茶也不着急；自己每回留在河边的时间，总有一段只是给这种颜色。"},{"number":163,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_R03","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"旅行回来，朋友问湖边有没有好玩的项目，[X]先描述青碧色的水怎样一直亮到岸边。自己没有租船也不遗憾，最想留的时间本就给了那段水色；再去别的湖，也会先想沿岸走一走。"},{"number":164,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_R04","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"营地旁的河水带着琥珀棕，[X]坐到能看见水绕过石头的位置。喜欢那层温暖的棕从急处散开、又在回水里聚拢，自己宁愿把这段休息留在这里，也不急着跟大家另找一条清蓝的小溪。"},{"number":165,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_6800BA9BF9417A9C_R05","dimension_id":"landscape/rivers_lakes_and_waterfalls/6800ba9bf9417a9c","text":"徒步路线从湖边经过，[X]把休息点留在看得见深钴蓝水面的地方。别的队友想找山顶，[X]已经满足于坐着看那片浓蓝；自己出门走路，也习惯让一段安静的水色成为歇脚的理由。"},{"number":166,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_M01","dimension_id":"people/detective/3998e9ab419e076c","text":"推理戏的开放排练里，[X]帮忙把侦探桌上的银行家台灯转回原位。绿罩下面一小片安稳的光，像给人物留住了思考的地方；自己追这类戏，除了谜底，也总记得侦探怎样在那盏灯旁坐下来。"},{"number":167,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_M02","dimension_id":"people/detective/3998e9ab419e076c","text":"推理游戏复盘时，[X]还想起扮侦探的朋友俯身调鹅颈台灯的动作。灯颈弯过去，桌上的线索才靠近人物，自己喜欢案头有这种能顺着思考挪动的灯，不愿把房间所有亮度一口气打开。"},{"number":168,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_M03","dimension_id":"people/detective/3998e9ab419e076c","text":"社团重排推理短剧，侦探要把资料从桌边拉近，[X]先调整了关节臂台灯。喜欢灯臂随人物动作展开的样子，平日讨论舞台里的侦探书房，也愿意把这一点说得比陈列了几本书更具体。"},{"number":169,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_M04","dimension_id":"people/detective/3998e9ab419e076c","text":"旧式侦探故事的朗读夜，[X]坐在场地方点起的煤油灯旁，听人物一页页核对证词。喜欢一小圈光把案头收近的感觉，读书会换了别的故事，自己也常惦记侦探守着这盏灯慢慢想明白的时刻。"},{"number":170,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_M05","dimension_id":"people/detective/3998e9ab419e076c","text":"侦探主题旧物展里，[X]绕过摆满放大镜的柜子，停在一张放着银行家台灯的桌前。对这种绿罩下的案头光很熟悉，自己谈起喜欢的推理作品，总愿意讲人物坐在灯旁还没得出结论的那一会儿。"},{"number":171,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_R01","dimension_id":"people/detective/3998e9ab419e076c","text":"推理读书会轮到布置朗读角，[X]提议给扮演侦探的人留一盏银行家台灯。自己喜欢人物在小小灯罩下整理思路的亲近感，谜底揭开以前那段安静，往往比最后的追逐更留得住自己。"},{"number":172,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_R02","dimension_id":"people/detective/3998e9ab419e076c","text":"朋友聊起侦探故事的书房，[X]顺手弯了弯桌上鹅颈台灯的灯颈，演示人物怎样把光移到证词边。自己喜欢这种灯能陪着人一点点查下去的感觉，读到类似场景也总会停下来想一想。"},{"number":173,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_R03","dimension_id":"people/detective/3998e9ab419e076c","text":"文化节排推理短剧，[X]看见侦探桌上的关节臂台灯又被收成一团，便把灯臂展开。自己觉得这盏灯应该像人物的手一样能伸到资料旁；熟悉[X]的同伴，也知道这正是其爱看侦探案头的部分。"},{"number":174,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_R04","dimension_id":"people/detective/3998e9ab419e076c","text":"读历史推理故事时，[X]把侦探案头那盏煤油灯记在书签上。参加读书会，先问的也是人物怎样添油、守着这点光读完证词；比起一间屋子全亮起来，自己更喜欢这份慢而有限的照明。"},{"number":175,"scenario_id":"SCN_PEOPLE_DETECTIVE_3998E9AB419E076C_R05","dimension_id":"people/detective/3998e9ab419e076c","text":"在推理主题咖啡馆等朋友，[X]没挑最亮的位置，而坐到侦探书房布置里那盏银行家台灯旁。自己喜欢人物和案头光贴得近的气息，一起读推理小说时，也常坐在这里慢慢谈尚未明白的线索。"},{"number":176,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_M01","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"庭院灌木开着白色的花，[X]把临时靠上去的木杆拿开。喜欢白花在叶间分得清楚，花开时就会给这一侧留一点空，不愿日常杂物把它遮成只剩一团绿。"},{"number":177,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_M02","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"回家经过院门，[X]又在开粉色花的灌木边停住。那点粉色不抢眼，靠近才慢慢显出来；自己喜欢这样柔和的花色，搬动门边物件时也总让视线能落到它上面。"},{"number":178,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_M03","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"花园里有多种花，[X]先把休息凳转向开紫色花的灌木。喜欢紫色一团团压在绿叶上的沉静，坐下以后不必另找一个更热闹的位置；这片角落也就成了平时最常歇脚的地方。"},{"number":179,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_M04","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"修剪灌木前，[X]认出一枝还开着黄色花，便先绕到另一边处理。喜欢这种暖黄亮在叶间，愿意按花期分开安排小活儿；不是花枝越多越好，只想给自己爱看的颜色留时间。"},{"number":180,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_M05","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"过节要在院里坐一坐，家人问要不要添彩饰，[X]指了指开红色花的灌木。自己喜欢叶间那点红，平日浇水也总先朝那边看；不必等到节日，颜色就已经够自己高兴。"},{"number":181,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_R01","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"园艺活动散场，[X]仍在白花灌木旁听养护说明。自己想把家里那盆也照顾到开白色花的样子，喜欢的不是统一名字，而是花从叶子里清楚浮出来的颜色。"},{"number":182,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_R02","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"植物园里，同伴想去温室，[X]想先沿开粉色花的灌木走一段。家附近也有这样粉粉的一片，每次经过都不太舍得快走；换一个地方，自己还是会被同样柔和的颜色留住。"},{"number":183,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_R03","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"整理阳台灌木，[X]没把开紫色花的那盆移到最里侧。朋友说里面更省地方，自己却想保留吃饭时能望见它的角度；紫花与叶子接在一起的样子，是这个小空间里最愿意照看的部分。"},{"number":184,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_R04","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"志愿园艺小组做花期记录，[X]分到另一片区域，仍先问开黄色花的灌木近况。喜欢那片黄在绿叶里提起的亮意，自己平日来散步也会朝它绕路，不只是在记录任务里才关注。"},{"number":185,"scenario_id":"SCN_PLANT_SHRUB_BAD9D48BA9C4FAE7_R05","dimension_id":"plant/shrub/bad9d48ba9c4fae7","text":"朋友请[X]看新栽的灌木，[X]走到开红色花的那株前，先看花和深绿叶子怎样挨着。自己家里也爱留这种红绿相接的角落，便想和朋友慢慢谈花期怎样跟上日常照护。"},{"number":186,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_M01","dimension_id":"landscape/desert/72cfa1080065fec0","text":"沙漠营地里，[X]把露营帐篷的门朝向开阔的一侧，坐在门口慢慢抖掉鞋里的沙。自己喜欢在一小片遮蔽和外面的空旷之间来回，宁愿搭好后多住一晚，也不急着把沙漠当成匆匆经过的路。"},{"number":187,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_M02","dimension_id":"landscape/desert/72cfa1080065fec0","text":"天刚亮，[X]背起徒步背包，把营地留在身后沿既定沙漠路线走。自己喜欢一天要用的东西贴着背、双手空出来的感觉；停下来时也把包放在伸手就能拿到的地方，愿意一路自己带着。"},{"number":188,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_M03","dimension_id":"landscape/desert/72cfa1080065fec0","text":"沙漠里的晚饭还没开始，[X]已经展开折叠露营椅，把杯子放在腿旁。有人准备直接坐地垫，[X]却喜欢在风沙旁有一把熟悉的椅子，能慢慢坐着陪大家说完一天见闻，不必急着站起来拍沙。"},{"number":189,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_M04","dimension_id":"landscape/desert/72cfa1080065fec0","text":"沙漠远处有鸟影，[X]取出双筒望远镜，在安全停留点靠稳手肘。自己喜欢不追过去也能慢慢辨认的观察方式，包里总给它留单独一格；这段有距离的观看，正是沙漠行程里最舍不得删的部分。"},{"number":190,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_M05","dimension_id":"landscape/desert/72cfa1080065fec0","text":"收营时，[X]把露营帐篷上的沙轻轻刷掉才折起。自己喜欢它在沙地上撑起的小小空间，不只把它当过一夜的工具；下一程是否还扎营，讨论行程时总会先把这份停留算进去。"},{"number":191,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_R01","dimension_id":"landscape/desert/72cfa1080065fec0","text":"朋友问第一次沙漠露营最想留下什么时间，[X]说想把露营帐篷搭好后坐在门边，看看沙地慢慢变暗。自己爱的是有个暂时的小窝又不隔绝外面，宁可少排一段车程，也想完整过完这段傍晚。"},{"number":192,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_R02","dimension_id":"landscape/desert/72cfa1080065fec0","text":"出发前试背徒步背包，[X]没急着问能多装多少东西，先绕院子走了几圈。自己喜欢在沙漠沿既定路线走时，随身物件都跟着身体、停下便能取到的节奏；想到这一段就愿意认真把包调顺。"},{"number":193,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_R03","dimension_id":"landscape/desert/72cfa1080065fec0","text":"露营分享时，[X]先讲沙漠晚饭前怎样摆开折叠露营椅。坐下后不用再找石头或垫高行李，才肯安心把茶慢慢喝完；下次商量要不要轻装，[X]仍愿意为这把能折起来的椅子留位置。"},{"number":194,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_R04","dimension_id":"landscape/desert/72cfa1080065fec0","text":"讨论沙漠旅行的装备取舍，[X]先把双筒望远镜放到要带的一边。喜欢停在不惊扰动物的位置看远处的动静，自己宁可少带一个娱乐小物，也不愿把这种安静远观的可能性丢掉。"},{"number":195,"scenario_id":"SCN_LANDSCAPE_DESERT_72CFA1080065FEC0_R05","dimension_id":"landscape/desert/72cfa1080065fec0","text":"第一次去沙漠露营的朋友来借露营帐篷，[X]把门帘展开，给他看自己常坐的那一小段入口。喜欢外面空旷、身后却有个能退回去的小窝；讲行程时，自己总会为这种停留说得比赶路更细。"},{"number":196,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_M01","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"竹子旁的矮方茶桌刚擦干，[X]把杯子搁近身前，坐得也低下来。喜欢手和茶都离身体不远，不必隔着高桌说话，独自歇脚时也愿意沿用这个位置。"},{"number":197,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_M02","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"家人围着竹旁圆石茶桌喝茶，[X]把空杯挪向另一侧，圆圆一圈便又连起来。自己喜欢人能顺着桌缘坐开，石面摸起来沉静；来几个人都愿意先到这一处慢慢安顿。"},{"number":198,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_M03","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"天气合适，[X]把竹制折叠茶桌从屋里提出，放到竹影下展开。喜欢茶桌收放时轻巧的竹条声音，一杯茶不必永久占住院子；喝完再合起，也像给休息留一个清楚结尾。"},{"number":199,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_M04","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"竹旁长木茶桌的一头留着[X]的茶杯，另一头还空着。喜欢人来了可以沿长桌慢慢坐下，不必立刻把东西全挤成一圈；平常一个人泡茶，也舍不得把这段木面铺得看不见。"},{"number":200,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_M05","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"院里要换坐茶的位置，[X]先把矮方茶桌挪到竹子旁试了一会儿。低低的方桌让自己自然把杯子收在手边，喜欢四边清楚而不疏远的分寸，不想一律换成餐厅那种高桌。"},{"number":201,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_R01","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"园艺小院重新摆东西，[X]先给竹旁矮方茶桌留一个能坐低的位置。浇完植物顺手放杯茶，身体不用在高桌前撑得端正；这份放松是平日愿意待在院里的缘由。"},{"number":202,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_R02","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"植物园休息区的竹旁有圆石茶桌，[X]放下水杯，看同伴怎样自然围过来。家里也愿用这种圆石桌，喜欢大家绕着桌缘各有一边，桌心不用堆满东西就能坐住。"},{"number":203,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_R03","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"朋友想在阳台竹边添永久茶台，[X]提起自己用的竹制折叠茶桌。喜欢喝茶时展开，照护植物又能收起来，竹条轻轻合拢的手感也熟悉；不必让一次下午茶把地方全占住。"},{"number":204,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_R04","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"下午茶约在竹旁，[X]先把长木茶桌一头的小物收起，给朋友留个位置。长长的木面可以从各自坐着慢慢接近，不必把所有话都挤在一小圈里，自己很喜欢这种待客的松弛。"},{"number":205,"scenario_id":"SCN_PLANT_BAMBOO_EB93683E0CE30E1F_R05","dimension_id":"plant/bamboo/eb93683e0ce30e1f","text":"游园回来讨论小院安排，[X]还惦记竹影下的矮方茶桌。自己平日喝茶就喜欢坐得低一点、杯子留在近处，看到园里也这样安置，便想问问怎样留足起身和照护植物的地方。"},{"number":206,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_M01","dimension_id":"plant/cactus/b74426c042ef80f0","text":"仙人掌要转个方向晒光，[X]托住圆柱盆的盆身慢慢转。喜欢一整圈没有突然折角的轮廓，手掌绕过去很熟；家里添新植株时，也会先找这种圆整的盆形。"},{"number":207,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_M02","dimension_id":"plant/cactus/b74426c042ef80f0","text":"窗台清好，[X]把仙人掌的方柱盆摆正。四面直直落下，和窗框靠在一起显得安稳，自己喜欢这份有棱有边的清楚；哪怕盆栽不多，也愿意让这一角保持这样的轮廓。"},{"number":208,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_M03","dimension_id":"plant/cactus/b74426c042ef80f0","text":"朋友看仙人掌总先问多高，[X]却先指了指下面的宽口碗盆。喜欢口沿宽宽展开，植株周围还能留一点看得见的土面；照护时不急着把盆塞满，宁愿让这份舒展留着。"},{"number":209,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_M04","dimension_id":"plant/cactus/b74426c042ef80f0","text":"收拾仙人掌架，[X]把六棱盆的一个角朝外转。光落到六面盆壁上，深浅分得清楚，自己喜欢这种转一点就换一面的轮廓；架子上的盆不用全一样，却会给它留位置。"},{"number":210,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_M05","dimension_id":"plant/cactus/b74426c042ef80f0","text":"陶艺体验要做种植盆，[X]先揉出圆柱盆的轮廓，打算给家里的仙人掌用。自己已经习惯每天托着这样的圆盆转向，手里做起来也想保持一整圈柔和，而不是追最特别的异形。"},{"number":211,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_R01","dimension_id":"plant/cactus/b74426c042ef80f0","text":"阳台换盆课上，[X]拿起圆柱盆让仙人掌试放进去。家里照护时最熟悉这种一圈转得顺的外形，这次也喜欢把棱刺分明的植株放进圆整轮廓里，材质换了也仍想保留这份对照。"},{"number":212,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_R02","dimension_id":"plant/cactus/b74426c042ef80f0","text":"办公室小角落要摆仙人掌，[X]把方柱盆带来，先让一个平面朝着座位。喜欢直线轮廓把植株托得很清楚，不是为了多挤下一盆；家里那株也一直用这种四面笔直的盆。"},{"number":213,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_R03","dimension_id":"plant/cactus/b74426c042ef80f0","text":"给仙人掌做盆托，[X]沿宽口碗盆的外轮廓试了几次，还是愿意让托面宽一点。喜欢宽盆口把植株舒展开，家里小盆栽也给这种横向尺度留地方，不为了省几厘米一律换窄盆。"},{"number":214,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_R04","dimension_id":"plant/cactus/b74426c042ef80f0","text":"手作分享里，[X]拿出给仙人掌用的六棱盆，让朋友看盆壁转到下一面时的光。自己喜欢棱角有秩序却不只四个面，擦盆时也会一面面慢慢过去，不急着把它当普通桶形。"},{"number":215,"scenario_id":"SCN_PLANT_CACTUS_B74426C042EF80F0_R05","dimension_id":"plant/cactus/b74426c042ef80f0","text":"花友把仙人掌小苗递来，[X]已经备好圆柱盆。对方笑说果然还是圆盆，[X]把盆托在手里，喜欢光顺着一整圈走过去；熟人记住的不是颜色，而是自己选盆总有这份柔和。"},{"number":216,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_M01","dimension_id":"plant/plant/4da5da96a8a58b14","text":"给盆栽擦叶后，[X]把带条纹的花盆转回正面。线条沿盆壁一条条接着，自己喜欢植物下方也有这样清楚的节奏，换了架子位置，仍会让这段纹样露出来。"},{"number":217,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_M02","dimension_id":"plant/plant/4da5da96a8a58b14","text":"午后的叶影落在棋盘格花盆上，[X]把手里的水壶放下看了一会儿。方格本来就有自己的秩序，影子一过又像多了一层，自己喜欢这份错动，盆沿旧了也还愿意用。"},{"number":218,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_M03","dimension_id":"plant/plant/4da5da96a8a58b14","text":"植物没到花期，[X]仍把花卉纹样的花盆放在常看见的一侧。喜欢叶子下面接着一点画出来的花，不用等植物真的开花才觉得角落有生气；选别的种植盆时也常留这类纹样。"},{"number":219,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_M04","dimension_id":"plant/plant/4da5da96a8a58b14","text":"孩子帮忙浇花，把波点花盆里的一株认出来，叫它小点点。[X]也笑着把盆转过去，自己挑这只时就喜欢圆点在叶片下轻快地散开；不必给每个盆都添上严肃整齐的线。"},{"number":220,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_M05","dimension_id":"plant/plant/4da5da96a8a58b14","text":"换新花架后，[X]没有把原来条纹的盆收进柜子，反而先给它留了位置。喜欢线条绕着容器走时把植物稳稳接住，盆里的植株可以慢慢换，这份图案节奏却不想丢。"},{"number":221,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_R01","dimension_id":"plant/plant/4da5da96a8a58b14","text":"阳台园艺分享，[X]把条纹盆放到苗旁，转到纹路没有被叶子遮住的一面。自己喜欢叶片自由散开，下面却有一圈清楚的线；家里添不同植物，也常给这种节奏留位置。"},{"number":222,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_R02","dimension_id":"plant/plant/4da5da96a8a58b14","text":"修补旧花盆的手作课上，[X]想保住外面的棋盘格，没有一口气盖成纯色。喜欢方格错开时的明暗关系，家里空盆也会先挑这种纹样再安顿植物，补痕不必抢走原来的格子。"},{"number":223,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_R03","dimension_id":"plant/plant/4da5da96a8a58b14","text":"花友交换空盆，[X]先拿起花卉纹样那只。家中有几株只看叶子的植物，自己喜欢盆壁仍带一小片花，花期之外也有这份轻松；挑中后还想问问怎样洗净不磨掉图案。"},{"number":224,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_R04","dimension_id":"plant/plant/4da5da96a8a58b14","text":"朋友帮忙安置新盆栽，[X]把波点的那只往外挪一点。家里不是每处都要对称，自己喜欢圆点留一点跳动感；照护时会顺手把水渍擦开，好让那些小点清楚地露着。"},{"number":225,"scenario_id":"SCN_PLANT_PLANT_4DA5DA96A8A58B14_R05","dimension_id":"plant/plant/4da5da96a8a58b14","text":"动手给空盆做外表装饰，[X]先保留了条纹的节奏。过去用过的几只盆虽颜色不同，都喜欢有线条绕着走；这回是真要把植物种进去用，也想让手工接着日常的审美。"},{"number":226,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_M01","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"院里灌木修整好，[X]先绕到兔形那一侧，看两只耳朵有没有被叶子遮住。喜欢活植物长成这种带点童趣的样子，经过时总会停一下；下一次修剪也想让这份轮廓继续留着。"},{"number":227,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_M02","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"花园小径旁有孔雀形的灌木，[X]请家人慢一点走。喜欢尾部展开的线条仍由绿叶撑着，季节换了还想来看轮廓怎样维持；不必摆一只真的鸟，也能有这种生动。"},{"number":228,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_M03","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"家人说院里的灌木该修得规整些，[X]却想继续保留心形。两边弧线接到一起显得亲近，自己每天出门会从这边看一眼；喜欢的不是今天恰好像心，而是愿意一直照料这份形。"},{"number":229,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_M04","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"修完院中螺旋形灌木，[X]沿着叶面的转折慢慢看。喜欢绿色顺着一圈往上接，扫落叶前也愿先绕一遍；植物还会长，照护这道线的工夫正是自己愿意留的部分。"},{"number":230,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_M05","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"朋友来访，想从灌木兔形的轮廓旁穿过去，[X]轻轻招呼大家沿原来的步道走。自己喜欢这个小家伙留在绿地里，每次枝叶长松了还愿意重新理耳朵，不想它只是短短一季的装饰。"},{"number":231,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_R01","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"植物园的造型灌木里，[X]在兔形前站得最久。自己家里也试着照护过这样的轮廓，知道耳朵和背部要慢慢维持；喜欢的是活叶子依旧长着，却能带着一点动物的神气。"},{"number":232,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_R02","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"园艺小组讨论下一次看什么，[X]提起花园里孔雀形的灌木。喜欢尾线一层层展开的精神，平日散步也会绕到那里看新叶怎样长回去；这回想听听园丁怎样维持它。"},{"number":233,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_R03","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"整理小院的建议很多，[X]还是给心形灌木留了原位。喜欢两侧弧线接在一起的温和，忙完浇水能从门边望一眼；照护并不轻松，却愿意保住这份活着的形。"},{"number":234,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_R04","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"开放日看园丁修整螺旋形灌木，[X]一直留意一圈线怎样接到下一圈。自己在家也爱把植物照护得有这样的节奏，愿意先问清枝叶生长，再慢慢维护，而不只追求剪完那一刻。"},{"number":235,"scenario_id":"SCN_PLANT_SHRUB_51F02B786DFD5A6A_R05","dimension_id":"plant/shrub/51f02b786dfd5a6a","text":"朋友把院子改得更简洁，[X]仍想留住角落的兔形灌木。手作聚会时常顺手帮它整理轮廓，喜欢绿叶组成的小动物陪着日常；不必把所有东西都换成直直齐齐才算整洁。"},{"number":236,"scenario_id":"SCN_PLANT_BAMBOO_268352B5C2DA17BA_M06","dimension_id":"plant/bamboo/268352b5c2da17ba","text":"竹丛边，[X]看见熊猫幼崽拨弄倒下的竹秆，没有马上跟着人群往下一处走。幼崽把竹秆拨过去又拖回来，自己喜欢这段竹子还没变成食物的玩耍，总愿意等它下一次怎样碰那根倒秆。"},{"number":237,"scenario_id":"SCN_PLANT_BAMBOO_268352B5C2DA17BA_R06","dimension_id":"plant/bamboo/268352b5c2da17ba","text":"讲起周末看动物的经历，[X]最先说熊猫幼崽拨弄倒下的竹秆那一段。别人记得吃竹的样子，自己却爱看幼崽怎样把一根倒秆试来试去；平日看自然科普，也会主动把注意留给这种玩耍而不是只找喂食。"},{"number":238,"scenario_id":"SCN_PLANT_BAMBOO_268352B5C2DA17BA_R07","dimension_id":"plant/bamboo/268352b5c2da17ba","text":"自然教育活动让大家选一段见闻分享，[X]挑了熊猫幼崽拨弄倒下的竹秆。自己喜欢竹秆被幼崽当成可以探索的东西，讲到它停下又伸爪时还舍不得跳过；去看动物前，也常先问当天能否见到这种活动。"},{"number":239,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_M01","dimension_id":"food/cake/7da6e87c987452b0","text":"蛋糕刚切开，整颗草莓随着奶油露出来，[X]把有整颗草莓夹层的一块移到自己面前。入口前先看一眼果实怎样嵌在蛋糕里，是[X]吃这种点心时的小习惯；不愿把能看见的草莓全压成酱。"},{"number":240,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_M02","dimension_id":"food/cake/7da6e87c987452b0","text":"给家里留的小蛋糕切开后，[X]用叉侧轻轻分出一层莓果果酱夹层。自己爱的是果酱在胚体间铺成细细一带的样子，吃的时候也先沿着这条界线分开，而不是把夹层和胚体搅成一团。"},{"number":241,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_M03","dimension_id":"food/cake/7da6e87c987452b0","text":"咖啡还没凉，[X]已经把那块有巧克力酱夹层的蛋糕切成几小口。叉子碰到稠厚的夹层时会稍停一下，等深色的一层完整露出来再吃；即便店里换了装饰，[X]点的仍是这种切面。"},{"number":242,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_M04","dimension_id":"food/cake/7da6e87c987452b0","text":"家人分蛋糕时给[X]留了有芒果块夹层的那一角。芒果块从奶油里露出来，[X]没急着把它们挑走，反而把叉子落在果块和胚体相接的位置；自己就喜欢一口点心里还能看清水果原来的块状。"},{"number":243,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_M05","dimension_id":"food/cake/7da6e87c987452b0","text":"小外甥把生日蛋糕上的水果一颗颗挑下来，[X]护住了自己那块的整颗草莓夹层。顶上的装饰可以拿走，切面里完整嵌着的草莓却舍不得拆散；这是[X]每次分这种蛋糕时真正想留住的部分。"},{"number":244,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_R01","dimension_id":"food/cake/7da6e87c987452b0","text":"烘焙课的蛋糕切开时，[X]先凑近看整颗草莓夹层有没有保持整颗的形状。练习本上没有忙着记花边做法，而是在夹层旁画了一个小截面；自己学做蛋糕，最想学会的就是把水果这样完整地留在里面。"},{"number":245,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_R02","dimension_id":"food/cake/7da6e87c987452b0","text":"朋友带来一块家做蛋糕，[X]掰开时见到莓果果酱夹层贴着胚体铺开，便沿着那层慢慢分成两半。对方知道[X]不爱把果酱只抹在最外面，特意让每一口都能带上切面里那道果酱层。"},{"number":246,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_R03","dimension_id":"food/cake/7da6e87c987452b0","text":"下午茶的蛋糕上桌，[X]看见巧克力酱夹层的厚度，先把叉子放到切面旁。对这种稠润深色夹层的兴趣，让[X]即使把上面的装饰分给朋友，也会把中间这一层完整地留在自己那份里。"},{"number":247,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_R04","dimension_id":"food/cake/7da6e87c987452b0","text":"试做水果蛋糕的晚上，[X]切开第一块，看见芒果块夹层还保留着果肉棱角，才松开手里的长刀。自己吃惯了有块状水果的夹层，这回也不想为了抹得齐整，把果肉压得只剩均匀颜色。"},{"number":248,"scenario_id":"SCN_FOOD_CAKE_7DA6E87C987452B0_R05","dimension_id":"food/cake/7da6e87c987452b0","text":"为朋友准备的生日蛋糕切开后，[X]把有整颗草莓夹层的一片放回转盘，想看清水果是否从这一侧也完整露着。即便不是自己过生日，做给别人的蛋糕也总会留下这种清楚可见的整果夹层。"},{"number":249,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_M01","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"地铁上座位空出来，[X]把织纹帆布背包抱到膝上，拇指顺着表面的织纹摩挲。背久了边角有些发白，自己却喜欢这种布用过后的样子；家人提起换新的，[X]先问的是还能不能找到这样的面料。"},{"number":250,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_M02","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"擦完背包，[X]把光滑皮革的表面顺着光转了一下，细小的使用痕迹并没有让自己嫌弃。喜欢皮面被手掌慢慢带出的柔润，所以平时擦包也耐心得多，不会为了每一道浅痕就急着换掉。"},{"number":251,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_M03","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"朋友帮[X]从衣帽架取包，手指碰到毛毡的表面，才明白为什么它总放在伸手就够到的位置。[X]喜欢那层柔软而不反光的触感，休息时把包抱在腿上，也不会急着丢到地上。"},{"number":252,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_M04","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"逛周末市集，[X]把藤编背包从肩上卸下来，让摊主看一处松了的编条。自己不想直接换成别的包，喜欢的正是这些编条交错时不完全一样的纹路；修好后还愿意继续背着逛。"},{"number":253,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_M05","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"整理出游用品时，[X]把织纹帆布背包挂回门后。它并不是容量最大的，包口却已经被手掌摸得柔软；自己喜欢这种布跟着身体活动的感觉，平日出门也总顺手拿它。"},{"number":254,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_R01","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"准备换一只通勤包，[X]摸过几种表面，最后又在织纹帆布前停下来。旧包的织纹已被手指磨得顺滑，自己要换的是背坏了的包带，不是想把天天碰到的这份布感也一起换掉。"},{"number":255,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_R02","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"出门旅行前，[X]擦去光滑皮革背包上的一点水印，把它留在第二天的衣物旁。家人知道这是要带走的那只，光滑皮面能随着擦拭恢复温润，正是[X]愿意照料它的原因。"},{"number":256,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_R03","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"在小店找日常背包，[X]把毛毡的那只抱在身前试了一会儿。自己在办公室也常把包放在腿旁，喜欢柔软又不反光的表面，不会因为换了工作地点就突然想要硬亮的包身。"},{"number":257,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_R04","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"旅行回来，[X]把藤编背包里的小物一件件倒出，发现一根编条有点翘。比起嫌它不够整齐，自己先想把编条按回原位；逛集市时愿意背的，就是这种能看见编织过程留下的起伏。"},{"number":258,"scenario_id":"SCN_FASHION_BACKPACK_23ADAE8BBCE0A610_R05","dimension_id":"fashion/backpack/23adae8bbce0a610","text":"刚换到新办公室，同事问[X]这只织纹帆布背包用了多久。[X]捏了捏已经柔软的包口，说颜色旧一点也没关系，自己最习惯的是这种摸得到织纹、用久了还愿意贴身背的布。"},{"number":259,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_M01","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"菜市场的面摊刚开门，摊主把米白色的面条拎起一把，[X]便知道是自己平日要的那种底色。汤头可以在家慢慢想，这份柔和的面色却已经熟悉；浓酱也不会一下全浇上去盖住。"},{"number":260,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_M02","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"手擀面下锅前，[X]拎起一绺金黄色的面条，让它从手指间垂回案板。朋友以为是在看宽窄，[X]却还在看那点温暖的黄；同样的配菜端上来，自己更愿意先夹起这种颜色的面。"},{"number":261,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_M03","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"面馆把汤分开端来，[X]很满意，碗里的面还能清清楚楚地呈着叶绿色。自己吃这种面时喜欢先留几口不拌酱，让那一抹绿先在碗里展开，之后才按胃口添汤。"},{"number":262,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_M04","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"黑色面条端上桌，朋友犹豫着没动筷，[X]倒先把自己的那份拨松。面条呈墨黑色时，白碗边缘显得格外清楚；比起把它藏进深色酱汁，[X]喜欢保留这种分明的对照。"},{"number":263,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_M05","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"父亲送来惯买的米白色面条，家人想换成颜色更鲜亮的一种，[X]却舍不得。自己喜欢这种淡淡的底色，一碗简单热面端上桌就踏实；配菜热闹些，也不想让面条本身处处争着显眼。"},{"number":264,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_R01","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"学做家常面时，[X]问的不是怎样把酱炒得更红，而是怎样让米白色的面条端上桌后仍看得见本来的颜色。平日吃面就喜欢这种淡底色，这次自己做，也想给汤汁留一点余地。"},{"number":265,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_R02","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"旅行住处一起煮早餐，朋友把几种面放到桌上，[X]先拿金黄色的那一份。自己喜欢这点暖黄给清淡的一餐提起颜色，出门也没忘熟悉的吃法；不必先知道某种配方，才能说清看着合胃口。"},{"number":266,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_R03","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"和朋友学做面，[X]把叶绿色的面条一绺绺晾到架上，想看这点绿在垂下时怎样连起来。自己吃面也爱留意面体颜色，这回亲手整理，仍舍不得让它们全压成看不清的一堆。"},{"number":267,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_R04","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"在外吃意面，[X]一见墨黑色的面体便停下翻菜单。服务员介绍口味时，[X]先问能否把酱另放；自己喜欢黑色面条与餐盘形成的对照，不想让所有颜色最后混成一片。"},{"number":268,"scenario_id":"SCN_FOOD_NOODLES_59A13BD3E7FC57A2_R05","dimension_id":"food/noodles/59a13bd3e7fc57a2","text":"朋友问起家里最常煮什么面，[X]指着正在沥水的米白色面条，先讲那种柔和底色。并不一定每次都做相同汤头，自己愿意留住的是端上桌仍像面条本来的样子，菜色可以在旁边热闹。"},{"number":269,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_M01","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"朋友试演侦探出场，[X]看着软呢帽的帽檐随转身露出一边眼睛，忍不住笑了。自己喜欢这种不必抬高声音就有点神气的样子，平日参加推理主题活动，也会把这顶帽子带在手边。"},{"number":270,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_M02","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"整理推理社团借用的服装，[X]先把猎鹿帽的两片帽檐理好。它一出现便让自己想到在户外追索线索的侦探，哪怕活动换成室内读书会，也愿意留它作开场的小道具。"},{"number":271,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_M03","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"推理短剧里的侦探穿得很普通，只有一顶贝雷帽，[X]反倒记住了这个人物。喜欢帽子松松偏在一侧、像刚从街上回来，不必把角色堆满标志性物件；自己讨论侦探形象时也常坚持这个分寸。"},{"number":272,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_M04","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"周末实景推理活动里，[X]给自己扮的侦探留了一顶渔夫帽。帽檐不硬撑架势，看着像随时能走进街角的小人物；自己喜欢侦探有这种平常感，不是每回都要像郑重亮相。"},{"number":273,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_M05","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"旧衣店里有一顶软呢帽，[X]先问能不能试一下。不是准备买整套侦探服，自己就喜欢帽檐压低一点时那份收敛的气势；参加推理聚会，熟人也常把这种帽子留给[X]。"},{"number":274,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_R01","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"聊到侦探人物怎样出场，[X]想起社团里那顶软呢帽，伸手比了比帽檐下的眼神。自己爱的是人物不必全副武装也有点警觉，做活动时才总愿意把这顶帽子留到最后收。"},{"number":275,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_R02","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"读书小组讨论户外追踪的侦探，[X]从活动袋里取出猎鹿帽，把两端帽檐理开。自己喜欢这份一眼带着行路意味的轮廓；不是所有故事都要用，但只要人物走进旷野，就会想到它。"},{"number":276,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_R03","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"为文化节排人物出场，[X]让侦探戴着贝雷帽试着走一遍。自己喜欢人物像从生活里刚转过身，帽子不抢台词，却留着一点松散气息；这也是平日看推理短剧会注意的地方。"},{"number":277,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_R04","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"朋友读到一个总在街上查访的侦探，[X]提起自己参加实景活动戴过的渔夫帽。喜欢那种随手扣上便能出门的普通感，已经磨软的帽檐也舍不得换得笔挺，人物不必时时显得在演一个侦探。"},{"number":278,"scenario_id":"SCN_PEOPLE_DETECTIVE_9D29BB1F39B4EC6E_R05","dimension_id":"people/detective/9d29bb1f39b4ec6e","text":"推理主题聚会要借帽子，[X]把软呢帽递给朋友，又看了看帽檐的转折。自己以前总先拿这顶，喜欢人物稍一低头、神态就收住的分寸；借出去之前，也忍不住想试一次。"},{"number":279,"scenario_id":"SCN_ANIMAL_BEAR_14910444FF307439_M06","dimension_id":"animal/bear/14910444ff307439","text":"讲解员准备带队离开，[X]还在看两只成年熊同行的熊。两只成熊各走各的，又不时停下来留意另一只；这种不围着幼崽展开的共同活动，正是[X]每回查熊类资料时愿意多看一段的内容。"},{"number":280,"scenario_id":"SCN_ANIMAL_BEAR_14910444FF307439_M07","dimension_id":"animal/bear/14910444ff307439","text":"自然教育小组交流读物，[X]选了讲两只成年熊同行的那一篇。最想弄懂成熊怎样相处，既不把它们说成必然亲密，也不只等冲突发生；自己读熊类资料，总会给这种不围着幼崽展开的关系多留一页。"},{"number":281,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_M01","dimension_id":"food/bread/78aa48dd0c672a24","text":"晨起切面包时，[X]把落在砧板上的白芝麻拢回自己的那片旁边。不是为了桌面干净，而是喜欢每一口都有这些小颗粒；家人见状，把另一片撒得更匀的也推了过来。"},{"number":282,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_M02","dimension_id":"food/bread/78aa48dd0c672a24","text":"面包房的师傅看见[X]，伸手指了指还没装袋、表面带黑芝麻的那一盘。[X]笑着点头，先闻到烘烤后的香气；来这家店时，自己总愿意等这一盘，而不是把任何刚出炉的都带走。"},{"number":283,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_M03","dimension_id":"food/bread/78aa48dd0c672a24","text":"分野餐面包时，[X]没有选最大的那块，而是把表面带南瓜籽的一片留在自己手里。果仁随咬下的边缘轻轻裂开，[X]还想起出门前特意把它放在最上面，免得表面这些配料被压掉。"},{"number":284,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_M04","dimension_id":"food/bread/78aa48dd0c672a24","text":"家里做面包的下午，[X]把燕麦片撒在已经整好形的面团上，掌心轻轻压了一下。比起藏进面团里，自己更喜欢吃时还能看见这些薄片，炉门一开便会先查看它们留得怎样。"},{"number":285,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_M05","dimension_id":"food/bread/78aa48dd0c672a24","text":"周末帮父母备早餐，[X]把带白芝麻的面包切成小块，掉下的颗粒也装进自己的盘子。母亲说不用替大家把每一片都弄成这样，[X]才发现自己按着平时最爱吃的那种做法分好了整篮。"},{"number":286,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_R01","dimension_id":"food/bread/78aa48dd0c672a24","text":"面包课上轮到撒表面配料，[X]拿起白芝麻，没有把它们揉进面团。老师问起原因，[X]说自己吃面包时就爱从表面这层先咬下去，想把那种熟悉的小颗粒也带进亲手做的面包。"},{"number":287,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_R02","dimension_id":"food/bread/78aa48dd0c672a24","text":"在家试做早餐面包，[X]把烤盘端出来，先去看黑芝麻有没有留住。朋友建议下次换成更厚的糖霜，[X]仍想把这种一眼能认出的黑点保留下来；自己吃早餐，总先伸手拿这一类。"},{"number":288,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_R03","dimension_id":"food/bread/78aa48dd0c672a24","text":"旅行时逛早市，[X]在撒着南瓜籽的面包摊前停下来，问能不能先买一小块边角。家里常吃这种配料的面包，想尝的是果仁连着面皮一起裂开的感觉，整条面包有多大倒不重要。"},{"number":289,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_R04","dimension_id":"food/bread/78aa48dd0c672a24","text":"带去办公室的自制面包剩了一片，[X]把表面的燕麦片轻轻压回去才装盒。同事说这点碎片可以不要，[X]却舍不得；那种薄片贴在面皮上烤过的口感，正是自己从早餐店学做面包的起点。"},{"number":290,"scenario_id":"SCN_FOOD_BREAD_78AA48DD0C672A24_R05","dimension_id":"food/bread/78aa48dd0c672a24","text":"朋友分来一篮刚烤好的小面包，[X]捏起带白芝麻的那只，先从撒得最密的边缘咬了一口。对方特意把这一只留在篮边，[X]平常吃面包的小习惯，早在一起准备早餐时就被记住了。"},{"number":291,"scenario_id":"SCN_PLANT_CACTUS_C599F22446F35406_M06","dimension_id":"plant/cactus/c599f22446f35406","text":"浇水时，[X]把呈砖红色的仙人掌转到自然光里看了看。喜欢这份砖红与细刺相接的颜色，选种时就问清植株正常时会呈什么色，不希望把临时缺水变色当作想留下的样子。"},{"number":292,"scenario_id":"SCN_PLANT_CACTUS_68C5AC0E631A161E_M06","dimension_id":"plant/cactus/68c5ac0e631a161e","text":"花友来家里，[X]先把带梳齿状刺的仙人掌转给她看。细刺一根根像梳齿般排开，自己喜欢这种有次序却仍细微变化的结构，平日看新株也总先凑近辨这一处，而不只问花色。"},{"number":293,"scenario_id":"SCN_FASHION_SHOES_D75A7A84A3C00666_M06","dimension_id":"fashion/shoes/d75a7a84a3c00666","text":"试鞋时，[X]转了转鞋上的旋钮，站起来走了几步又把松紧调回惯常位置。自己喜欢这种不用解开鞋带、能一点点找到合适紧度的动作，连不赶时间的周末也会先拿有旋钮的那双。"},{"number":294,"scenario_id":"SCN_ANIMAL_CAT_8780377B703B84B1_M05","dimension_id":"animal/cat/8780377b703b84b1","text":"猫在沙发上摊着前爪，尾巴只懒懒动了一下。[X]把身旁的位置腾出来，自己也慢慢坐下；猫这副慵懒松弛的样子，让一起过日子的节奏松下来，家里再忙也不愿把它催得总在应付人。"},{"number":295,"scenario_id":"SCN_ANIMAL_CAT_8780377B703B84B1_M06","dimension_id":"animal/cat/8780377b703b84b1","text":"猫从柜顶盯过来，眼神带着凶猛的劲头，[X]反而把手里的逗猫棒放低，给它留出俯视的位置。自己喜欢猫有这种不好惹的神气，并不需要它真的扑咬人，才能觉得相处有意思。"},{"number":296,"scenario_id":"SCN_ANIMAL_CAT_8780377B703B84B1_M07","dimension_id":"animal/cat/8780377b703b84b1","text":"收起逗猫棒时，[X]看见猫正慵懒松弛地伸展四肢，便把玩具留到它自己起身再说。自己喜欢家里有这种不必不断回应人的节奏，连给猫留的休息处也不放在忙着来回的门口。"},{"number":297,"scenario_id":"SCN_FASHION_PANTS_A4B47C81ABA10A3B_M06","dimension_id":"fashion/pants/a4b47c81aba10a3b","text":"朋友帮忙理裤脚，[X]拦住她想把两边拉成一样的手。这条裤子两边裤腿的轮廓不同，正是自己喜欢的地方；站直后仍一边收、一边放，平时搭上衣也会给这份不对称留出空间。"},{"number":298,"scenario_id":"SCN_FOOD_CAKE_63430C21BD61DB46_M06","dimension_id":"food/cake/63430c21bd61db46","text":"庆祝结束后收蛋糕，[X]把最后一片糯米纸做的可食帆形顶饰掰开分给身边的人。自己愿意用它做顶饰，正因为它能随着蛋糕一起吃掉；薄片立起来时像一小张帆，吃之前也舍不得随手揉成碎屑。"},{"number":299,"scenario_id":"SCN_FASHION_SHOES_8B9D454879A0AE96_M06","dimension_id":"fashion/shoes/8b9d454879a0ae96","text":"鞋匠让[X]试一试新做的鞋头，[X]低头看了看斜切鞋头的那条边，觉得正是自己想保留的样子。脚尖没有朝外歪，那道斜线却让整双鞋不那么板正，自己每次修鞋都舍不得把它改圆。"},{"number":300,"scenario_id":"SCN_FASHION_TOP_52DF0A51B06361D9_M06","dimension_id":"fashion/top/52df0a51b06361d9","text":"整理常穿的上衣，[X]把一件心形领的挂到外侧。朋友说这条领口已经穿得很熟，[X]沿着胸前那道柔和的弧线比了比；喜欢的是领缘自身的形状，换成素色布料也仍想保留。"},{"number":301,"scenario_id":"SCN_FASHION_TOP_AF587FB2721D904B_M06","dimension_id":"fashion/top/af587fb2721d904b","text":"手作课的扎染上衣晾干了，[X]看着扎染纹样在布上展开，没急着把渗开的边界修得更规则。自己衣柜里常穿的也是这种颜色彼此浸开的纹样，并不想把每一块都变成整齐重复的印花。"},{"number":302,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_M01","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"早饭掰开面包，里面的芝士夹心随着热气露了出来。[X]用手把两边撑开一点，让家人看看自己为何总买这款：夹心不必铺得满满的，只要切开时还能看见芝士怎样连在面皮之间，就已经很满足。"},{"number":303,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_M02","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"出门前吃点心，[X]把带巧克力夹心的面包切开，没有直接一口咬过去。刀面带起一点巧克力，[X]用面包边轻轻沾回来；自己每次吃这种夹心，都不愿把稠润的一层留在刀上。"},{"number":304,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_M03","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"朋友带了新做的卡仕达夹心面包来，[X]掰开后先看那团柔软的浅色夹心。烘焙时总想把这种细腻的部分留在中间，自己吃别人做的面包也一样，喜欢慢慢把面皮和夹心一起分开尝。"},{"number":305,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_M04","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"给父亲买的早餐装好了，[X]又单独拿了一只带红豆夹心的面包。掰开时还能看见细小的豆粒，自己从小就爱把这部分连着面皮留到最后两口，而不是只图面包外面烤得香。"},{"number":306,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_M05","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"面包刚凉到能拿，[X]掰开一只查看芝士夹心的位置。家人不急着分，知道[X]会先确认芝士没有全漏到烤盘上；做给家里吃的面包，自己最舍不得省掉的就是中间这一点。"},{"number":307,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_R01","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"面包课做夹心练习，[X]把芝士夹心包进面团，出炉后切开第一只给同桌看。学会把夹心留在里面，比做出漂亮花纹更让[X]高兴；自己买早餐时也总先找这种能吃到芝士的面包。"},{"number":308,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_R02","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"下午茶桌上，[X]把一块巧克力夹心面包分给朋友，自己留了切口最清楚的一半。深色夹心贴着面皮的样子很合自己的胃口，吃完才发现手指上也沾了一点，便用最后一小块面包把它带走。"},{"number":309,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_R03","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"第一次把卡仕达夹心包进自制面包时，[X]盯着切口里的夹心发愁，担心做得太少。朋友尝过说已足够，[X]还是想让下一盘切开时有一团更完整的卡仕达；这正是自己在面包店愿意多绕一段路买的那种。"},{"number":310,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_R04","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"旅行的早餐桌上有多种面包，[X]先拿了红豆夹心的那只，掰开后笑着说总会被这种细细的豆沙吸引。陌生地方的早点有许多新鲜样式，这一口却让[X]自然慢下来，没有急着去尝下一样。"},{"number":311,"scenario_id":"SCN_FOOD_BREAD_E88BB0B3C0EE942C_R05","dimension_id":"food/bread/e88bb0b3c0ee942c","text":"学做面包的朋友请[X]试吃，[X]刚掰开有芝士夹心的一只就认真看起切口。朋友记得[X]吃早餐常把芝士面包留到最后，想知道这回夹心有没有留住；两人还没聊外皮，先把中间这点分着尝了。"},{"number":312,"scenario_id":"SCN_FOOD_CAKE_A2498C16844727A9_M06","dimension_id":"food/cake/a2498c16844727a9","text":"家里分蛋糕，[X]从月牙形蛋糕底形的一端切下第一块，沿着弧线慢慢往中间分。圆形刀法在这里并不顺手，[X]却喜欢那道弯月留在盘中的样子，连做给家人的小蛋糕也常常保留这条外轮廓。"},{"number":313,"scenario_id":"SCN_FOOD_ICE_CREAM_90F6C0C34D4BAF3A_M06","dimension_id":"food/ice_cream/90f6c0c34d4baf3a","text":"散步买来的冰淇淋装在椰壳碗里，[X]吃完后把容器翻过来看了看。自己喜欢椰壳粗细不一的边缘，回到这条街时总会来这里坐一会儿，不是为了再换一种椰子口味。"},{"number":314,"scenario_id":"SCN_PEOPLE_PEOPLE_CE5094CBE3221412_M06","dimension_id":"people/people/ce5094cbe3221412","text":"社区戏剧招募角色，[X]更愿意排一段以中年人为主角的生活戏。人物要处理工作、照顾自己的生活，却不必急着年轻或衰老；自己喜欢这个阶段仍有选择、也已有经历的感觉，读剧本时常停在这种人物旁。"},{"number":315,"scenario_id":"SCN_PEOPLE_PEOPLE_CE5094CBE3221412_R06","dimension_id":"people/people/ce5094cbe3221412","text":"读书会讨论想继续读谁的故事，[X]先提起那位中年人主角。自己愿意听人物在已经走过一段人生后重新安排日常，而不只追成长开端或人生终章；书单里留下的几本也有这种共同重心。"},{"number":316,"scenario_id":"SCN_PEOPLE_SCIENTIST_A81CE3FAC31C8E32_M06","dimension_id":"people/scientist/a81ce3fac31c8e32","text":"科普开放日参观科考船实验室，[X]在固定台架旁停了很久，看科学家怎样把刚采回的东西稳稳放好。自己对研究在航行中继续进行这件事格外有兴趣，平日听科考分享也总先问船上的实验间怎样用。"},{"number":317,"scenario_id":"SCN_PEOPLE_SOLDIER_7082C551E5C716E4_M06","dimension_id":"people/soldier/7082c551e5c716e4","text":"营区开放日看制服，[X]在呈数码迷彩的那件前慢下来。近看是小小的方块，退远又聚成一整片，自己喜欢这种图案在不同距离下改变读法；并没有把穿着者的职位高低当作好看的理由。"},{"number":318,"scenario_id":"SCN_PEOPLE_SOLDIER_7082C551E5C716E4_R06","dimension_id":"people/soldier/7082c551e5c716e4","text":"修复旧衣的小组请来制服讲解员，[X]先问数码迷彩怎样把小块面组织成连续表面。自己平日看军服也爱这一点，走近能见方块、退后又能连成整体，想听的是图案本身，而不是把新样式套进任何时代。"},{"number":319,"scenario_id":"SCN_PEOPLE_SOLDIER_87E687B7635F4FFE_M06","dimension_id":"people/soldier/87e687b7635f4ffe","text":"仪仗展示开始，[X]先留意承担礼仪任务的军人怎样进退、交接。喜欢的是动作服务于共同仪式的分工，平日听服役经历时也愿意多问这一部分，而不只看制服亮不亮。"},{"number":320,"scenario_id":"SCN_ANIMAL_BUTTERFLY_4E97796F438B570D_M06","dimension_id":"animal/butterfly/4e97796f438b570d","text":"自然观察小组等蝴蝶飞起，[X]却想先看它停歇。触角和足在不离开花面的片刻里也有细小动作，自己平时观察就爱留这段时间，不把一趟有没有看见飞行当作收获多少。"},{"number":321,"scenario_id":"SCN_ANIMAL_CAT_7F053094A08FE92B_M06","dimension_id":"animal/cat/7f053094a08fe92b","text":"给家里无毛的猫整理窝，[X]用手背试过内衬才放回去。喜欢这类猫不被厚毛包住的轮廓，也认真习惯了它需要的细致照料；家人说换个省事的养法，自己仍愿意给这份相处留工夫。"},{"number":322,"scenario_id":"SCN_ANIMAL_CAT_F36E89593EEB72FD_M06","dimension_id":"animal/cat/f36e89593eeb72fd","text":"给猫换新的攀爬台，[X]看着它体态偏瘦地伸长身体，便把两级之间留出原来那段距离。自己喜欢它轻巧而线条清楚的样子，照护时仍按合适体况喂养，不靠少给食物去追这个轮廓。"},{"number":323,"scenario_id":"SCN_ANIMAL_DOG_0870B1233665CBE4_M06","dimension_id":"animal/dog/0870b1233665cbe4","text":"狗跑回门边，摇着极短的尾巴，整个后身也跟着摆。[X]笑着蹲下，最爱看它高兴时这点小动作；陪它散步时，也总先留意这个短短的信号，不需要一条长尾才能认出兴奋。"},{"number":324,"scenario_id":"SCN_ANIMAL_DOG_8780377B703B84B1_M06","dimension_id":"animal/dog/8780377b703b84b1","text":"邻居路过时夸狗看起来凶，[X]摸着牵引绳笑了笑。自己喜欢它凶猛的外形，却早把安静等待、听到口令再走的规矩练熟；有气势的样子和可以放心相处，并不需要牺牲掉其中一边。"},{"number":325,"scenario_id":"SCN_ANIMAL_DOG_8780377B703B84B1_R06","dimension_id":"animal/dog/8780377b703b84b1","text":"朋友带狗来家里，[X]蹲在门口，看它歪头等鞋带系好，忍不住又停了一会儿。自己喜欢狗这种可爱的神态，不必学会什么讨巧动作；平时在领养站帮忙时，也最容易被这些小表情留住。"},{"number":326,"scenario_id":"SCN_ANIMAL_DOG_A3A6B873D8DEC36A_M05","dimension_id":"animal/dog/a3a6b873d8dec36a","text":"警犬开放日演示结束，[X]留在场边听训导员讲警犬胸背怎样与工作配合。自己对这种贴身的任务装备格外有兴趣，尤其想看犬休息时胸背如何松解；比起把装备当作威风装饰，更在意它真实参与工作的样子。"},{"number":327,"scenario_id":"SCN_ANIMAL_DOG_A3A6B873D8DEC36A_R06","dimension_id":"animal/dog/a3a6b873d8dec36a","text":"犬类科普小组分着看一本工作犬读物，[X]先翻到介绍警犬胸背的一页。想知道犬在行动和休息时怎样与胸背配合，自己来参加活动也常先问这种装具，不把工作犬只当一个品种名字来认。"},{"number":328,"scenario_id":"SCN_ANIMAL_DOG_C179EA3F13C82A1A_M06","dimension_id":"animal/dog/c179ea3f13c82a1a","text":"亲戚带着柯基犬来串门，[X]刚坐下就被那双短腿带着的轻快步子吸引。家里的日历没特意换成犬类主题，但每次朋友约着看狗，[X]总先问有没有这种犬；自己喜欢的是它整个身形和行动的组合。"},{"number":329,"scenario_id":"SCN_ANIMAL_DOG_F36E89593EEB72FD_M06","dimension_id":"animal/dog/f36e89593eeb72fd","text":"宠物活动结束，狗站在阴影里休息，[X]沿着它体态偏瘦的侧面摸了摸。自己喜欢腰身线条清楚、走起来轻快的样子，和兽医讨论体重时也会先确认它在合适范围，不把越瘦越好当目标。"},{"number":330,"scenario_id":"SCN_FASHION_BACKPACK_6F4F3F37DBEC41C5_M06","dimension_id":"fashion/backpack/6f4f3f37dbec41c5","text":"把轻便小包背上肩，[X]先拉平窄肩带，不愿让它们叠成一条。自己喜欢窄带落在衣服上的轻巧线条，只装几样随身物也够用；真要背重东西时，才会换另一种包。"},{"number":331,"scenario_id":"SCN_FASHION_FASHION_6903A33C0941DBC7_M06","dimension_id":"fashion/fashion/6903a33c0941dbc7","text":"手作市集上，项链先放在小托盘里，[X]更想看它被人实际戴上时的样子。同伴试戴后，链子随转身落到衣领前，自己才看得明白；平日爱逛能自然试戴的摊位，也是想看物件怎样进入真实穿着。"},{"number":332,"scenario_id":"SCN_FASHION_FASHION_6903A33C0941DBC7_R06","dimension_id":"fashion/fashion/6903a33c0941dbc7","text":"傍晚出门，[X]把披肩折好拿在手里，没有一开始就披上。自己喜欢它搭在手臂旁、与走路节奏自然接着的松弛，朋友早知道这点，不会一见风就催着包得整整齐齐。"},{"number":333,"scenario_id":"SCN_FASHION_FASHION_77668A94EB542099_R06","dimension_id":"fashion/fashion/77668a94eb542099","text":"朋友邀[X]逛新开的衣店，[X]穿的仍是带运动感的日常搭配。不是下午要去训练，宽松而利落的运动气息本来就让自己自在；试新衣时，也先看能不能接进这身常穿的衣服。"},{"number":334,"scenario_id":"SCN_FASHION_NECKLACE_0E1313E1FDEDABF4_M06","dimension_id":"fashion/necklace/0e1313e1fdedabf4","text":"项链刚挂回颈间，[X]用指尖把小型吊坠从衣领边轻轻拨出来。自己喜欢它只占胸前很小一点位置，低头能察觉，走动时又不必总照看；衣服换了，吊坠的这个分寸却不想变。"},{"number":335,"scenario_id":"SCN_FASHION_PANTS_563339F82447B4E7_M06","dimension_id":"fashion/pants/563339f82447b4e7","text":"裤子改好后，[X]把上衣下摆提起一点，确认低腰还留在自己习惯的位置。裁缝原想顺手提高，[X]却喜欢腰线落得低些带来的松弛轮廓，平日配上衣也总为这条腰线让出空间。"},{"number":336,"scenario_id":"SCN_FASHION_PANTS_B63964446E71E21B_M06","dimension_id":"fashion/pants/b63964446e71e21b","text":"准备去朋友家吃饭，[X]换上曳地长度的裤子，走到门边又停下把裤脚理顺。自己喜欢布料一直落到鞋面、走动时轻轻带起的样子，知道地上若潮湿就换别的路走，也舍不得一律改短。"},{"number":337,"scenario_id":"SCN_FASHION_TOP_B63964446E71E21B_M06","dimension_id":"fashion/top/b63964446e71e21b","text":"整理上装时，[X]把腰线上方短款的那件搭回惯穿的裤子旁。不是天气热才穿短，自己喜欢下摆停在腰线上面时清楚分开的比例；就算天凉加一件外套，里面也愿意留着这个轮廓。"},{"number":338,"scenario_id":"SCN_FOOD_BREAD_4942E1A2ABD7712D_M06","dimension_id":"food/bread/4942e1a2abd7712d","text":"周末烤的小面包要带到草地分着吃，[X]让它们半裹着烘焙纸。上端露着，接过来就能掰一口，下半截仍有纸托住；家里给朋友分面包，自己总愿意按这种不必先拆完包装的吃法准备。"},{"number":339,"scenario_id":"SCN_FOOD_BREAD_80D0E8A8B48C1C73_M06","dimension_id":"food/bread/80d0e8a8b48c1c73","text":"面包出炉后，[X]没把大量面粉覆盖扫掉，咬下一口，鼻尖也沾了些面粉。家人递来纸巾时忍不住笑；[X]喜欢这种带着干粉感的表面，哪怕要多擦一次手，也舍不得全拍干净。"},{"number":340,"scenario_id":"SCN_FOOD_BREAD_D000EF851AA883C0_M06","dimension_id":"food/bread/d000ef851aa883c0","text":"烤盘边缘的面包已经焦黑烘烤，家人正想切掉那一圈，[X]先拦住了刀。自己喜欢少量尝那层强烈的焦香，拿到这种烤得很深的面包时，会把焦黑的边留下自己分着吃。"},{"number":341,"scenario_id":"SCN_FOOD_BREAD_D000EF851AA883C0_M07","dimension_id":"food/bread/d000ef851aa883c0","text":"家里的面包刚到浅度烘烤的程度，[X]便把烤盘端了出来。表皮还浅，家人想再烤一会儿，[X]却喜欢此时柔软、少了硬壳的口感，平常买的小餐包也会先挑这一类。"},{"number":342,"scenario_id":"SCN_FOOD_COFFEE_2215B4C3B48832A5_M06","dimension_id":"food/coffee/2215b4c3b48832a5","text":"夏日早饭还没做好，咖啡已经不再冒出明显热气，[X]这才把杯子移到手旁。自己喜欢能自然靠近杯口、不被热气扑脸，做饭时便先冲好放一会儿，而不急着边吹边喝。"},{"number":343,"scenario_id":"SCN_FOOD_COFFEE_2215B4C3B48832A5_M07","dimension_id":"food/coffee/2215b4c3b48832a5","text":"咖啡还热，[X]把杯子放在书旁，先读完一小段。等它不再冒出明显热气，才把手指收回杯把；自己喜欢让阅读与放凉的节奏接上，不必为喝一口不断停下来吹。"},{"number":344,"scenario_id":"SCN_FOOD_COFFEE_34F08ACC9D839491_M06","dimension_id":"food/coffee/34f08acc9d839491","text":"早饭时有人把奶壶推来，[X]摆摆手，把自己的黑咖啡端到窗边。不是今天忘了加，家里给[X]的杯子旁本就很少摆奶壶；自己喜欢咖啡单独留下的苦香，不想让这一口变成奶的味道。"},{"number":345,"scenario_id":"SCN_FOOD_COFFEE_34F08ACC9D839491_M07","dimension_id":"food/coffee/34f08acc9d839491","text":"下午在家冲咖啡，[X]倒奶时没有急着停，把杯里调成以牛奶为主的咖啡。朋友尝了一口说更像温热的奶饮，[X]点头，自己喜欢的正是咖啡退后一点、奶味占住大半杯的感觉。"},{"number":346,"scenario_id":"SCN_FOOD_COFFEE_60AE0D907EE8F5A7_M06","dimension_id":"food/coffee/60ae0d907ee8f5a7","text":"新开的咖啡店问[X]第一口怎么样，[X]先说起杯上厚油脂层的口感。自己喝浓缩时总先小抿一口这层绵密的油脂，喜欢它稍厚些，把后面的咖啡接住，而不是一入口就急着搅散。"},{"number":347,"scenario_id":"SCN_FOOD_COFFEE_A4A710F690F34084_M06","dimension_id":"food/coffee/a4a710f690f34084","text":"清晨要赶一段长路，[X]把容量大些的咖啡杯放进车内杯架。车还没开就先喝了一口，并不打算灌得很快；自己喜欢手里有一大杯可以慢慢喝，到了也常会把余下的一点带上楼。"},{"number":348,"scenario_id":"SCN_FOOD_COFFEE_BAD279EDA6E4A6A5_M06","dimension_id":"food/coffee/bad279eda6e4a6a5","text":"办公室的咖啡机旁有瓷杯，[X]仍取了惯用的纸质杯。杯壁轻，捧着走到桌边时有一点熟悉的软硬触感；这种随手带着走的杯子，反而让[X]更容易从忙碌里腾出喝咖啡的一会儿。"},{"number":349,"scenario_id":"SCN_FOOD_COFFEE_D55D5850289B45B4_M06","dimension_id":"food/coffee/d55d5850289b45b4","text":"咖啡课比较泡沫厚薄，[X]喝过后把自己那杯的表面调整好，只留薄薄一层奶泡。喜欢杯沿刚碰到嘴唇就能接上奶咖，而不是先含住一层泡；说起喝法，这才发现平日点单也总在意这一点。"},{"number":350,"scenario_id":"SCN_FOOD_ICE_CREAM_856DE0187BF86BAC_R06","dimension_id":"food/ice_cream/856de0187bf86bac","text":"散步到冰淇淋摊，朋友买了自己的一支，[X]却还想分享冰淇淋甜筒。不是省下一份；两人走慢一点，轮到谁拿就替对方转开快融化的一侧，这种边走边分一支的亲近感，才是[X]总想重来的部分。"},{"number":351,"scenario_id":"SCN_FOOD_NOODLES_96ABEFE35D0736A9_M06","dimension_id":"food/noodles/96abefe35d0736a9","text":"夜里煮面，[X]把极细的面条轻轻抖散才下锅。细细一绺能在筷尖上拢成柔软的一口，是自己很熟悉的吃法；即使家里换了汤头，也不会想把这种面全换成厚宽的。"},{"number":352,"scenario_id":"SCN_LANDSCAPE_DESERT_9A03DB5562CA61A2_M06","dimension_id":"landscape/desert/9a03db5562ca61a2","text":"陪住在沙漠边的亲戚往村外走，[X]看着一片小型沙丘接到路旁，想起自己总爱走这段。几步间就能看清起伏如何转向，不急着攀更高的沙峰；熟悉的是人与地形靠得近的尺度。"},{"number":353,"scenario_id":"SCN_LANDSCAPE_DESERT_A1B8B3E92AB662AE_M06","dimension_id":"landscape/desert/a1b8b3e92ab662ae","text":"商量沙漠出行条件，[X]说空气里没有明显扬沙时才愿意在营地外慢慢待着。喜欢沙面细纹不被飞沙遮住，也不想一直躲着眯眼；平日等天气窗口，也是为了这份清楚。"},{"number":354,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_073926E92249B967_M06","dimension_id":"landscape/forests_and_woodlands/073926e92249b967","text":"林间小跑结束，队友往混生树林去，[X]想先在树种单一的这一段走松。相似的树干一根根接着，呼吸也跟着安稳下来；自己平日选散步路，常给这份统一留位置。"},{"number":355,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_0ED5E0D60B5720C2_M06","dimension_id":"landscape/forests_and_woodlands/0ed5e0d60b5720c2","text":"自然观察活动结束，[X]还在树干没有苔藓覆盖的一段辨树皮。喜欢沟纹和颜色完整露出来的样子，平日来这里也总带着想认清的几种树；今天不必再多走一片林子，也愿意把这一段慢慢看懂。"},{"number":356,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_1C22F3B19B541730_M06","dimension_id":"landscape/forests_and_woodlands/1c22f3b19b541730","text":"林地里没有可见枯木，一段段站立树干直接接向地面，[X]把脚步停在了这里。喜欢视线不被横木反复截断，自己选林间休息点也总会留意这份完整的竖向关系，而不只问哪边离出口近。"},{"number":357,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_359394A0F16C5EDA_M06","dimension_id":"landscape/forests_and_woodlands/359394a0f16c5eda","text":"眼前树长得低矮，[X]没有像同伴那样急着往高大林区走。枝叶在较低处接住视线，自己喜欢还能望见天空、又被树围住的尺度，便在这里多绕一圈。"},{"number":358,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_413199E8FA900462_M06","dimension_id":"landscape/forests_and_woodlands/413199e8fa900462","text":"孩子想抱一抱树，[X]带他来到树干纤细的一段。手臂能比出完整一圈，自己也喜欢人与树还能这样照面；平日散步便常在这里停下，而不只追着最大的古树看。"},{"number":359,"scenario_id":"SCN_LANDSCAPE_FORESTS_AND_WOODLANDS_964ED74A25A96773_M06","dimension_id":"landscape/forests_and_woodlands/964ed74a25a96773","text":"自然观察小组让大家各选一处停留，[X]走向看不见明显菌菇或腐朽痕迹的那段新落木。喜欢树皮和断面还保有清楚边界，平日看森林也会先留意这种尚未显出腐朽的样子，愿意慢慢认它们原来的纹理。"},{"number":360,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_0B36C16BF6858C18_M06","dimension_id":"landscape/landscape/0b36c16bf6858c18","text":"朋友想把午休约在开阔河滩，[X]提起另一处空间被两侧围合起来的林间空地。自己在那里读书时，四边的树和坡把身边声音收近，坐下来更愿意久留；不是第一次才想找个遮挡。"},{"number":361,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_0B36C16BF6858C18_R06","dimension_id":"landscape/landscape/0b36c16bf6858c18","text":"讨论旅行去哪，[X]想找空间开敞的地方。到岸边能一眼看出去，肩膀也会松下来；不只海景，去草地或谷口，自己也会给这份开阔留时间。"},{"number":362,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_1949204373E1FC0E_M06","dimension_id":"landscape/landscape/1949204373e1fc0e","text":"走到城边一片未经维护的景观，[X]坐下歇脚。草木没有齐平的高度，小径顺着空隙拐弯，喜欢看生长自己找位置；这条路也就成了周末不急着折返的去处。"},{"number":363,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_1949204373E1FC0E_R06","dimension_id":"landscape/landscape/1949204373e1fc0e","text":"安排郊游，[X]先问那片精细养护过的花园是否开放。喜欢路径和树篱都看得到照料的分寸，走累时仍有清楚好走的一段，便能安心把注意力交给景色。"},{"number":364,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_4E6B14721DE020EC_M06","dimension_id":"landscape/landscape/4e6b14721de020ec","text":"自然活动要选一段地方慢慢看，[X]没有先登高，面对近处这一小段景物便坐了下来。几步内的石、水和草就能互相接上，自己喜欢把眼前这小块看得熟悉；平常来水边，也常这样留出一个下午。"},{"number":365,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_4E6B14721DE020EC_R06","dimension_id":"landscape/landscape/4e6b14721de0
