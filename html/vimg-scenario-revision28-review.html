20ec","text":"旅伴想回营地，[X]还想去看得到周围全景的位置站一会儿。刚走过的坡地、树林和水面终于能接起来，自己喜欢用这种整体关系收尾，不必再把每一处走近。"},{"number":366,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_AC24E1B6AF76A8DD_M06","dimension_id":"landscape/landscape/ac24e1b6af76a8dd","text":"修复后的河岸开放，[X]走到外观完好的一段就站住了。喜欢植物与岸线重新接成整体，也愿等围护撤掉再来；自己散步想看的是完整的风景，不需要灾损的戏剧性。"},{"number":367,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_AC24E1B6AF76A8DD_R06","dimension_id":"landscape/landscape/ac24e1b6af76a8dd","text":"户外小组路过明显受损的林地，[X]在开放位置听修复说明。断枝和裸露地表留下的经过很有意思，自己愿意弄懂这里发生过什么；喜欢看这些痕迹，不意味着盼望灾害再来。"},{"number":368,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_D33807B8C0FB7107_M06","dimension_id":"landscape/landscape/d33807b8c0fb7107","text":"站到河边，[X]发现远处的山脊也清清楚楚，便不急着往回走。远岸房屋和更后的山线能彼此分开，喜欢这份不费力的通透，平日散步也常为这样的视野多绕一段。"},{"number":369,"scenario_id":"SCN_LANDSCAPE_LANDSCAPE_D33807B8C0FB7107_R06","dimension_id":"landscape/landscape/d33807b8c0fb7107","text":"山中住处外有浓雾，[X]端着茶坐到门廊边，没有等雾散才开始休息。喜欢近树一层层淡进去的样子，来这里总会给这样的早晨留空；看不远，也不觉得这一段时间被耽误。"},{"number":370,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_7FB5FCB3482C822E_M06","dimension_id":"landscape/mountains_and_valleys/7fb5fcb3482c822e","text":"朋友问这次山谷路线有什么好看，[X]先比了比单独展开的一道山脊的轮廓。喜欢一条线从头到尾能慢慢看完，行程经过多层群山也不必全停；自己看山，总愿意给这种干净的整体留耐心。"},{"number":371,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_8267034A0F750002_M06","dimension_id":"landscape/mountains_and_valleys/8267034a0f750002","text":"知道山路这一带没有冰川，[X]反而更期待。喜欢岩面草坡直接露出山的线条，不总被大片冰川引走视线；到谷口看见眼前也是这样，便不急着换去热门冰川线。"},{"number":372,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_AEFC55C9CE4B40E6_M06","dimension_id":"landscape/mountains_and_valleys/aefc55c9ce4b40e6","text":"谷地山势平缓地展开，[X]终于把步子放慢。喜欢不用总仰头才能读清的山形，周末选路线也宁愿少点陡峭气势，留些可以平视的起伏。"},{"number":373,"scenario_id":"SCN_LANDSCAPE_MOUNTAINS_AND_VALLEYS_E2584AF997C0207C_M06","dimension_id":"landscape/mountains_and_valleys/e2584af997c0207c","text":"整理旧登山鞋准备再走山谷，[X]又选了谷宽狭窄的那条开放路线。记得两壁靠近时水声会跟着身边走，自己喜欢这份贴近；鞋底修好，首先想回去的仍是这一段。"},{"number":374,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_7DE4889D14E39E14_M06","dimension_id":"landscape/rivers_lakes_and_waterfalls/7de4889d14e39e14","text":"新观景台便于看大湖，[X]却先沿规模不大的水体走了一圈。对面的人与岸边树石能相互照应，喜欢这份亲近尺度，散步也更容易慢下来。"},{"number":375,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_D9E26EA4D1BCA865_M06","dimension_id":"landscape/rivers_lakes_and_waterfalls/d9e26ea4d1bca865","text":"家人想在流水响的河段喝茶，[X]却把壶带到静止水面旁。水面安静下来，人说话也不用抬高声，自己喜欢这份不被急流催着走的节奏；平日一个人歇脚，也总会回到这里。"},{"number":376,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_DCF13E12A3D49943_M06","dimension_id":"landscape/rivers_lakes_and_waterfalls/dcf13e12a3d49943","text":"对岸平缓好走，[X]却站在安全围栏后看陡峭的岸坡。土层向下切开，岸线显得有重量；喜欢这种陡岸，不会为凑近翻过围栏。"},{"number":377,"scenario_id":"SCN_LANDSCAPE_RIVERS_LAKES_AND_WATERFALLS_EE214D99987CA073_M06","dimension_id":"landscape/rivers_lakes_and_waterfalls/ee214d99987ca073","text":"涨水后步道关闭，[X]从开放平台看被水漫过的岸线。树根与浅滩被水接到一起，这种水陆边界的移动让自己很感兴趣；愿意等通道安全开放，再来慢慢看。"},{"number":378,"scenario_id":"SCN_LANDSCAPE_URBAN_LANDSCAPE_0F6D68A390E25A6F_M06","dimension_id":"landscape/urban_landscape/0f6d68a390e25a6f","text":"社区工坊搬进一幢工业主义建筑，[X]做完木活还留在门口看梁柱和大开间。喜欢结构本来怎样用就怎样露着，不必再盖一层繁复装饰；以后来上课，也愿意提前一点到。"},{"number":379,"scenario_id":"SCN_LANDSCAPE_URBAN_LANDSCAPE_75D47BFC9F77CF12_M06","dimension_id":"landscape/urban_landscape/75d47bfc9f77cf12","text":"参加街区声音漫步，[X]先走进一条狭窄的巷子。两侧声响离身体近，又能分出哪家在开门，正合自己平日爱走的城市尺度；不赶路时愿意把耳朵也交给这段街。"},{"number":380,"scenario_id":"SCN_LANDSCAPE_URBAN_LANDSCAPE_B3D64458F6FA6A36_M06","dimension_id":"landscape/urban_landscape/b3d64458f6fa6a36","text":"同伴嫌大型超级街区绕得远，[X]却想沿长边慢慢走完。喜欢整组建筑和内部空间连成片，转到角上才看见另一面；愿意花这点时间，不急着每几步换一个小街区。"},{"number":381,"scenario_id":"SCN_PEOPLE_ASTRONAUT_183F2D61CB40EA40_M06","dimension_id":"people/astronaut/183f2d61cb40ea40","text":"航天体验馆把两种宇航服复制品并排摆着，[X]先走近外面看不到外露管线的那件。喜欢轮廓连贯、装备收得紧的样子，谈未来载人任务时也总会留意这一点；不因为看不见管线就认定它没有供给系统。"},{"number":382,"scenario_id":"SCN_PEOPLE_ATHLETE_9B9599A06D7C7245_M06","dimension_id":"people/athlete/9b9599a06d7c7245","text":"社区球队发新衣，[X]试穿带单一队色的运动员制服，站到队友身边看了看。喜欢全队穿出一整块颜色的归属感，连休息日去看比赛，也会选这种配色的旧队服，而不只在上场时才穿。"},{"number":383,"scenario_id":"SCN_PEOPLE_ATHLETE_D100D8E3E53C7815_M06","dimension_id":"people/athlete/d100d8e3e53c7815","text":"做完一组敏捷练习，[X]把脚边那套训练器具重新铺平，等同伴也走一遍。自己喜欢运动员身边留着能直接练起来的器具，比如刚用过的敏捷梯；平日聊训练，也总先谈它怎样把脚步带顺。"},{"number":384,"scenario_id":"SCN_PEOPLE_DETECTIVE_FECEB17F8C36A09A_M06","dimension_id":"people/detective/feceb17f8c36a09a","text":"推理社团结束一轮活动，侦探角色用的仍是纸笔和实物工具。[X]还在翻那叠手写记录，喜欢能沿着纸上一处改动慢慢追索的过程；平日读同类故事，也总想把人物怎样观察和核对看得更清楚。"},{"number":385,"scenario_id":"SCN_PEOPLE_DETECTIVE_FECEB17F8C36A09A_R06","dimension_id":"people/detective/feceb17f8c36a09a","text":"谈到新近读的侦探故事，[X]愿意多讲先进数字技术参与推理的部分。不是设备一出场就算破案，喜欢人物解释数据从哪里来、哪里仍会误判；自己选同类作品时，也总留意技术怎样实际进入调查。"},{"number":386,"scenario_id":"SCN_PEOPLE_DETECTIVE_FECEB17F8C36A09A_R07","dimension_id":"people/detective/feceb17f8c36a09a","text":"读书小组争论侦探为何不直接调数据，[X]指着人物手里的笔记，谈起自己偏爱的纸笔和实物工具。纸上改动和当场观察让推理有可以跟随的脚步；自己愿意读这种工具有限、判断却逐渐长出来的故事。"},{"number":387,"scenario_id":"SCN_PEOPLE_SCIENTIST_E3E0869D201FA4FF_M06","dimension_id":"people/scientist/e3e0869d201fa4ff","text":"科学主题阅读活动里，[X]把讨论留给设定在未来的科学家。喜欢人物面对还没有熟练答案的问题，既能想象新方法，也得承认试验会失败；自己追这类故事，最想看的始终是科学怎样继续往前走。"},{"number":388,"scenario_id":"SCN_PLANT_BAMBOO_57FAEFFFC7438223_M06","dimension_id":"plant/bamboo/57faefffc7438223","text":"竹子旁整理落叶，[X]在一根粗壮的竹秆边停下。喜欢它直直撑起一大段绿影的分量，给院里添竹时也会先看秆的身量，不能只因叶子长得多就算合意。"},{"number":389,"scenario_id":"SCN_PLANT_BAMBOO_EADDDC1F51519824_M06","dimension_id":"plant/bamboo/eadddc1f51519824","text":"竹园导览讲到竹节，[X]先看节间紧密的那几根。喜欢一道接一道收得紧的节奏，家里照管的竹也常从这里看起；它长得高不高，倒不是每回最先问的事。"},{"number":390,"scenario_id":"SCN_PLANT_GRASS_2CBC993AE13CD018_M06","dimension_id":"plant/grass/2cbc993ae13cd018","text":"院里重新安排种植区，[X]想留一片供人日常活动的草坪。喜欢可以在低低的草面上放下脚步、坐着歇一会儿的感觉，宁愿给养护留时间，也不把整块地方全铺成硬地。"},{"number":391,"scenario_id":"SCN_PLANT_GRASS_2CBC993AE13CD018_R06","dimension_id":"plant/grass/2cbc993ae13cd018","text":"参观小花园，[X]在观赏草旁站住，看草叶随风从花坛边翻出来。自己家里也留着这样一丛，喜欢草能以自身线条参与景观，不只是供人踩过去的一层绿。"},{"number":392,"scenario_id":"SCN_PLANT_GRASS_5B78969B10221B35_M06","dimension_id":"plant/grass/5b78969b10221b35","text":"家人想把草地修得齐平，[X]先留下自然生长而未修整的那一角。喜欢高低不一的叶子自己找空间，坐在边上也能看风走过的层次；并不觉得每块草都要剪成同一高度才好亲近。"},{"number":393,"scenario_id":"SCN_PLANT_GRASS_5B78969B10221B35_R06","dimension_id":"plant/grass/5b78969b10221b35","text":"植物园草坪刚做完精细养护，[X]沿开放边缘慢慢走。喜欢边线清楚、草面起伏收得妥帖，家里也愿意花时间维护一小块；不是所有自然生长都要这样，只是自己最爱坐下的那种样子。"},{"number":394,"scenario_id":"SCN_PLANT_GRASS_8A8559CC0559AE75_M06","dimension_id":"plant/grass/8a8559cc0559ae75","text":"草坡上没有踩出的路，[X]便沿外侧原有道路慢慢看过去。喜欢草一直连着铺开、不被一条裸线切断，自己住处的绿地也希望留住这份连续，而不是为了走近几步踩出新路。"},{"number":395,"scenario_id":"SCN_PLANT_GRASS_8A8559CC0559AE75_R06","dimension_id":"plant/grass/8a8559cc0559ae75","text":"露营地通向草边有一条清楚露着土的小径，[X]按原来的痕迹慢慢走。喜欢脚下能读出人怎样经过，草又留在两旁；自己选散步地方也常留意这类自然留下的小道，不必全铺成硬路。"},{"number":396,"scenario_id":"SCN_PLANT_PLANT_323E0F193665A270_M06","dimension_id":"plant/plant/323e0f193665a270","text":"朋友建议把门边植物换成低矮的一盆，[X]却先看了看高大的株形。喜欢叶子长到能和人打个照面，浇水时也愿意抬手照管；家里腾位置，常会先为这种高大植物留一角。"},{"number":397,"scenario_id":"SCN_PLANT_PLANT_9FFCCDEDD571C4F5_M06","dimension_id":"plant/plant/9ffccdedd571c4f5","text":"回到家，[X]先到植物旁看它是否仍长得茂盛。新叶已经伸到平日坐的椅子边，自己便把椅子挪开一点，宁愿给这股长势让位置；照护想留下的，也正是植物有劲向外展开的样子。"},{"number":398,"scenario_id":"SCN_PLANT_PLANT_9FFCCDEDD571C4F5_R06","dimension_id":"plant/plant/9ffccdedd571c4f5","text":"园艺小组谈换季的植物，[X]说自己也喜欢它们衰退时的样子。不是希望养坏，仍按需要照料，只愿意看叶片渐稀、枝条露出来那段生命节奏，不急着把有衰意的一盆藏起来。"},{"number":399,"scenario_id":"SCN_PLANT_ROSE_5319758D826F5485_M06","dimension_id":"plant/rose/5319758d826f5485","text":"玫瑰花期过后，家人想把枝头清爽地剪一遍，[X]先留住挂着大量蔷薇果的几枝。喜欢圆圆的果实把枝条压得有分量，经过花坛还会停下来看看；这一段并不比开花时更想匆匆跳过。"},{"number":400,"scenario_id":"SCN_PLANT_ROSE_5319758D826F5485_M07","dimension_id":"plant/rose/5319758d826f5485","text":"换水时，[X]扶住带大量蔷薇果的玫瑰枝，只把遮住果簇的小叶理开。自己喜欢花后仍然充实的枝形，家里留瓶插的位置也不只给盛开的花；果实一簇簇挂着，这段季相同样愿意照看。"},{"number":401,"scenario_id":"SCN_PLANT_ROSE_5319758D826F5485_R06","dimension_id":"plant/rose/5319758d826f5485","text":"植物园导览走到玫瑰区，[X]先问能否多停一会儿看大量蔷薇果。花已经少了，枝上的果实却正合自己的兴趣；家里照料玫瑰也愿意保留结果的一段，不只把花谢当作结束。"},{"number":402,"scenario_id":"SCN_PLANT_ROSE_7E02541F6A74D0C4_M06","dimension_id":"plant/rose/7e02541f6a74d0c4","text":"花友捧来几枝玫瑰，[X]先拿起花朵很小的那枝。喜欢一小朵也能有完整细密的层次，不必靠巨大花头抢眼；家里留瓶插的位置不大，选花时却是先爱上这份分寸，才慢慢给它找地方。"},{"number":403,"scenario_id":"SCN_PLANT_ROSE_F94877B78E4EAEC8_M06","dimension_id":"plant/rose/f94877b78e4eaec8","text":"修整玫瑰枝，[X]戴好手套，把刺密集的那段转到眼前。喜欢枝条有这种细密锋利的骨气，不会为看着省事把刺全削去；平日照管也因此多留一点耐心。"},{"number":404,"scenario_id":"SCN_PLANT_SHRUB_4CDC03AF5043A6E5_M06","dimension_id":"plant/shrub/4cdc03af5043a6e5","text":"灌木根边的岩石介质露出一小片，[X]蹲下来拨开盖住的落叶。喜欢植物从岩隙里稳稳长出的关系，自己看园子时总会多留意这一处；并不需要把地下挖开，眼前的岩面和根际就够。"},{"number":405,"scenario_id":"SCN_PLANT_SHRUB_4CDC03AF5043A6E5_M07","dimension_id":"plant/shrub/4cdc03af5043a6e5","text":"院里补种灌木，[X]想保留根边砾石介质的外观，让枝叶从细碎的石面上长出来。喜欢这种松散颗粒和整株植物的对照，平日浇水也会顺手把被踢开的表层理回，留出自然的边。"},{"number":406,"scenario_id":"SCN_PLANT_SHRUB_4CDC03AF5043A6E5_R06","dimension_id":"plant/shrub/4cdc03af5043a6e5","text":"植物园的小坡上，[X]在根际有岩石介质的灌木旁停下。家里也喜欢保留这种岩与根相接的样子，愿意听园丁讲可见表层怎样照护；比只问花开得多不多，这段生长关系更吸引自己。"}]}
  </script>
  <script>
    const byId = id => document.getElementById(id);
    const batch = JSON.parse(byId('batch').textContent);
    const { records } = batch;
    const nameField = byId('name');
    const pageSize = 10;
    const pageCount = Math.ceil(records.length / pageSize);
    const pageLabel = byId('page-label');
    const template = byId('scenario-template');
    const decisions = new Map();
    let reviewer = '';
    let storageKey = '';
    let page = 0;

    function updateProgress() {
      byId('progress').textContent = '已审核 ' + decisions.size + ' / ' + records.length;
      byId('done').hidden = decisions.size !== records.length;
      byId('export').disabled = decisions.size === 0;
    }

    function save(record, decision, comment) {
      decisions.set(record.scenario_id, { decision, comment });
      try {
        localStorage.setItem(storageKey, JSON.stringify(Object.fromEntries(decisions)));
      } catch {
        byId('storage-note').hidden = false;
      }
      updateProgress();
    }

    function renderScenario(record, index) {
      const card = template.content.firstElementChild.cloneNode(true);
      const feedback = card.querySelector('form');
      const comment = card.querySelector('textarea');
      const status = card.querySelector('.saved');
      const pass = card.querySelector('.pass');
      const reject = card.querySelector('.reject');

      card.querySelector('.position').textContent = '第 ' + (index + 1) + ' 条';
      card.querySelector('.scene').textContent = record.text;
      feedback.id = 'feedback-' + index;
      reject.setAttribute('aria-controls', feedback.id);
      comment.id = 'comment-' + index;
      card.querySelector('label').htmlFor = comment.id;

      function showDecision() {
        const saved = decisions.get(record.scenario_id);
        const passed = saved?.decision === 'pass';
        status.hidden = !saved;
        status.textContent = saved ? (passed ? '已选 通过' : '已选 不够自然') : '';
        pass.setAttribute('aria-pressed', String(passed));
        reject.setAttribute('aria-pressed', String(saved?.decision === 'not_natural'));
        comment.value = saved?.comment ?? '';
        comment.setCustomValidity('');
        feedback.hidden = true;
        reject.setAttribute('aria-expanded', 'false');
      }

      pass.addEventListener('click', () => {
        save(record, 'pass', '');
        showDecision();
      });
      reject.addEventListener('click', () => {
        feedback.hidden = false;
        reject.setAttribute('aria-expanded', 'true');
        comment.focus();
      });
      comment.addEventListener('input', () => comment.setCustomValidity(''));
      feedback.addEventListener('submit', event => {
        event.preventDefault();
        const text = comment.value.trim();
        if (!text) {
          comment.setCustomValidity('请输入评论。');
          comment.reportValidity();
          return;
        }
        save(record, 'not_natural', text);
        showDecision();
        reject.focus();
      });

      showDecision();
      return card;
    }

    function renderPage() {
      const start = page * pageSize;
      const cards = records.slice(start, start + pageSize)
        .map((record, offset) => renderScenario(record, start + offset));
      byId('scenarios').replaceChildren(...cards);
      pageLabel.textContent = '第 ' + (page + 1) + ' / ' + pageCount + ' 页';
      byId('previous').disabled = page === 0;
      byId('next').disabled = page === pageCount - 1;
    }

    function goToPage(target) {
      page = target;
      renderPage();
      byId('progress').scrollIntoView({ block: 'start' });
      byId('scenarios').firstElementChild.querySelector('.pass').focus({ preventScroll: true });
    }

    byId('start').addEventListener('submit', event => {
      event.preventDefault();
      reviewer = nameField.value.trim();
      byId('name-error').hidden = Boolean(reviewer);
      if (!reviewer) {
        nameField.focus();
        return;
      }
      storageKey = 'vimg-simple-review:' + batch.records_sha256 + ':' + reviewer;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) ?? '{}');
        for (const { scenario_id } of records) {
          const entry = saved[scenario_id];
          if (entry?.decision === 'pass' ||
              (entry?.decision === 'not_natural' && entry.comment?.trim())) {
            decisions.set(scenario_id, entry);
          }
        }
      } catch {
        byId('storage-note').hidden = false;
      }
      const pending = records.findIndex(record => !decisions.has(record.scenario_id));
      page = pending === -1 ? pageCount - 1 : Math.floor(pending / pageSize);
      byId('start').hidden = true;
      byId('review').hidden = false;
      updateProgress();
      renderPage();
    });

    byId('previous').addEventListener('click', () => goToPage(page - 1));
    byId('next').addEventListener('click', () => goToPage(page + 1));
    byId('export').addEventListener('click', () => {
      const results = records
        .filter(record => decisions.has(record.scenario_id))
        .map(({ scenario_id, dimension_id, number }) => ({
          scenario_id,
          dimension_id,
          authoring_number: number,
          ...decisions.get(scenario_id)
        }));
      const payload = {
        schema_version: 'vimg_new_scenario_human_review_v2',
        release_id: batch.release_id,
        records_sha256: batch.records_sha256,
        reviewer,
        exported_at: new Date().toISOString(),
        total_scenarios: records.length,
        decisions: results
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = reviewer.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_') + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    });
  </script>
