name: Expire temporary HTML pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove expired temporary HTML files
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest_path = Path("html/.temp-manifest.json")
          if not manifest_path.exists():
              print("No temporary HTML manifest found.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          remaining = []
          deleted = []

          for item in manifest.get("items", []):
              expires_at = datetime.fromisoformat(
                  item["expires_at"].replace("Z", "+00:00")
              ).astimezone(timezone.utc)
              target = Path(item["path"])

              if now >= expires_at:
                  if target.exists():
                      target.unlink()
                      deleted.append(str(target))
                  else:
                      print(f"Already absent: {target}")
              else:
                  remaining.append(item)

          manifest["items"] = remaining
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          if deleted:
              print("Deleted expired temporary HTML files:")
              for path in deleted:
                  print(f"- {path}")
          else:
              print("No expired temporary HTML files.")
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A html
          git commit -m "Expire temporary HTML pages"
          git push
